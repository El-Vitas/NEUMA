services:
  postgres:
    image: postgres:18.4-alpine
    container_name: neuma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuma}
      POSTGRES_DB: ${POSTGRES_DB:-neuma}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuma} -d ${POSTGRES_DB:-neuma}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: neuma-postgres-data
