services:
  postgres:
    image: postgres:18.4-alpine
    container_name: company-brain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-company-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company-brain}
      POSTGRES_DB: ${POSTGRES_DB:-company-brain}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-company-brain} -d ${POSTGRES_DB:-company-brain}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: company-brain-postgres-data
