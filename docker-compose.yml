services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuma}
      POSTGRES_DB: ${POSTGRES_DB:-neuma}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Provisions the least-privilege neuma_app role on first init (see the script).
      NEUMA_APP_PASSWORD: ${NEUMA_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the first-boot server that runs the init scripts listens on the socket only, then restarts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-neuma} -d ${POSTGRES_DB:-neuma}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: apply Prisma migrations, then exit. Minimal image (only @neuma/db
  # with the Prisma CLI + schema/migrations) — no NestJS/backend/Bun.
  migrate:
    image: localhost/neuma-migrate:latest
    build:
      context: .
      dockerfile: packages/db/migrate.Dockerfile
    environment:
      # Migrations run DDL, so they connect as the owner, not the app role.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: localhost/neuma-backend:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3010}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3010}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads:/app/apps/backend/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  portal:
    image: localhost/neuma-portal:latest
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        BACKEND_URL: ${INTERNAL_BACKEND_URL:-http://backend:3000}
        NEXT_PUBLIC_LIVE_WS_URL: ${LIVE_WS_URL:-ws://localhost:3000/api/v1/blocks/live}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3010"
      BACKEND_URL: ${INTERNAL_BACKEND_URL:-http://backend:3000}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3000/api/v1/mcp}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      TRUST_CLOUDFLARE_IP: ${TRUST_CLOUDFLARE_IP:-false}
      ACCESS_TOKEN_MAX_AGE_SECONDS: ${ACCESS_TOKEN_MAX_AGE_SECONDS:-21600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${WEB_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
