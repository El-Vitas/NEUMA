id: FEA-ADJ
name: Files of a page
purpose: Defines which files a page accepts, how they are delivered to whoever consults them and what can be done with them.
scope: attachments
rules:
  - id: BR-6f62d11
    status: active
    title: A file says what it is and how much it weighs
    rule: >-
      A file on a page shows its name, the type it is and how much it weighs, using the words people use for that type.
    why: Before opening something, one decides whether it is worth it, and for that one needs to know what it is and how much it will cost to download.
    context: A file stored before the page recorded that data says nothing instead of saying something false.
  - id: BR-860b902
    status: active
    title: The system accepts what its interface promises to accept
    rule: >-
      A file within the size the interface announces must be uploadable. One that exceeds it is rejected with a message
      before being sent, never failing halfway.
    why: >-
      Promising ten megabytes and blowing up at one is lying to whoever uploads the file, and doing it with a technical
      error that brings the screen down instead of saying what happened.
    context: >-
      The transport limit has to be above the announced limit, because sending the file costs more than the file. It
      applies to attachments, the image icon and the cover alike.
    scenarios:
      - title: A large but allowed file
        given: A seven-megabyte file and an announced limit of ten
        when: It is uploaded to a page
        then: It is saved
      - title: A file over the limit
        given: An eleven-megabyte file and an announced limit of ten
        when: An upload is attempted
        then: It is rejected with a message that states the limit, and nothing is sent
  - id: BR-8f2657d
    status: active
    title: Explicit list of accepted types
    rule: >-
      A page only accepts file types from an explicit list, which today are images, documents, archives, plain text,
      audio and video in the formats a browser knows how to play.
    why: >-
      It is a list and not a general rule so that adding a type is a decision someone made, and everything else is
      rejected without having had to foresee it.
  - id: BR-aaf3a59
    status: active
    title: A file is delivered whole or by the requested chunk
    rule: >-
      When someone requests only a part of a file, the system delivers that part and says which part it is of the total.
      If no part is requested, it delivers the whole file.
    why: >-
      It is what allows jumping to minute forty of a recording without waiting for the thirty-nine before it. Always
      answering with the complete file leaves the playback bar frozen.
    context: >-
      Requesting a chunk that does not exist is answered by saying it is not available, not by delivering the whole file,
      because that would be answering a different question.
    scenarios:
      - title: Jump within a recording
        given: A long recording published on a page
        when: Whoever listens to it jumps to a late point
        then: The system delivers only the corresponding chunk and playback continues from there
  - id: BR-c251abd
    status: active
    title: A document travels to be read, the rest to be saved
    rule: >-
      A file that the page shows inside itself is delivered to be read right there. Any other is delivered to be saved on
      the computer of whoever requests it.
    why: >-
      Delivering a document as something to be saved makes the page show an empty frame and the file end up in a folder
      nobody asked for.
    context: >-
      The block's link always downloads the file with its original name, even if the document is being read on the page.
  - id: BR-c78adcb
    status: active
    title: A file downloads with its name and in one click
    rule: Any file of a page is downloaded with one click and arrives with the name it was uploaded with.
    why: A file downloaded with an invented name forces renaming it to recognize it afterwards.
  - id: BR-d3de47c
    status: active
    title: An agent uploads a file the same way a person does
    rule: >-
      An agent uploads a file to a page or to a row by sending it in base64 with its name and its type, and receives the
      id to put it in a files column. It goes through the same rules as the portal upload: up to 10 MB, only the accepted
      types, a valid name, and only on a page where its token can write. A page that the token has closed off answers as
      if it did not exist. A file that is not valid base64, is empty or exceeds the limit is rejected before anything is
      saved.
    why: >-
      What a person does in the portal an agent does through the MCP, and by the efficient path; an upload with looser
      rules would be the back door for storing what the portal does not allow.
    context: >-
      The file stays on the page it was uploaded to, and whoever sees that page opens it. Attaching it to a row is a
      separate step: putting the id in the files column.
    scenarios:
      - title: A type the portal rejects
        given: A token that writes to a row
        when: The agent uploads an executable
        then: It is rejected and the row gains no file
      - title: Upload and attach
        given: A token that writes to the collection
        when: It uploads a report to a row and puts its id in the files column
        then: The row lists it and the file downloads with its content
  - id: BR-f2bb3a7
    status: active
    title: Only files can be framed, and only inside the application itself
    rule: >-
      No screen of the application can be shown inside a frame on another site. The only exception is the files of a
      page, and only within the application itself.
    why: >-
      The viewer that draws a document reads it inside its own frame; denying that frame is denying the viewer. Outside
      that exception, allowing frames opens the door for another site to show the application as if it were its own.
