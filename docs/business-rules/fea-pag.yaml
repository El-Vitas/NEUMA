id: FEA-PAG
name: La vida de una página
purpose: Reúne las reglas de cómo nace una página, cómo se nombra, dónde vive y qué ocurre cuando cambia de sitio.
scope: pages
rules:
  - id: BR-03b8e1f
    status: active
    title: La exportación no abre una puerta que no existía
    rule: >-
      Una exportación entrega exactamente las páginas que quien la pide podría abrir de a una, con las menciones que no
      puede leer ya tapadas, igual que en pantalla. Pedir exportar una página fuera de su alcance se responde como se
      responde pedirla: no está disponible.
    why: >-
      Una exportación es la manera más barata de sacar un espacio entero de un solo gesto. Si leyera la base por un
      camino propio, cualquier permiso que se respete en pantalla dejaría de respetarse en el archivo, y nadie lo
      notaría hasta que el archivo ya salió.
    context: >-
      Por eso el servicio lee por la misma puerta que usa el listado del espacio, en vez de consultar el repositorio
      aparte.
    scenarios:
      - title: Un espacio ajeno no se exporta
        given: Una persona que no pertenece a un espacio restringido
        when: Pide exportar ese espacio
        then: No obtiene ningún archivo
      - title: Las menciones tapadas siguen tapadas
        given: Una página que menciona otra que quien exporta no puede leer
        when: Se exporta esa página
        then: El archivo muestra la mención con la etiqueta tapada, no con el título real
  - id: BR-0d64742
    status: active
    title: La vista previa se puede alcanzar y se puede entrar en ella
    rule: >-
      La tarjeta que aparece al descansar sobre el nombre de una página se queda mientras el puntero va hacia ella y
      mientras está encima. Desde la tarjeta se llega a la página que muestra.
    why: >-
      Una tarjeta que se va cuando uno baja a leerla no se puede leer, y una que no lleva a ninguna parte obliga a
      volver a la palabra que la abrió. Lo que se muestra tiene que poder alcanzarse.
    context: >-
      El espacio entre el nombre y la tarjeta pertenece a la tarjeta, así que bajar nunca es salir. Por llevar algo
      dentro que se puede alcanzar, la tarjeta no es un rótulo de ayuda.
  - id: BR-6191a45
    status: active
    title: Una página que cambia de espacio se lleva su descendencia y deja su dirección andando
    rule: >-
      Al mover una página a otro espacio, todas las páginas que cuelgan de ella cambian de espacio con ella. Las
      direcciones escritas antes del traslado siguen llevando a la página, ahora en el espacio donde vive.
    why: >-
      Una rama partida entre dos espacios deja hijas que nadie alcanza desde su madre. Y una dirección que deja de
      responder convierte cada enlace y cada mención escritos antes del traslado en un callejón sin salida.
    context: >-
      Cada página arrastrada avisa por su cuenta al índice de búsqueda, porque el índice registra a qué espacio
      pertenece cada una. Quien arrastra no queda como último editor de las hijas.
    scenarios:
      - title: La rama viaja entera
        given: Una página con hijas en un espacio
        when: Se mueve la madre a otro espacio
        then: Las hijas quedan en el espacio nuevo, colgando de su madre
      - title: La dirección vieja sigue sirviendo
        given: Una página que cambió de espacio
        when: Se abre una dirección que nombra el espacio anterior
        then: Se llega a la página en su espacio actual
  - id: BR-6f7f8a7
    status: active
    title: Lo privado responde a su dueña, y a nadie por encima de ella
    rule: >-
      Un área privada la ve únicamente quien la tiene y quien haya sido invitado a ella. Ningún papel dentro de la
      organización, ni el de mayor mando, alcanza lo privado ajeno: ni en el árbol, ni en la búsqueda, ni escribiendo la
      dirección a mano. Compartirla solo puede hacerlo su dueña, y quien la recibe no puede volver a compartirla.
    why: >-
      Un área privada que alguien más puede abrir no es privada; es una promesa rota escrita en la interfaz. Y si la
      excepción es para quien administra, entonces la promesa nunca fue cierta para nadie.
    context: >-
      El área de cada persona se crea sola la primera vez que mira sus espacios. Quien decide el acceso es un único
      punto que el resto del sistema hereda, para que ninguna pantalla pueda contestar distinto que otra.
  - id: BR-80536e4
    status: active
    title: Una página bloqueada no se escribe, ni por la pantalla ni por la vía de atrás
    rule: >-
      Una página bloqueada rechaza cualquier escritura de su contenido, su título y sus propiedades. El rechazo lo
      decide el servidor, no la pantalla. Quien tiene permiso para escribir en ella es también quien puede bloquearla y
      desbloquearla.
    why: >-
      Un candado que solo apaga los controles se salta con cualquier cliente que no los dibuje, y entonces no era un
      candado. Y un bloqueo que solo alguien más pudiera abrir dejaría la página congelada cuando quien la bloqueó no
      está.
    context: El servidor responde con el error PAGE_LOCKED y estado 409. El bloqueo guarda cuándo y quién lo puso.
  - id: BR-8d1f5e8
    status: active
    title: Registrar quién lee se puede apagar, y apagado no guarda nada
    rule: >-
      Se registra quién abre cada página y cuándo, y esa información solo la ve quien administra el espacio de trabajo.
      El registro se puede apagar; apagado, no se guarda ninguna visita nueva. Una misma persona no cuenta dos veces en
      la misma página dentro de una ventana corta de tiempo.
    why: >-
      Saber quién lee qué es dato sensible, y por eso tiene que poder apagarse de verdad y no solo dejar de mostrarse:
      una pantalla oculta sobre datos que se siguen guardando es lo contrario de lo que promete el interruptor.
    context: >-
      Fallar al registrar una visita nunca impide leer la página; el fallo queda en la bitácora y nada más. La ventana
      para no contar dos veces es de media hora.
  - id: BR-a096152
    status: active
    title: Una copia nace junto a su original y solo ella cambia de nombre
    rule: >-
      Al duplicar una página se copian su contenido, sus propiedades y su ícono. La copia queda inmediatamente después
      de la original entre sus hermanas. Se puede elegir si la descendencia se copia también, y esa pregunta solo
      aparece cuando la página tiene hijas. De toda la rama copiada, solo la página pedida se renombra.
    why: >-
      Una copia que aparece al final de una lista larga obliga a buscarla. Y renombrar también a las hijas ensuciaría
      cada nombre de la rama con una marca que no dice nada de ellas.
    context: >-
      La marca de copia la pone el portal, porque el servidor no sabe en qué idioma lee cada persona. Para dejar sitio a
      la copia se renumeran las hermanas que venían después.
  - id: BR-a2dc75d
    status: active
    title: Dónde se suelta una página dice si va dentro o al lado
    rule: >-
      Al arrastrar una página sobre otra en el árbol, soltarla en el centro de la fila la mete dentro y soltarla en el
      borde la deja al lado, antes o después según el borde. La marca dice cuál de las dos cosas va a pasar antes de
      soltar, y el orden que resulta se conserva al recargar.
    why: >-
      Anidar y ordenar son dos intenciones distintas y el mismo gesto tiene que servir para ambas; si soltar siempre
      significara lo mismo, el orden entre hermanas quedaría fuera del alcance del ratón. El centro es la parte ancha
      porque anidar es lo que se hace más seguido.
    context: >-
      Reordenar renumera la fila completa desde arriba: dos hermanas empatadas harían caer el siguiente arrastre donde
      nadie apuntó. Una página soltada junto a las hijas de otra madre primero cambia de madre y después se coloca.
  - id: BR-b3786ed
    status: active
    title: La posición de lectura se guarda por página y dura lo que la pestaña
    rule: >-
      Al recargar una página se vuelve al punto donde se estaba leyendo. Cada página recuerda el suyo por separado. En
      cuanto la persona se desplaza por su cuenta, se deja de restaurar y se empieza a anotar dónde quedó.
    why: >-
      Recargar una página larga y aterrizar arriba obliga a buscar de nuevo el párrafo que se estaba leyendo. Y seguir
      empujando la vista después de que la persona se movió sería pelearle el control.
    context: >-
      Se guarda en el almacenamiento de la pestaña, así que no viaja entre dispositivos ni sobrevive a cerrarla. Quien
      se desplaza es la caja de lectura dentro de la ventana, no el documento.
  - id: BR-c737a3f
    status: active
    title: Una página se hace vacía y se escribe después
    rule: >-
      Crear una página no exige nombre ni confirmación. La página se crea vacía, se abre con el cursor en su nombre, y
      lo que se escribe en ella se guarda solo.
    why: >-
      Un formulario antes de escribir obliga a decidir el nombre cuando todavía no se sabe de qué trata la página. El
      nombre es una de las cosas que se escriben en ella, no un requisito para empezar.
    context: Implica que el título puede quedar vacío en la base. Donde se lista, una página sin nombre se lee «Sin título».
    scenarios:
      - title: Se crea y se escribe
        given: Alguien con permiso de edición está en un espacio
        when: Pulsa crear una página
        then: La página existe de inmediato y se abre con el cursor en el título, sin ningún botón de confirmación
      - title: El nombre se guarda sin pedirlo
        given: Una página recién creada y sin nombre
        when: Se escribe un título y no se pulsa nada más
        then: El título queda guardado
  - id: BR-cb028f9
    status: active
    title: Lo que se exporta se lee como Markdown y sabe volver
    rule: >-
      Una página se exporta a Markdown. Lo que Markdown ya sabe decir —párrafos, encabezados, listas, tareas, citas,
      código, tablas, imágenes, separadores— se escribe con su propia sintaxis. Lo que Markdown no sabe decir se escribe
      de dos maneras según dónde viva: dentro de una línea, como enlace con su propio destino; como bloque, con una
      cerca de tres dos puntos que nombra el tipo y lleva sus datos. Exportar varias páginas produce un solo archivo,
      con cada página abierta por una marca que dice dónde vivía.
    why: >-
      Un Markdown que solo conserva el texto plano convierte la exportación en una copia de lectura y nada más: lo que
      sale no puede volver. Y un formato que se aparta de Markdown para ser reversible deja de leerse en cualquier
      editor, que es la única razón de elegir Markdown.
    context: >-
      Hay cosas que no pueden volver enteras y conviene decirlo: un bloque tomado de otra página sale como el texto que
      mostraba, no como el vínculo vivo. Un solo archivo en vez de una carpeta comprimida evita una dependencia nueva y
      hace más simple la lectura de vuelta.
  - id: BR-de71d1b
    status: active
    title: Se exporta una página, una rama o un espacio entero
    rule: >-
      Al exportar se elige cuánto sale: solo la página, la página con todo lo que cuelga de ella, o el espacio completo.
      A una página sin subpáginas no se le pregunta nada, porque no hay nada que decidir. Las páginas salen en el orden
      del árbol —la madre antes que sus hijas, y una hija antes que su hermana— y cada una lleva escrito el camino donde
      vivía. Las páginas en la papelera no salen.
    why: >-
      Quien exporta casi nunca quiere «todo o nada»: quiere llevarse un manual con sus anexos, o vaciar un espacio antes
      de cerrarlo. Sin la elección, la primera necesidad obliga a exportar de a una y la segunda obliga a repetir el
      gesto por cada página. Y un archivo con las páginas en desorden y sin decir de dónde vienen no se puede volver a
      armar.
    context: >-
      El orden y el camino los decide el mismo árbol que se ve en la barra lateral, para que el archivo se lea igual que
      se leía en pantalla.
    scenarios:
      - title: Una página sola no pregunta
        given: Una página sin subpáginas
        when: Se pide exportarla
        then: Se descarga el archivo de inmediato, sin preguntar nada
      - title: Una página con hijas pregunta
        given: Una página con subpáginas
        when: Se pide exportarla
        then: Se pregunta si salen también sus subpáginas, y la respuesta decide qué contiene el archivo
      - title: La papelera no sale
        given: Un espacio con páginas en la papelera
        when: Se exporta el espacio entero
        then: El archivo contiene solo las páginas vivas
  - id: BR-e92b734
    status: active
    title: Una página ilegible no se lleva el archivo entero
    rule: >-
      Si al exportar el cuerpo de una página no se puede leer, la página sale igual: con su nombre y su lugar en el
      árbol, y vacía por dentro. El resto del archivo se escribe completo.
    why: >-
      Perder un cuerpo es un daño menor que perder todo lo que alguien pidió llevarse. Un fallo que cancela la
      exportación entera deja a quien la pidió sin nada y sin saber cuál de cien páginas fue la culpable.
    context: Ocurre con contenido guardado por una versión del esquema que ya no se reconoce.
    scenarios:
      - title: El archivo llega igual
        given: Un espacio donde una página tiene el cuerpo guardado en un formato irreconocible
        when: Se exporta el espacio entero
        then: Se descarga el archivo con todas las páginas, y la ilegible aparece con su nombre y sin cuerpo
  - id: BR-f033642
    status: active
    title: Lo que la búsqueda sabe de una página se rehace cada vez que la página cambia
    rule: >-
      Renombrar una página o cambiarle la marca avisa al índice de búsqueda, igual que escribir en ella. Una página que
      se tira a la papelera o se borra deja de encontrarse, y ese olvido se pide con una versión que el índice pueda
      guardar.
    why: >-
      Una página renombrada que sigue encontrándose por su nombre viejo es una mentira que nadie corrige, porque nadie
      sabe que está ahí. Y un olvido que falla no se nota: la página desaparece de la vista y sigue apareciendo en los
      resultados de cualquiera.
    context: >-
      Cada cambio se anuncia una sola vez, distinguido por el momento en que se escribió. El índice proyecta fuera del
      servidor, así que el aviso viaja por la bandeja de salida.
