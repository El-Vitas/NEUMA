id: FEA-PAG
name: The life of a page
purpose: Groups the rules for how a page is born, how it is named, where it lives and what happens when it changes place.
scope: pages
rules:
  - id: BR-03b8e1f
    status: active
    title: Export does not open a door that did not exist
    rule: >-
      An export delivers exactly the pages that whoever requests it could open one by one, with the mentions they cannot
      read already covered, just as on screen. Asking to export a page outside their reach is answered the same way as
      asking for it: it is not available.
    why: >-
      An export is the cheapest way to take out a whole space in a single gesture. If it read the database through a path
      of its own, any permission that is respected on screen would stop being respected in the file, and nobody would
      notice until the file had already gone out.
    context: >-
      That is why the service reads through the same door the space listing uses, instead of querying the repository
      separately.
    scenarios:
      - title: A space that is not theirs is not exported
        given: A person who does not belong to a restricted space
        when: They ask to export that space
        then: They get no file
      - title: Covered mentions stay covered
        given: A page that mentions another that whoever exports cannot read
        when: That page is exported
        then: The file shows the mention with the covered label, not with the real title
  - id: BR-058dcbc
    status: active
    title: The side menu is brought up to date with what others do
    rule: >-
      When another person creates, moves, renames, reorders or sends to the trash a page that the menu shows, the menu
      reflects it without reloading and without requesting the whole space again. A page that the person cannot open is
      neither named nor counted.
    why: >-
      Two people working in the same space must not see different trees nor find out about a change by bumping into it.
    context: The notice only indicates which lists changed; what each person sees is requested again with their own permissions.
    scenarios:
      - title: Someone else's change
        given: Two people with the same space open
        when: One renames a page
        then: The other sees the new name in their menu in less than a second
  - id: BR-0d64742
    status: active
    title: The preview can be reached and entered
    rule: >-
      The card that appears when resting on a page's name stays while the pointer moves toward it and while it is over
      it. From the card you reach the page it shows.
    why: >-
      A card that goes away when you move down to read it cannot be read, and one that leads nowhere forces going back to
      the word that opened it. What is shown has to be reachable.
    context: >-
      The gap between the name and the card belongs to the card, so moving down is never leaving. Because it holds
      something inside that can be reached, the card is not a help tooltip.
  - id: BR-1091b9a
    status: active
    title: Sharing does not leave anyone without someone who can restore access
    rule: >-
      Before saving a permissions change, the screen warns what it costs whoever makes it. If they remove their own
      access, or lower their role so they can no longer change who has access, there is a warning and confirmation is
      requested, as long as another person with full access can still restore it. If after the change nobody would keep
      full access, the change cannot be saved. A client, or someone who cannot open the space, does not count as that
      person. The same applies to inheriting again from what is above.
    why: >-
      Whoever is left without full access cannot fix it, and if nobody keeps it, the page stays closed forever to those
      who could have fixed it.
    context: >-
      The server still accepts the change from whoever has full access; the protection belongs to the screen, which uses
      the same role rules as the server to know what would remain.
    scenarios:
      - title: Removing oneself when another person has full access
        given: A page with two people with full access
        when: One of them removes themselves from the list
        then: They are warned they will lose access, confirmation is requested and only then is it saved
      - title: Being left without full access
        given: A page where only the editor has full access
        when: That person lowers their own role to edit
        then: The change cannot be saved and it is explained why
  - id: BR-1224d28
    status: active
    title: A loose selection of pages is also exported
    rule: >-
      Besides a page, a branch or a whole space, the selection someone has marked in the sidebar is exported. Exactly the
      marked pages come out and no more: what hangs from a marked page does not travel unless it was marked too. They come
      out in tree order, each with the path where it lived. A selection that names no page is rejected, and whoever could
      not open one of those pages one by one does not receive it here either.
    why: >-
      Whoever takes material for a report picks pages that do not form a branch: three from one space and two from
      another part of the same one. Without selection they would have to export one by one and build the folders by hand,
      or export the whole space and delete what is left over.
    context: >-
      The limit is two hundred pages per selection, so that a query cannot ask for the world. Marking a page does not drag
      along its children because marking is an explicit gesture: if someone wants the complete branch, the branch already
      has its own scope.
    scenarios:
      - title: Two loose pages
        given: Two pages marked in the sidebar, from different branches
        when: The selection is exported
        then: An archive is downloaded with those two pages and the folders where they lived
      - title: Marking a parent does not drag the children
        given: A page with subpages, marked on its own
        when: The selection is exported
        then: Only that page comes out, without what hangs from it
      - title: An empty selection is not exported
        given: No page marked
        when: Exporting the selection is requested
        then: Nothing is exported and the button stays inactive
  - id: BR-1dfe765
    status: active
    title: A row button can create the row from a template of the chosen collection
    rule: >-
      A button that adds a row to a collection can carry a template chosen from that collection. When pressed, the row is
      created with that template; if it has none chosen, the collection's default template is used. What the button
      brings written, its title and its content, wins over the template.
    why: >-
      A "new incident" button must always be able to start from the incidents template even if the collection has another
      one by default.
    context: If the chosen template is deleted afterwards, pressing the button warns that the template no longer exists and does not create the row.
    scenarios:
      - title: The button uses its template
        given: A button with the "Incidencia" template and a collection whose default template is another
        when: The button is pressed
        then: The row is born with the content and values of "Incidencia"
  - id: BR-2a1ce65
    status: active
    title: What is searched is also found inside a longer word
    rule: >-
      A search of three letters or more finds the pages and blocks that have what was searched as a whole word and also
      those that have it inside a longer word, ignoring accents, diacritics and capitalization. First come those that have
      it as a whole word, then those that have it inside a word of the title and finally those that have it inside a word
      of the text. The signs the search engine uses as wildcards are searched as the characters they are. With fewer than
      three letters only the whole word is searched.
    why: >-
      People search by the piece of a name they remember. Whoever searches "safe" expects to find "ÜSAFE", and before it was
      not found. Also, it was enough for another page to have the whole word for the others to stay hidden.
    context: >-
      Typos are still forgiven as before, only when nothing appears in either of the two forms. Searching inside words
      scans the text of every page in the workspace; if the volume grows, an index over the accent-free text will be
      needed.
    scenarios:
      - title: A piece of the name
        given: A page called "ÜSAFE - Arquitectura"
        when: Someone searches "safe"
        then: The page appears in the results
      - title: The whole word first
        given: A page with the word "safe" and another with "ÜSAFE"
        when: Someone searches "safe"
        then: Both appear, and the one with the whole word comes first
  - id: BR-4139398
    status: active
    title: Opening a page does not wait for the rest of the space
    rule: >-
      Opening a page brings that page and what it names, not the other pages of the space. Taking the same time in a space
      of twelve thousand pages as in one of ten is part of what the person expects.
    why: >-
      A space grows without notice, and a page that takes seconds because the space is large tells the person that growing
      is punished.
    context: >-
      What a page names (mentions, subpages, relations and synced blocks) is requested along with opening it. The side
      menu and the rest of the space arrive separately and only as far as the person opens them.
    scenarios:
      - title: A large space
        given: A space with twelve thousand pages
        when: Someone opens one of them
        then: The page is drawn with its content and its names without loading the other eleven thousand nine hundred ninety-nine
  - id: BR-43e3ddc
    status: active
    title: Only whoever can change the list sees the list of people with access
    rule: >-
      Who has access to a page or to a part of it, with what role and where it comes from, is only told to whoever has full
      access over it. Whoever can read it but not administer it is answered that they cannot see it, without names or
      roles. Whoever cannot even read it is answered the same as if it did not exist, and the same if it is in the trash.
      Whoever cannot administer only knows that something has permissions of its own, with a padlock, and nothing more.
    why: >-
      The list of people is information for whoever administers. Answering differently to whoever cannot read a block would
      confirm that the block exists.
    context: >-
      The people offered to add are those of the workspace, and those who cannot open the space are flagged, because a
      role on a page does not open the space for them.
    scenarios:
      - title: A worker asks for the list
        given: A page open to the whole space where a worker can edit
        when: The worker asks to see who has access
        then: They are answered that they do not have full access, and receive no names or emails
  - id: BR-50fb993
    status: active
    title: What the search knows about a page is always what the page has
    rule: >-
      Renaming a page, changing its mark or writing in it changes what the search finds as soon as it is saved. A page
      that is thrown into the trash or deleted stops being found at that very moment, and a block that someone cannot read
      never appears in their results.
    why: >-
      A renamed page that is still found by its old name is a lie that nobody corrects. And a deleted page that is still in
      the results shows anyone something that no longer exists.
    supersedes: BR-f033642
    scenarios:
      - title: A page to the trash
        given: A page that is found by a word
        when: Someone throws it into the trash
        then: The next search for that word no longer shows it
  - id: BR-517fcae
    status: active
    title: The side menu shows what is opened and not the rows of a collection
    rule: >-
      The side menu lists the top pages, the path to the open page and the children of each page that is expanded, a
      hundred at a time. The rows of a collection do not appear in the menu, and neither does a page in the trash, except
      the one that is open.
    why: A menu that lists everything becomes unmanageable with the rows of a table, and the trash already has its own place.
    context: >-
      Rows are reached from the collection, the search, mentions and links. When there are more than a hundred pages under
      one, the menu offers to see more.
    scenarios:
      - title: A collection with thousands of rows
        given: A collection with four thousand rows inside a space
        when: The side menu is viewed
        then: The collection appears as a page without an arrow and none of its rows is listed
  - id: BR-6201333
    status: active
    title: A page created with a given identifier is created only once
    rule: >-
      When creating a page, the identifier it will have can be indicated. If the same request is repeated with that
      identifier, the system responds with the page it already created and does not create another.
    why: Whoever saves what was written offline sends the same thing again on return, and that must not duplicate the new rows.
    context: The identifier must be a UUID; any other value is rejected.
    scenarios:
      - title: Repeated request
        given: A row was created with a given identifier
        when: The creation is repeated with the same identifier
        then: The response is the same row and there is no second one
  - id: BR-6f7f8a7
    status: active
    title: What is private answers to its owner, and to no one above them
    rule: >-
      A private area is seen only by whoever has it and whoever has been invited to it. No role within the organization,
      not even the highest in command, reaches someone else's private area: not in the tree, not in the search, not by
      typing the address by hand. Only its owner can share it, and whoever receives it cannot share it again.
    why: >-
      A private area that someone else can open is not private; it is a broken promise written in the interface. And if the
      exception is for whoever administers, then the promise was never true for anyone.
    context: >-
      Each person's area is created automatically the first time they look at their spaces. Whoever decides access is a
      single point that the rest of the system inherits, so that no screen can answer differently from another.
  - id: BR-73da3c5
    status: active
    title: A copy is born next to its original and only it is renamed
    rule: >-
      When duplicating a page, its content, its properties and its icon are copied. The copy is placed immediately after
      the original among its siblings, also among a space's top-level pages. One can choose whether the descendants are
      copied too, and that question only appears when the page has children. Of the whole copied branch, only the
      requested page is renamed.
    why: >-
      A copy that appears at the end of a long list forces searching for it. And renaming the children too would dirty
      every name in the branch with a mark that says nothing about them.
    context: >-
      The copy mark is added by the portal, because the server does not know which language each person reads. The
      siblings are not renumbered; the copy is placed right after the original.
    supersedes: BR-a096152
    scenarios:
      - title: Duplicating a top-level page
        given: A space with three top-level pages
        when: The middle one is duplicated
        then: The copy appears right after it and the other two do not move
  - id: BR-80536e4
    status: active
    title: A locked page is not written, neither through the screen nor through the back door
    rule: >-
      A locked page rejects any write to its content, its title and its properties. The rejection is decided by the
      server, not the screen. Whoever has permission to write on it is also whoever can lock and unlock it.
    why: >-
      A lock that only turns off the controls is bypassed by any client that does not draw them, and then it was not a lock.
      And a lock that only someone else could open would leave the page frozen when whoever locked it is not around.
    context: The server responds with the error PAGE_LOCKED and status 409. The lock stores when and who put it.
  - id: BR-8b498e2
    status: active
    title: A page that changes space takes its descendants along and leaves its address working
    rule: >-
      When moving a page to another space, all the pages and blocks that hang from it change space with it, in a single
      step that is applied entirely or not at all. Addresses written before the move keep leading to the page, now in the
      space where it lives.
    why: >-
      A branch split between two spaces leaves children that nobody reaches from their parent. And an address that stops
      responding turns every link and every mention written before the move into a dead end.
    context: Whoever drags does not end up as the last editor of the children.
    supersedes: BR-6191a45
    scenarios:
      - title: The branch travels whole
        given: A page with children in a space
        when: The parent is moved to another space
        then: The children end up in the new space, hanging from their parent
      - title: The move fails halfway
        given: A page that is moved under a locked page of another space
        when: The move is rejected
        then: The page and its children stay exactly where they were
      - title: The old address still works
        given: A page that changed space
        when: An address that names the previous space is opened
        then: The page is reached in its current space
  - id: BR-8d1f5e8
    status: active
    title: Recording who reads can be turned off, and when off it stores nothing
    rule: >-
      Who opens each page and when is recorded, and that information is seen only by whoever administers the workspace.
      The recording can be turned off; when off, no new visit is stored. The same person is not counted twice on the same
      page within a short window of time.
    why: >-
      Knowing who reads what is sensitive data, and therefore it has to be possible to truly turn it off and not just stop
      displaying it: a hidden screen over data that keeps being stored is the opposite of what the switch promises.
    context: >-
      Failing to record a visit never prevents reading the page; the failure goes to the log and nothing more. The window
      for not counting twice is half an hour.
  - id: BR-93c3fc8
    status: active
    title: An unreadable page does not take the whole space down with it
    rule: >-
      When reading a space's pages, the one that this version does not know how to read is left out of the list and the
      others continue. That it was left out is recorded, saying how many and since which read, so that someone can go fix
      it. A space does not stop responding because of one of its pages.
    why: >-
      The list was read whole or not read at all, so a single page stored by another version, fixed by hand in the database
      or left half done by a migration made the read of the whole space fail, and then none of its pages could be opened.
      The damage of a spoiled page has to be that page, not everything that accompanies it. And leaving it out without
      saying so would be losing it all the same, only silently.
    context: >-
      It is the same idea that already governs export, where an unreadable page does not invalidate the entire file. A
      response that does not even arrive as a list is something else —not a spoiled page— and that one does cut the read.
    scenarios:
      - title: A page that cannot be read
        given: A space with several pages, one of them stored in a way this version does not understand
        when: Any page of the space is opened
        then: The page opens, and at the side all appear except the one that could not be read
      - title: What was missing is stated
        given: A list from which a page was left out
        when: The read finishes
        then: It is recorded how many were left out and since which read
      - title: A response that is not a list
        given: A response that does not arrive as a list of pages
        when: A read is attempted
        then: The read fails, instead of continuing as if the space were empty
  - id: BR-9a633a0
    status: active
    title: Search and backlinks are brought up to date in the same save
    rule: >-
      When a page changes, the search and the "Vinculado desde" section are brought up to date in the same save that
      changes it. There is no wait or separate notice that can be lost; if the save fails, none of the three changes.
    why: >-
      A new mention that takes time to appear in "Vinculado desde", or a renamed page that is not found by its new title,
      make people doubt everything else. A separate notice can be lost without anyone noticing.
    supersedes: BR-ac6957c
    scenarios:
      - title: A new mention
        given: A page that mentions another
        when: Someone saves the page
        then: At that same moment the page is found by its new text and the mentioned one shows it in "Vinculado desde"
  - id: BR-a2dc75d
    status: active
    title: Where a page is dropped says whether it goes inside or beside
    rule: >-
      When dragging a page onto another in the tree, dropping it in the center of the row puts it inside and dropping it
      on the edge leaves it beside, before or after depending on the edge. The mark says which of the two things will
      happen before dropping, and the resulting order is kept on reload.
    why: >-
      Nesting and ordering are two different intentions and the same gesture has to serve both; if dropping always meant
      the same thing, the order among siblings would be out of the mouse's reach. The center is the wide part because
      nesting is what is done most often.
    context: >-
      Reordering renumbers the whole row from the top: two tied siblings would make the next drag land where nobody
      pointed. A page dropped next to the children of another parent first changes parent and then is placed.
  - id: BR-ac96db4
    status: active
    title: Exporting is counted per person, and a few times per minute
    rule: >-
      Requesting an export has a cap on how many times in a row it is admitted per minute. It is counted by whoever
      requests and not by where they request from, because exporting requires a session and a whole office shares one
      address. Past the cap, the response is that it was requested too often, and no other door of the system is affected
      by that cap: signing in, renewing the session or creating an account keep being counted on their own.
    why: >-
      Exporting reads all the active pages of the requested scope, fetches their attachments and builds the file in
      memory: it is among the most expensive things the server does for a single request. A tab that retries on its own,
      or someone testing, takes the service down for everyone else. Counting by address would punish whoever shares an
      office and requested nothing.
    scenarios:
      - title: Exporting a few times
        given: A person who is signed in
        when: They request export within the per-minute cap
        then: Each export is delivered
      - title: Going over the cap
        given: A person who has already used up their per-minute cap
        when: They request another export
        then: They are answered that they requested too often
      - title: The other doors are not affected
        given: A person who has already used up their export cap
        when: They sign in again
        then: They get in normally
  - id: BR-b3786ed
    status: active
    title: The reading position is stored per page and lasts as long as the tab
    rule: >-
      When reloading a page, one returns to the point where one was reading. Each page remembers its own separately. As
      soon as the person scrolls on their own, restoring stops and noting where they ended up begins.
    why: >-
      Reloading a long page and landing at the top forces searching again for the paragraph that was being read. And
      continuing to push the view after the person moved would be fighting them for control.
    context: >-
      It is stored in the tab's storage, so it does not travel between devices nor survive closing it. What scrolls is the
      reading box inside the window, not the document.
  - id: BR-c737a3f
    status: active
    title: A page is made empty and written afterwards
    rule: >-
      Creating a page requires neither a name nor a confirmation. The page is created empty, opens with the cursor on its
      name, and what is written in it is saved on its own.
    why: >-
      A form before writing forces deciding the name when it is not yet known what the page is about. The name is one of
      the things written in it, not a requirement to begin.
    context: It implies that the title can be left empty in the database. Where it is listed, a page without a name reads "Untitled".
    scenarios:
      - title: It is created and written
        given: Someone with edit permission is in a space
        when: They press create a page
        then: The page exists immediately and opens with the cursor on the title, without any confirmation button
      - title: The name is saved without asking
        given: A newly created page with no name
        when: A title is written and nothing else is pressed
        then: The title is saved
  - id: BR-c9aaeaa
    status: active
    title: A page in the trash is not written, neither through the screen nor through the back door
    rule: >-
      A page in the trash rejects any write to its content, its title and its properties, whether it comes from the
      editor, the API or an agent. To change it, it is first brought back. The rejection is decided by the server.
    why: >-
      What is in the trash is on its way out: nobody sees it in the tree nor finds it when searching. A change there is
      read by nobody, and on restoring it something would appear that nobody reviewed.
    context: >-
      The server responds with the error PAGE_INVALID_LIFECYCLE and status 409. The agent is told to restore it first or
      to ask a person.
    scenarios:
      - title: An agent writes to a deleted page
        given: A page in the trash
        when: An agent adds a block to it
        then: Nothing is written and it is told to bring it back first
  - id: BR-d5883eb
    status: active
    title: Deleting forever waits 30 days and is decided only by an administrator
    rule: >-
      Emptying the trash or deleting a page forever does not delete it on the spot. The page stays in the trash with the
      date on which it will be deleted, 30 days later, and until then anyone with access can restore it. Only an
      administrator can request that it be deleted forever. Each request is recorded with who made it, the page and how it
      ended, deleted or cancelled by a restore.
    why: >-
      An immediate deletion has no way back, and emptying a space's trash takes away the work of many people in one gesture.
      The waiting period gives time to notice the mistake, and the record says who requested it even if the page no longer
      exists.
    context: >-
      The server deletes every hour whatever has passed its date, and only then deletes the attached files. Restoring the
      page before the deadline cancels the deletion. An agent cannot delete forever.
    scenarios:
      - title: An administrator empties the trash
        given: A space with pages in the trash
        when: An administrator empties the trash
        then: The pages stay in the trash with the date they will be deleted, and are recorded in their name
      - title: Restored before the deadline
        given: A page scheduled for deletion
        when: Someone restores it before the date
        then: The page comes back with its content and the record is left as cancelled
      - title: Someone who does not administer tries to delete
        given: A person with the worker role
        when: They request to delete a page from the trash forever
        then: It is rejected and the page is not scheduled
  - id: BR-d829da6
    status: active
    title: What is exported reads as Markdown and knows how to come back
    rule: >-
      A page is exported to Markdown. What Markdown already knows how to say —paragraphs, headings, lists, tasks, quotes,
      code, tables, images, separators— is written with its own syntax. What Markdown does not know how to say is written
      in two ways depending on where it lives: inside a line, as a link with its own destination; as a block, with a fence
      of three colons that names the type and carries its data. Each page produces its own file. Exporting several
      delivers an archive whose folder structure is the hierarchy the pages had. A collection always comes out archived,
      because it is many pages at once.
    why: >-
      A Markdown that keeps only plain text turns the export into a reading copy and nothing more: what comes out cannot
      come back. And a format that departs from Markdown in order to be reversible stops being readable in any editor,
      which is the only reason to choose Markdown. One file per page is what any tool that reads Markdown expects, and
      folders are how a hierarchy is expressed without inventing syntax.
    context: >-
      Replaces the previous rule, which said that several pages came out in a single file with a mark per page. That was a
      design decision taken while building, not a product decision, and it was not the right one. It is still true that
      some things do not come back whole: a block taken from another page comes out as the text it showed, not as the live
      link.
    supersedes: BR-cb028f9
    scenarios:
      - title: A single page
        given: A page without subpages
        when: It is exported
        then: A Markdown file with that page is downloaded
      - title: A branch
        given: A page with subpages
        when: It is exported with them
        then: An archive is downloaded with one file per page and the folders reflecting the hierarchy
      - title: A collection
        given: A collection with its rows
        when: It is exported
        then: An archive is downloaded, because each row is a page and there are many
  - id: BR-de71d1b
    status: active
    title: A page, a branch or a whole space is exported
    rule: >-
      When exporting, how much comes out is chosen: only the page, the page with everything that hangs from it, or the
      complete space. A page without subpages is asked nothing, because there is nothing to decide. The pages come out in
      tree order —the parent before its children, and a child before its sibling— and each one carries written the path
      where it lived. Pages in the trash do not come out.
    why: >-
      Whoever exports almost never wants "all or nothing": they want to take a manual with its appendices, or empty a space
      before closing it. Without the choice, the first need forces exporting one by one and the second forces repeating
      the gesture for each page. And a file with the pages out of order and without saying where they come from cannot be
      put back together.
    context: >-
      The order and the path are decided by the same tree seen in the sidebar, so that the file reads the way it read on
      screen.
    scenarios:
      - title: A single page does not ask
        given: A page without subpages
        when: Exporting it is requested
        then: The file is downloaded immediately, without asking anything
      - title: A page with children asks
        given: A page with subpages
        when: Exporting it is requested
        then: It is asked whether its subpages come out too, and the answer decides what the file contains
      - title: The trash does not come out
        given: A space with pages in the trash
        when: The whole space is exported
        then: The file contains only the live pages
  - id: BR-e92b734
    status: active
    title: An unreadable page does not take the whole file with it
    rule: >-
      If when exporting the body of a page cannot be read, the page comes out anyway: with its name and its place in the
      tree, and empty inside. The rest of the file is written complete.
    why: >-
      Losing one body is a smaller harm than losing everything someone asked to take. A failure that cancels the entire
      export leaves whoever requested it with nothing and not knowing which of a hundred pages was to blame.
    context: It happens with content stored by a schema version that is no longer recognized.
    scenarios:
      - title: The file arrives anyway
        given: A space where one page has its body stored in an unrecognizable format
        when: The whole space is exported
        then: The file is downloaded with all the pages, and the unreadable one appears with its name and without a body
  - id: BR-ef13a8b
    status: active
    title: What is exported opens offline, with the attachments inside and the links to the neighboring file
    rule: >-
      The export archive carries inside the files that hang from the exported pages, all in a common folder called assets.
      What the page showed points to that file by a relative path, just like a link to another page that also traveled. A
      link to a page that was left out is left as it was. An attachment that storage can no longer deliver is omitted from
      the archive without taking the export down, and the text that mentioned it keeps saying what it was.
    why: >-
      An export that needs the server turned on to be viewed is not a copy: it is a mirror. Whoever takes a manual opens it
      on a computer without a session, or keeps it for years. With relative paths the archive works in any folder where it
      is unpacked, and with the attachments inside there are no broken images.
    context: >-
      Attachments go in a common folder and not next to each page because the same image can appear on several pages and
      there is only one of it. Each file carries its identifier in front, so that two attachments with the same name do not
      overwrite each other. A file block keeps the identifier it already had and gains the path alongside, so that the
      archive can be opened by a person and still comes back whole when imported.
    scenarios:
      - title: An image travels with the page
        given: A page with an uploaded image
        when: It is exported together with another page
        then: The archive includes the image in assets and the Markdown points to it by relative path
      - title: A link between two exported pages
        given: Two pages exported together, one mentions the other
        when: The first one's file is opened
        then: The mention points to the second one's file by relative path
      - title: A link to a page that did not travel
        given: An exported page that mentions another that was left out
        when: The exported file is opened
        then: The mention is left as it was, without pointing to a file that does not exist
  - id: BR-fc54608
    status: active
    title: Whoever has full access decides who sees and who edits a page or a part of it
    rule: >-
      A page, or a part of it, can have its own permissions: one chooses who can read it, who can edit it and who has full
      access. What does not declare permissions of its own follows what is above it, and if nothing above declares them, what
      the space allows. What declares permissions is closed to whoever is not on the list, including administrators. A
      client never goes beyond reading, even if the list gives them more. Any person of the workspace with access to the
      space can be listed, whether or not they are an administrator.
    why: >-
      A section of a page (a budget, an internal note) is shared with fewer people than the page, and doing so must not
      force moving the text to another page.
    context: >-
      The "Share" dialog shows the list of who has access, where it comes from (which page it inherits from or whether
      it is its own), and allows adding and removing people, changing their role, stopping inheriting and inheriting again.
      It is opened from the page and, for a part of it, from the block's menu.
    scenarios:
      - title: A restricted section
        given: >-
          A page open to the whole space and a section with permissions of its own that only name one administrator
        when: A worker opens the page
        then: The section does not appear on screen, nor in the search, nor in what the browser receives
      - title: Inheriting again
        given: A section with permissions of its own
        when: Whoever has full access chooses to follow the page again
        then: The section is seen again by whoever sees the page
  - id: BR-6191a45
    status: superseded
    title: A page that changes space takes its descendants along and leaves its address working
    rule: >-
      When moving a page to another space, all the pages that hang from it change space with it. Addresses written before
      the move keep leading to the page, now in the space where it lives.
    why: >-
      A branch split between two spaces leaves children that nobody reaches from their parent. And an address that stops
      responding turns every link and every mention written before the move into a dead end.
    context: >-
      Each dragged page notifies the search index on its own, because the index records which space each one belongs to.
      Whoever drags does not end up as the last editor of the children.
    superseded_by: BR-8b498e2
    scenarios:
      - title: The branch travels whole
        given: A page with children in a space
        when: The parent is moved to another space
        then: The children end up in the new space, hanging from their parent
      - title: The old address still works
        given: A page that changed space
        when: An address that names the previous space is opened
        then: The page is reached in its current space
  - id: BR-a096152
    status: superseded
    title: A copy is born next to its original and only it is renamed
    rule: >-
      When duplicating a page, its content, its properties and its icon are copied. The copy is placed immediately after
      the original among its siblings. One can choose whether the descendants are copied too, and that question only
      appears when the page has children. Of the whole copied branch, only the requested page is renamed.
    why: >-
      A copy that appears at the end of a long list forces searching for it. And renaming the children too would dirty
      every name in the branch with a mark that says nothing about them.
    context: >-
      The copy mark is added by the portal, because the server does not know which language each person reads. To make room
      for the copy, the siblings that came after are renumbered.
    superseded_by: BR-73da3c5
  - id: BR-ac6957c
    status: superseded
    title: Each change to a page reaches the search and the backlinks, separately
    rule: >-
      When a page changes, the search and the "Vinculado desde" section each receive their own notice of the change. That
      one of the two takes it, retries it or fails does not hide the notice from the other, and neither receives the same
      notice twice.
    why: >-
      If the two shared a single notice, the first to take it would consider it handled and the other would never find out;
      a new mention would not appear in "Vinculado desde" or a renamed page would not be found by its new title.
    context: >-
      A notice that fails is retried only for whoever failed. When updating from a previous version, each change already
      recorded is notified once again to both, because before it may have reached only one.
    superseded_by: BR-9a633a0
    scenarios:
      - title: A new mention
        given: A page that mentions another, with the search and the backlinks working
        when: Someone saves the page
        then: The page is found by its new text and the mentioned one shows it in "Vinculado desde"
      - title: The search down for a moment
        given: The search index fails when receiving a change
        when: The backlinks process that same change
        then: The backlinks are up to date and the search retries its notice later
  - id: BR-cb028f9
    status: superseded
    title: What is exported reads as Markdown and knows how to come back
    rule: >-
      A page is exported to Markdown. What Markdown already knows how to say —paragraphs, headings, lists, tasks, quotes,
      code, tables, images, separators— is written with its own syntax. What Markdown does not know how to say is written
      in two ways depending on where it lives: inside a line, as a link with its own destination; as a block, with a fence
      of three colons that names the type and carries its data. Exporting several pages produces a single file, with each
      page opened by a mark that says where it lived.
    why: >-
      A Markdown that keeps only plain text turns the export into a reading copy and nothing more: what comes out cannot
      come back. And a format that departs from Markdown in order to be reversible stops being readable in any editor,
      which is the only reason to choose Markdown.
    context: >-
      There are things that cannot come back whole and it is worth saying so: a block taken from another page comes out as
      the text it showed, not as the live link. A single file instead of a compressed folder avoids a new dependency and
      makes reading back simpler.
    superseded_by: BR-d829da6
  - id: BR-f033642
    status: superseded
    title: What the search knows about a page is redone every time the page changes
    rule: >-
      Renaming a page or changing its mark notifies the search index, just like writing in it. A page that is thrown into
      the trash or deleted stops being found, and that forgetting is requested with a version that the index can store.
    why: >-
      A renamed page that is still found by its old name is a lie that nobody corrects, because nobody knows it is there.
      And a forgetting that fails goes unnoticed: the page disappears from view and keeps appearing in anyone's results.
    context: >-
      Each change is announced only once, distinguished by the moment it was written. The index projects outside the
      server, so the notice travels through the outbox.
    superseded_by: BR-50fb993
