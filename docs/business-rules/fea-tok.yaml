        given: Un agente creó una página con el id de pedido "pedido-1"
        when: Manda otra vez el mismo pedido con el mismo id
        then: No se crea otra página, y la respuesta dice que no se repitió y cuál es la página
      - title: Dos reintentos al mismo tiempo
        given: Un agente manda dos veces a la vez el mismo pedido con el mismo id
        when: Las dos llamadas llegan juntas
        then: Se crea una sola página, y la otra llamada recibe que el pedido está en curso
      - title: El mismo id en otro token
        given: Un token ya usó el id "pedido-x"
        when: Otro token crea una página con el id "pedido-x"
        then: La página se crea, porque el id solo vale dentro de cada token
      - title: Un pedido que quedó sin cerrar
        given: Un pedido con id lleva más de diez minutos sin terminar
        when: El agente lo reintenta con el mismo id
        then: No se hace de nuevo; se le pide leer la página y usar un id nuevo si lo pedido no está
      - title: El mismo id para otra cosa
        given: Un agente creó una página con el id "pedido-1"
        when: Usa el id "pedido-1" para comentar un bloque
        then: El comentario no se hace y la respuesta dice que ese id ya se usó en create_page
  - id: BR-d2011f8
    status: active
    title: Lo que una página va a dibujar se revisa antes de guardarlo
    rule: >-
      Antes de guardar un diagrama o una fórmula que escribe un agente, el sistema comprueba que se pueda dibujar tal
      como lo dibujará la página. Revisa que el diagrama se pueda leer, que cada ícono que nombra exista entre los que
      la página dibuja y que en un diagrama de arquitectura cada grupo contenga algo y ningún elemento quede fuera del
      grupo al que apunta su sangría. En una fórmula revisa que se pueda componer. Si algo falla, no se guarda nada y el
      agente recibe el motivo exacto con el número de bloque, para corregirlo y volver a intentar.
    why: >-
      Un diagrama roto o con íconos que no existen, guardado en silencio, solo lo descubre después la persona que abre
      la página. Rechazarlo en el momento, con el motivo, deja que el agente lo corrija solo.
    context: >-
      La revisión ocurre en el servidor, nunca en el navegador. Si el revisor de diagramas no responde a tiempo o se
      cae, la escritura no se hace, el fallo queda registrado y el revisor se vuelve a levantar para la siguiente. Nunca
      se da por bueno un diagrama que no se pudo revisar. El registro de fallos guarda un motivo corto, nunca lo que el
      agente escribió.
    scenarios:
      - title: Diagrama que no se puede leer
        given: Un agente que escribe un diagrama con un error de sintaxis
        when: Intenta guardarlo en una página
        then: No se guarda nada y recibe el error con la línea y el número de bloque
      - title: Ícono inexistente
        given: Un diagrama que nombra un ícono que la página no tiene
        when: El agente intenta guardarlo
        then: Se rechaza nombrando el ícono y cómo encontrar uno que exista
  - id: BR-dc7a320
    status: active
    title: En una colección, cada fila responde a su propia regla
    rule: >-
      Leer, filtrar o cambiar las filas de una colección se decide fila por fila con la regla más cercana del token; una
      regla puesta en una fila manda sobre la de su colección. Leer una colección pide collections:read, cambiar sus
      filas collections:write y cambiar sus columnas o vistas collections:configure, cada uno en el lugar donde está
      hoy. Una fila también es una página, y crearla, renombrarla, moverla dentro o fuera de una colección o duplicarla
      pide collections:write aunque el agente lo haga como página.
    why: >-
      Si las herramientas de páginas no pidieran lo mismo que las de colecciones, un token que solo escribe páginas
