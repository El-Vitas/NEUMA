      - title: Cambiar una celda
        given: Una página con una tabla que tiene comentarios en sus celdas
        when: El agente cambia el texto de una celda
        then: Solo cambia esa celda y las demás conservan su identidad y sus comentarios
      - title: Página bloqueada
        given: Una página bloqueada
        when: El agente intenta escribir en ella
        then: No se escribe nada y se le explica que la página está bloqueada
  - id: BR-ff39e6a
    status: superseded
    title: En una colección, cada fila responde a su propia regla
    rule: >-
      Leer, filtrar o cambiar las filas de una colección se decide fila por fila con la regla más cercana del token: una
      regla puesta en una fila manda sobre la de su colección. Leer una colección pide collections:read, cambiar sus
      filas collections:write y cambiar sus columnas o vistas collections:configure, cada uno en el lugar donde está
      hoy.
    why: >-
      Un tablero abierto puede tener una fila cerrada, por ejemplo una tarea con información sensible. Si la colección
      decidiera por todas sus filas, consultar el tablero entregaría lo que el token cierra.
    context: >-
      Una consulta cuenta solo las filas que el token deja leer. A un token que solo lee no se le ofrecen herramientas
      que escriben.
    superseded_by: BR-dc7a320
    scenarios:
      - title: Una fila cerrada en un tablero abierto
        given: Un token que lee y escribe en un tablero, salvo en una de sus filas
        when: El agente consulta el tablero o intenta cambiar esa fila
        then: La fila no aparece ni se cuenta, y cambiarla se contesta igual que si no existiera
      - title: Un token que solo escribe filas
        given: Un token con collections:read y collections:write, sin collections:configure
        when: El agente se conecta
        then: Puede crear y cambiar filas, pero no se le ofrecen las herramientas de columnas ni de vistas
