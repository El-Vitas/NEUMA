id: FEA-TOK
name: Tokens de acceso para agentes
purpose: Reglas de los tokens con que un agente (por MCP) actúa en Company Brain en nombre de una persona.
scope: access-tokens
rules:
  - id: BR-04b7bf1
    status: active
    title: El agente sabe si una página es de fiar y qué hay en la papelera
    rule: >-
      Al abrir una página entera, el agente recibe si está verificada, quién la verificó y hasta cuándo, si la
      verificación ya venció, si está bloqueada y quién es su dueño. En la búsqueda puede quedarse solo con páginas
      verificadas y vigentes, filtrar por quién creó la página y por cuándo se editó, y cada resultado dice si su página
      está verificada. Puede listar la papelera para recuperar una página sin conocer su id, y ve solo las páginas que
      su token puede leer donde estaban.
    why: >-
      Un agente que responde preguntas debe poder preferir la información que alguien revisó y avisar cuando lo que
      encontró puede estar desactualizado. Sin ver la papelera, no podía recuperar una página que alguien borró por
      error, salvo que ya supiera su id.
    context: >-
      Una verificación vencida no es lo mismo que una página sin verificar. Se sabe quién respondió por ella, pero eso
      ya no vale. El vencimiento se compara con el momento en que se lee, así una verificación vencida se informa aunque
      nadie haya tocado la página desde entonces.
    scenarios:
      - title: Verificación vencida
        given: Una página verificada cuyo plazo de verificación ya pasó
        when: El agente la abre
        then: Se le dice que la verificación venció, quién la había verificado y que la página puede estar desactualizada
      - title: Papelera con una página cerrada al token
        given: Una página en la papelera con una regla de página que cierra su lectura al token
        when: El agente lista la papelera
        then: Esa página no aparece
  - id: BR-0db7699
    status: active
    title: Escribir no da derecho a leer
    rule: >-
      Cuando un agente escribe en un lugar que su token no deja leer, la respuesta confirma lo que hizo y le da los ids
      de lo que escribió, pero no le devuelve el título ni lo que la página dice. Lo que una fila responde en sus
      columnas pide además leer colecciones en ese lugar, aunque la fila se abra como página.
    why: >-
      Un token que solo escribe se da para dejar cosas, no para mirar. Si la respuesta a cada escritura trajera la
      página escrita, bastaría con escribir algo para leerla entera, y el permiso de lectura no cerraría nada.
    context: >-
      Vale para las escrituras de bloques, de páginas y de filas. El aviso que recibe el agente le dice que no puede
      leer lo escrito, para que no lo tome por un fallo.
    scenarios:
      - title: Un token que solo escribe
        given: Un token que escribe en una página pero no la lee
        when: El agente agrega un párrafo
        then: Recibe el id del párrafo y la confirmación, sin el texto de la página ni su título
      - title: Las columnas de una fila
        given: Un token que lee páginas pero no colecciones
        when: El agente abre una fila de un tablero
        then: Lee lo que la fila dice como página, sin sus valores de columna
  - id: BR-1779eb2
    status: active
    title: Límites, vencimiento y nombre de los tokens
    rule: >-
      Una persona puede tener como máximo 20 tokens vivos, y cada token puede hacer como máximo 120 llamadas por minuto
      al servidor MCP. Un token nuevo vence por defecto a los 30 días; se puede elegir 90 días, un año, cualquier fecha
      futura (vence cuando termina ese día, en la hora de quien la eligió) o sin vencimiento. Dos tokens vivos de la
      misma persona no pueden llamarse igual, sin contar mayúsculas ni espacios de más, y el nombre no puede llevar
      caracteres de control ni invisibles.
    why: >-
      El nombre es lo que se lee al revocar. Dos nombres que se leen igual, o uno que con un carácter invisible se lee
      como otro, hacen revocar el token equivocado.
    context: >-
      El tope y el nombre se revisan en la misma transacción que guarda el token, con la fila de la persona tomada:
      pedir dos a la vez no salta ninguno de los dos. El servidor rechaza un vencimiento que no sea después de ahora.
      Las mayúsculas se comparan igual en el portal y en el servidor, sin depender del idioma de la máquina. El carácter
      que une los emojis compuestos se acepta, porque es parte del emoji. Además de las 120 por token, una misma
      dirección puede hacer como máximo 600 llamadas por minuto al MCP, así probar llaves también tiene tope.
    supersedes: BR-b1e9e21
    superseded_reason: >-
      El nombre aceptaba caracteres invisibles o que dan vuelta el texto, con los que un token se hacía pasar por otro
      en la lista, y comparaba mayúsculas según el idioma de cada máquina.
    scenarios:
      - title: Pasar el tope de tokens
        given: Una persona con 20 tokens vivos
        when: Pide uno más
        then: Se le dice que llegó al tope y no se crea
      - title: Un nombre repetido
        given: Un token vivo llamado «Claude del equipo»
        when: La misma persona pide otro llamado «  claude DEL equipo »
        then: Se le dice que el nombre ya está en uso
      - title: Una fecha elegida
        given: Una persona que elige el 15 de marzo
        when: Crea el token
        then: Vence cuando termina ese día, en su hora
      - title: Un nombre que se hace pasar por otro
        given: Un nombre con un carácter que da vuelta el texto
        when: La persona pide el token
        then: Se rechaza el nombre
  - id: BR-1dca2a0
    status: active
    title: El agente escribe en una colección como una persona, por los mismos nombres y las mismas reglas
    rule: >-
      El agente nombra columnas, opciones, personas y vistas como las ve la gente, sin importar mayúsculas ni acentos, y
      Company Brain las traduce a lo que guarda. Lo que no calza se rechaza entero antes de escribir, diciendo qué sí
      vale. Las escrituras pasan por los mismos servicios que usa el portal, con sus validaciones, sus candados y sus
      reglas de vistas.
    why: >-
      Un agente que adivina claves internas escribe valores que el tablero no muestra. Uno que pasara por otro camino
      que el portal podría dejar una colección en un estado que el portal no permite, como sin vistas o con dos vistas
      por defecto.
    context: >-
      Renombrar o quitar una opción reescribe las filas que la tenían. Una columna nueva recibe la clave que le daría el
      portal. La última vista de una colección no se quita, y exactamente una es con la que se abre.
    scenarios:
      - title: Mover una tarea
        given: Un tablero con la columna Estado y las opciones Por hacer y Hecho
        when: El agente cambia el estado de una tarea a «hecho»
        then: La tarea queda en Hecho, escrito como lo tiene el tablero
      - title: La última vista
        given: Una colección con una sola vista
        when: El agente pide quitarla
        then: Se rechaza explicando que una colección conserva al menos una vista
  - id: BR-35337c0
    status: active
    title: Crear, cambiar y revocar un token queda en el registro
    rule: >-
      Cada vez que se crea un token, se cambia lo que tiene dado o se revoca, queda en el registro del servidor quién lo
      hizo, sobre qué token, en qué espacio de trabajo y, al crearlo o cambiarlo, qué permisos da en todos los espacios
      y a cuántos lugares alcanzan sus reglas. Un intento de entrar con una llave que no sirve también queda, sin la
      llave.
    why: >-
      Un token es una puerta abierta en nombre de una persona. Si se filtra o se usa mal, hay que poder responder cuándo
      nació, quién le cambió el alcance y quién lo cerró; y alguien probando llaves tiene que notarse.
    context: >-
      El registro nunca lleva el secreto, su hash ni el nombre o el correo de la persona: lleva ids. Si no se puede
      anotar el último uso de un token, se cuenta en el registro y quien trajo el token igual entra.
  - id: BR-5e36ce0
    status: active
    title: Un token nunca puede más que su dueño
    rule: >-
      Un token solo puede tener permisos que el rol de su dueño permite, y solo en espacios y páginas que su dueño ve.
      Se revisa al crearlo, al cambiarlo y en cada llamada del agente, con el rol y los lugares que el dueño tiene en
      ese momento.
    why: >-
      El token actúa en nombre de una persona. Si pudiera más que ella, crear un token sería una forma de saltarse los
      permisos; y si su dueño pierde un acceso, el agente tiene que perderlo con él.
    context: >-
      Niveles Sin acceso, Solo lectura, Lectura y escritura, Completo o Personalizado, en todos los espacios, en un
      espacio o en una página. Cómo se combinan lo dice la regla de la regla más cercana. El portal solo ofrece lo que
      el dueño puede dar, pero la decisión es del servidor, y un permiso de escritura escondido en una regla de página
      se rechaza igual que en cualquier otro lugar.
    supersedes: BR-d14395a
    superseded_reason: >-
      Decía que lo dado en un espacio se suma a lo dado en todos; ahora manda la regla más cercana, y además hay reglas
      por página. El límite del dueño no cambió, pero ahora alcanza también a las páginas.
    scenarios:
      - title: Un cliente pide un token que escribe
        given: Una persona con rol CLIENT, que solo puede leer
        when: Pide un token con permiso de crear y editar páginas, en un espacio o en una página
        then: El servidor lo rechaza y el token no se crea
      - title: El dueño pierde el acceso a un espacio
        given: Un token con lectura en un espacio restringido del que su dueño es miembro
        when: Sacan al dueño del espacio y el agente vuelve a buscar
        then: El agente ya no ve nada de ese espacio
      - title: Nombrar una página ajena
        given: Un administrador y la página del espacio privado de otra persona
        when: El administrador pide un token con acceso a esa página
        then: El servidor lo rechaza sin decir si la página existe
  - id: BR-61079bd
    status: active
    title: Lo que alguien escribió le llega al agente como palabras, nunca como estructura
    rule: >-
      Cuando una página se entrega como Markdown —al agente o al exportarla—, lo que una persona escribió se escribe de
      modo que se lea tal cual: un signo que se leería como formato, un comentario que se haría pasar por el ancla de un
      bloque, el cierre de un bloque de código, una barra dentro de una celda o un paréntesis dentro de un enlace se
      escriben escapados. Leído de vuelta, dice exactamente lo mismo. Al revés, lo que el agente escribe y la página no
      guardaría —una etiqueta de HTML como texto, más estilos de los que unas palabras llevan, una etiqueta dentro de
      otra igual— se rechaza diciendo qué corregir.
    why: >-
      El agente nombra los bloques por las anclas que lee. Si las palabras de otra persona pudieran fabricar un ancla,
      un atributo o el fin de un bloque, quien escribe en una página podría hacer que el agente cambie otro bloque del
      que cree. Y un rechazo sin explicación hace que el agente reintente lo mismo.
    context: >-
      Vale igual para lo que entrega fetch y para la exportación a Markdown. Un bloque de código se encierra con más
      acentos graves que los que lleva seguidos.
    scenarios:
      - title: Un ancla falsa
        given: Un párrafo que dice «<!-- block:otro -->»
        when: El agente abre la página
        then: Lee esas palabras como texto, no como el ancla de un bloque
      - title: Una etiqueta como texto
        given: Un agente que escribe «usa la etiqueta <b>»
        when: Intenta guardarlo
        then: Se le dice que la página no guarda etiquetas y que la nombre sin los signos
  - id: BR-65519fe
    status: active
    title: Toda escritura de un agente queda anotada, termine como termine
    rule: >-
      Cada vez que un agente intenta escribir en Company Brain queda una anotación con quién es su dueño, con qué token
      entró, qué herramienta usó, sobre qué página y qué pidió, y si se hizo, se rechazó o falló. Sin esa anotación no
      hay escritura.
    why: >-
      Un agente actúa en nombre de una persona y a su velocidad. Para responder qué cambió, quién lo pidió y qué intentó
      sin lograrlo hace falta el rastro completo, incluidos los intentos rechazados, que son los que muestran un token
      mal configurado o un agente que insiste.
    context: >-
      La anotación no guarda llaves hacia la página ni hacia el token, para seguir diciendo qué pasó aunque ya no
      existan.
    scenarios:
      - title: Una opción que no existe
        given: Un token que puede escribir en un tablero
        when: El agente crea una fila con un estado que el tablero no tiene
        then: No se crea nada, el agente recibe las opciones que sí existen y la anotación queda como rechazada
      - title: Una fila bloqueada
        given: Una fila que una persona bloqueó contra cambios
        when: El agente intenta cambiarla
        then: Se le dice que una persona tiene que desbloquearla y la anotación queda como rechazada
  - id: BR-71ebff5
    status: active
    title: El agente edita páginas como una persona, con todo lo que ofrece el editor
    rule: >-
      Un agente con permiso de escribir páginas puede hacer en ellas lo mismo que una persona desde el editor, por los
      mismos caminos y con las mismas reglas. Puede crear páginas, escribir, cambiar, mover y quitar bloques de
      cualquier tipo del menú de bloques. Puede dar formato al texto (negrita, cursiva, código, tachado, subrayado,
      color y resaltado) y pintar un bloque entero. Puede cambiar una tabla celda por celda, agregarle y quitarle filas,
      y comentar un bloque o unas palabras de él, o quitar un comentario. Puede cambiar el título, el emoji, la portada,
      el bloqueo, la verificación y el dueño de una página, y moverla o duplicarla. Todo lo que escribe llega al momento
      a quien tiene la página abierta. Lo que un bloque lleva y no es del agente —los comentarios de otras personas, sus
      colores, los bloques que lleva adentro— no se pierde al cambiarlo.
    why: >-
      El agente trabaja en páginas que también usan personas. Un cambio que de paso borra lo que otros dejaron no es
      editar como una persona: es pisar.
    context: >-
      El agente no sube imágenes ni archivos, así que puede quitar una portada pero no poner una nueva. Un comentario
      lleva el nombre de la persona dueña del token. Lo que no se toca de una tabla conserva su identidad, sus
      comentarios y los enlaces que apuntan a sus celdas. Un bloque reemplazado entero conserva su id, sus comentarios y
      sus colores, salvo que el nuevo traiga los suyos. Cambiar las palabras de una cita, un aviso o un desplegable las
      parte en párrafos como al insertarlos, y se rechaza si el bloque lleva otros bloques adentro: esos se cambian uno
      por uno. El título de un desplegable se cambia aparte de lo que guarda.
    supersedes: BR-e608867
    superseded_reason: >-
      Reemplazar un bloque borraba los comentarios y los colores que llevaba, y cambiar las palabras de un aviso o un
      desplegable borraba lo que tenía adentro. Ahora se conserva lo que no es del agente.
    scenarios:
      - title: Comentar unas palabras
        given: Un párrafo con la frase «fecha de cierre»
        when: El agente comenta esas palabras
        then: Las palabras quedan marcadas con el comentario, y el comentario lleva el nombre del dueño del token
      - title: Cambiar una celda
        given: Una tabla con comentarios en otras celdas
        when: El agente cambia una celda
        then: Las demás celdas conservan su id y sus comentarios
      - title: Página bloqueada
        given: Una página bloqueada
        when: El agente intenta escribir en ella
        then: No se escribe nada y se le dice que una persona tiene que desbloquearla
      - title: Reemplazar un bloque comentado
        given: Un aviso amarillo con un comentario de otra persona
        when: El agente lo reemplaza por un párrafo
        then: El párrafo conserva el id, el comentario y el color amarillo
  - id: BR-75580a6
    status: active
    title: Lo que apunta a una página cerrada no la nombra
    rule: >-
      Cuando el agente abre una página que puede leer, cada mención, subpágina, bloque sincronizado o colección que
      apunta a una página que su token no alcanza aparece como una marca que no nombra nada, sin título ni id. Lo mismo
      vale para los ancestros cerrados en la ruta de una página y para las páginas que la enlazan.
    why: >-
      Un título ya es información. Si una página abierta dejara ver el nombre de otra cerrada, cerrar una página no
      alcanzaría para que el agente no supiera de ella.
    context: La marca conserva el id del bloque que la tenía, así el agente todavía puede señalar ese bloque.
    scenarios:
      - title: Una mención a una página cerrada
        given: Un token que cierra la página Sueldos y una página abierta que la menciona
        when: El agente abre la página abierta
        then: Ve una marca en lugar de la mención, sin el título ni el id de Sueldos
      - title: Un ancestro cerrado
        given: Un token que cierra una página y vuelve a abrir una de sus hijas
        when: El agente abre una página bajo esa hija
        then: La ruta muestra la hija abierta y, en lugar de la cerrada, un paso sin nombre
  - id: BR-7cca1e0
    status: active
    title: Un enlace a un bloque que ya no está entrega su página
    rule: >-
      Si el agente abre el enlace de un bloque que ya no está en su página, recibe la página tal como está ahora, con un
      aviso de que el bloque ya no está. Si la página tampoco se puede ver, la respuesta es la de algo que no existe.
    why: >-
      Un enlace copiado hace días sigue diciendo dónde estaba la información. Contestar solo con un error dejaría al
      agente sin nada, cuando lo que buscaba probablemente sigue en esa página, movido o reescrito.
    scenarios:
      - title: El bloque se borró
        given: Un enlace a un bloque que alguien borró de su página
        when: El agente lo abre
        then: Recibe la página entera y el aviso de que el bloque ya no está
  - id: BR-9687ae3
    status: active
    title: Manda el árbol de páginas de hoy
    rule: >-
      Las reglas por página se aplican con el árbol como está en el momento de cada llamada, no como estaba cuando se
      dio el token. Una página que se saca de debajo de una página dada deja de estar dada; una que se mete debajo de
      una página excluida queda excluida.
    why: >-
      El token actúa con lo que su dueño organiza. Si el árbol quedara congelado al dar el token, mover una página no
      cambiaría quién la ve, y la lista de lo dado dejaría de describir lo que el agente alcanza.
    context: >-
      Caso a tener presente: borrar para siempre una página deja a sus hijas sin padre, y una hija que se restaura desde
      la papelera queda en la raíz del espacio, donde ya no la alcanza la regla de la página borrada y manda la de su
      espacio. Restaurar lo hace una persona que ve esa página. El recorrido del árbol corta ciclos con el camino ya
      andado y no con una profundidad máxima, para que ninguna página profunda quede fuera de la exclusión que la cubre.
    scenarios:
      - title: Sacar una página de lo dado
        given: Un token con acceso a «Vacaciones» y a lo que cuelga de ella
        when: Alguien mueve «Verano», que colgaba de «Vacaciones», a la raíz del espacio
        then: El agente ya no puede leer «Verano»
      - title: Meter una página en lo excluido
        given: Un token que lee todo menos «RR. HH.»
        when: Alguien mueve una página debajo de «RR. HH.»
        then: El agente ya no la encuentra ni la puede leer
  - id: BR-9ee3326
    status: active
    title: Bloquear, verificar y dar dueño a una página piden su propio permiso
    rule: >-
      Bloquear o desbloquear una página, responder por ella como verificada y darle un dueño son actos de confianza
      sobre la página, separados de escribir en ella. Un token solo puede hacerlos si tiene el permiso de gestionar
      páginas en esa página, según la regla más cercana. Poder escribir la página no alcanza. Si un pedido mezcla esos
      cambios con otros que el token sí puede hacer, como cambiar el título, no se cambia nada y el agente recibe el
      motivo. Solo puede dar este permiso quien puede escribir, y lo trae el nivel de acceso completo, no el de lectura
      y escritura.
    why: >-
      Un bloqueo, una verificación o un dueño dicen a los demás que la página está cuidada y por quién. Si cualquier
      token que escribe pudiera hacerlo, un agente podría bloquear páginas por error o dar por verificada información
      que nadie revisó, en nombre de una persona.
    context: >-
      El permiso se guarda como los demás permisos del token, por lugar. Una regla puesta en una página que no lo
      incluye lo quita en esa página aunque el token lo tenga en todo el espacio.
    scenarios:
      - title: Token que solo escribe
        given: Un token que puede escribir una página pero no gestionarla
        when: El agente pide bloquearla y cambiarle el título en el mismo pedido
        then: No se cambia nada y se le explica que falta el permiso de gestionar páginas
      - title: Regla de la página
        given: Un token que puede gestionar páginas en todo el espacio, con una regla en una página que no lo incluye
        when: El agente pide verificar esa página
        then: Se rechaza y la página queda sin verificar
  - id: BR-adf07ee
    status: active
    title: En cada página manda la regla más cercana
    rule: >-
      Un token tiene reglas por lugar: en todos los espacios, en un espacio o en una página (que incluye todo lo que
      cuelga de ella). Para decidir qué puede en una página se sube desde la página por sus ancestros y se usa la
      primera regla que aparece; si ninguna página tiene, la de su espacio; si tampoco, la de todos los espacios; si no
      hay ninguna, nada. La regla más cercana decide sola, sin sumarse a las de arriba. Una regla sin permisos («sin
      acceso») excluye el lugar.
    why: >-
      Tiene que poder decirse «solo esta página», «todo menos esto», «todo menos esto pero sí esta parte» y «escribir en
      todo pero solo leer en Finanzas» con una sola regla que se pueda auditar: cada página responde a una regla, y se
      puede mostrar cuál.
    context: >-
      Leer, buscar y listar espacios aplican exactamente la misma regla, en el servidor; por el camino que dijera más es
      por donde se filtraría. Sobre la regla más cercana siguen valiendo los dos límites de siempre: el dueño tiene que
      ver la página hoy, y el token no pasa de lo que el rol del dueño permite hoy. Un token hecho solo de exclusiones
      no se puede crear. Tampoco se puede nombrar, ni para cerrarlo, un espacio o una página que el dueño no ve, ni una
      página en la papelera.
    scenarios:
      - title: Todo menos un árbol
        given: Un token que lee en todos los espacios y tiene «RR. HH.» sin acceso
        when: El agente busca o lee «Sueldos», que cuelga de «RR. HH.»
        then: No lo encuentra ni lo puede leer, a cualquier profundidad
      - title: Reabrir adentro de lo excluido
        given: El mismo token, con «RR. HH./Vacaciones» en solo lectura
        when: El agente lee «Vacaciones» o una página que cuelga de ella
        then: La lee, y «RR. HH.» y «Sueldos» siguen cerradas
      - title: Solo una página
        given: Un token con una sola regla, en la página «Vacaciones»
        when: El agente lista espacios y busca
        then: Ve el espacio de «Vacaciones» y encuentra solo esa página y lo que cuelga de ella
  - id: BR-c448895
    status: active
    title: Un reintento del agente no crea dos veces lo mismo
    rule: >-
      Al crear una página, una fila, una colección, una vista, un comentario, una copia o bloques nuevos, el agente
      puede darle al pedido un id propio. Si con el mismo token llega otro pedido con ese id, no se hace de nuevo. Si el
      primero ya se hizo, se le dice al agente que no se repitió y en qué página quedó. Si todavía corre, se le pide
      esperar y leer la página. Si lleva más de diez minutos sin terminar, no se sabe si se hizo: se le pide leer la
      página y, si no está lo que pidió, mandarlo con un id nuevo. Un id ya usado para otra herramienta se rechaza
      diciendo para cuál se usó. Un pedido que se negó o falló no reserva su id, y el agente puede volver a intentarlo
      con él.
    why: >-
      Cuando la respuesta se pierde en el camino, el agente no sabe si su pedido se hizo y lo manda otra vez. Sin un id,
      cada reintento deja una página o un comentario repetido que alguien tiene que encontrar y borrar a mano. Liberar
      el id de un pedido que quedó sin cerrar podía duplicarlo, porque la escritura pudo hacerse aunque su cierre no se
      anotara.
    context: >-
      El id es opcional y vale solo para el token que lo mandó: otro token puede usar el mismo id sin chocar. Dos
      pedidos con el mismo id que llegan a la vez los separa la base de datos, no una lectura previa, así que solo uno
      escribe.
    supersedes: BR-85c1bbf
    scenarios:
