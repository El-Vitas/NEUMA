      a quien tiene la página abierta.
    why: >-
      Un agente que solo lee, o que escribe texto plano, obliga a una persona a terminar el trabajo a mano. Si puede lo
      mismo que una persona y bajo las mismas reglas, se le puede encargar la tarea completa sin abrir una puerta que la
      persona no tiene.
    context: >-
      El agente no sube imágenes ni archivos, así que puede quitar una portada pero no poner una nueva. Un comentario
      lleva el nombre de la persona dueña del token. Lo que no se toca de una tabla conserva su identidad, sus
      comentarios y los enlaces que apuntan a sus celdas.
