  - id: BR-fabc7c6
    status: active
    title: Lo que alcanza a un árbol de páginas pide permiso en todo el árbol
    rule: >-
      Cuando un agente hace algo que alcanza también a las páginas que cuelgan de una, como mandarla a la papelera,
      moverla o copiarla con sus hijas, el token necesita el permiso en esa página y en cada página de abajo que tenga
      su propia regla. Si alguna de abajo no lo permite, no se hace nada y se nombra esa página. Mandar a la papelera y
      restaurar piden su propio permiso, distinto del de escribir. Mover pide poder escribir donde está la página y
      donde va, y copiar pide poder escribir junto a la original. Nada se borra para siempre desde un agente, y lo que
      manda a la papelera se puede restaurar.
    why: >-
      Una regla que cierra una página a un token no debe poder saltarse actuando sobre la página de arriba. Si se
      pudiera, el token terminaría haciendo con la página cerrada lo que su regla prohíbe, y una copia podría sacar a la
      luz una página que el token no puede leer.
    context: >-
      Solo importan las páginas de abajo que tienen una regla propia; las demás heredan la de arriba, que ya se revisó
      en la página misma. Una página en la papelera que el token no alcanza se contesta igual que una que no existe.
    scenarios:
      - title: Hija protegida
        given: Un token que puede mandar páginas a la papelera en todo el espacio, salvo una página que cuelga de otra
        when: El agente manda a la papelera la página de arriba
        then: No se manda nada a la papelera y se le nombra la página protegida
      - title: Restaurar con las hijas
        given: Una página que se fue a la papelera con su hija
        when: El agente la restaura pidiendo también sus hijas
        then: Vuelven las dos
