  - id: BR-d14395a
    status: superseded
    title: A token can never do more than its owner
    rule: >-
      A token can only have permissions that its owner's role allows and only in spaces that its owner sees. It is checked
      when creating it, when changing it and on every call of the agent, with the role and the spaces the owner has at that
      moment.
    why: >-
      The token acts on behalf of a person. If it could do more than they can, creating a token would be a way of skipping
      permissions; and if its owner loses an access, the agent has to lose it along with them.
    context: >-
      Permissions per space or for all spaces, with levels Read only, Read and write, Full or Custom. What is given in a
      space is added to what is given in all of them. The portal only offers what the owner can give, but the decision
      belongs to the server.
    superseded_by: BR-5e36ce0
    superseded_reason: >-
      It said that what is given in a space is added to what is given in all of them; now the closest rule governs, and
      there are also per-page rules. The owner's limit did not change, but it now reaches pages too.
    scenarios:
      - title: A client asks for a token that writes
        given: A person with the CLIENT role, who can only read
        when: They ask for a token with permission to create and edit pages
        then: The server rejects it and the token is not created
      - title: The owner loses access to a space
        given: A token with read access in a restricted space of which its owner is a member
        when: The owner is removed from the space and the agent searches again
        then: The agent no longer sees anything of that space
  - id: BR-e608867
    status: superseded
    title: The agent edits pages like a person, with everything the editor offers
    rule: >-
      An agent with permission to write pages can do in them the same as a person from the editor, through the same paths
      and with the same rules. It can create pages, write, change, move and remove blocks of any type in the block menu. It
      can format text (bold, italic, code, strikethrough, underline, color and highlight) and paint a whole block. It can
      change a table cell by cell, add and remove rows, and comment on a block or on some words in it, or remove a
      comment. It can change a page's title, emoji, cover, lock, verification and owner, and move or duplicate it.
      Everything it writes reaches whoever has the page open instantly.
    why: >-
      An agent that only reads, or that writes plain text, forces a person to finish the work by hand. If it can do the same
      as a person and under the same rules, it can be entrusted with the complete task without opening a door that the
      person does not have.
    context: >-
      The agent does not upload images or files, so it can remove a cover but not set a new one. A comment carries the name
      of the person who owns the token. What is not touched in a table keeps its identity, its comments and the links that
      point to its cells.
    superseded_by: BR-71ebff5
    superseded_reason: >-
      Replacing a block deleted the comments and colors it carried, and changing the words of a callout or a toggle
      deleted what it had inside. Now what does not belong to the agent is kept.
    scenarios:
      - title: Commenting on some words
        given: An agent with permission to write on a page
        when: It comments on a block quoting some words that the block says
        then: The comment stays on the block signed by the person who owns the token, and those words are marked
      - title: Changing a cell
        given: A page with a table that has comments in its cells
        when: The agent changes the text of a cell
        then: Only that cell changes and the others keep their identity and their comments
      - title: Locked page
        given: A locked page
        when: The agent tries to write on it
        then: Nothing is written and it is explained that the page is locked
  - id: BR-ff39e6a
    status: superseded
    title: In a collection, each row answers to its own rule
    rule: >-
      Reading, filtering or changing a collection's rows is decided row by row with the token's closest rule: a rule placed
      on a row governs over that of its collection. Reading a collection requires collections:read, changing its rows
      collections:write and changing its columns or views collections:configure, each one in the place where it is today.
    why: >-
      An open board can have a closed row, for example a task with sensitive information. If the collection decided for all
      its rows, querying the board would deliver what the token closes.
    context: >-
      A query counts only the rows the token allows reading. A token that only reads is not offered tools that write.
    superseded_by: BR-dc7a320
    scenarios:
      - title: A closed row on an open board
        given: A token that reads and writes on a board, except on one of its rows
        when: The agent queries the board or tries to change that row
        then: The row neither appears nor is counted, and changing it is answered the same as if it did not exist
      - title: A token that only writes rows
        given: A token with collections:read and collections:write, without collections:configure
        when: The agent connects
        then: It can create and change rows, but it is not offered the column or view tools
