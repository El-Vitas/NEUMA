id: FEA-TOK
name: Access tokens for agents
purpose: Rules for the tokens with which an agent (through MCP) acts in Company Brain on behalf of a person.
scope: access-tokens
rules:
  - id: BR-04b7bf1
    status: active
    title: The agent knows whether a page can be trusted and what is in the trash
    rule: >-
      When opening a whole page, the agent receives whether it is verified, who verified it and until when, whether the
      verification has already expired, whether it is locked and who its owner is. In search it can keep only verified and
      current pages, filter by who created the page and by when it was edited, and each result says whether its page is
      verified. It can list the trash to recover a page without knowing its id, and sees only the pages that its token can
      read where they were.
    why: >-
      An agent that answers questions must be able to prefer information that someone reviewed and warn when what it found
      may be out of date. Without seeing the trash, it could not recover a page that someone deleted by mistake, unless it
      already knew its id.
    context: >-
      An expired verification is not the same as an unverified page. It is known who vouched for it, but that no longer
      counts. The expiry is compared against the moment of reading, so an expired verification is reported even if nobody
      has touched the page since.
    scenarios:
      - title: Expired verification
        given: A verified page whose verification period has already passed
        when: The agent opens it
        then: It is told that the verification expired, who had verified it and that the page may be out of date
      - title: Trash with a page closed to the token
        given: A page in the trash with a page rule that closes its reading to the token
        when: The agent lists the trash
        then: That page does not appear
  - id: BR-0db7699
    status: active
    title: Writing does not grant the right to read
    rule: >-
      When an agent writes in a place its token does not allow reading, the response confirms what it did and gives it the
      ids of what it wrote, but does not return the title or what the page says. What a row answers in its columns
      additionally requires reading collections in that place, even if the row is opened as a page.
    why: >-
      A token that only writes is given to leave things, not to look. If the response to each write brought back the
      written page, writing something would be enough to read it whole, and the read permission would close nothing.
    context: >-
      It applies to writes of blocks, pages and rows. The notice the agent receives tells it that it cannot read what it
      wrote, so that it does not mistake it for a failure.
    scenarios:
      - title: A token that only writes
        given: A token that writes on a page but does not read it
        when: The agent adds a paragraph
        then: It receives the paragraph's id and the confirmation, without the page's text or its title
      - title: The columns of a row
        given: A token that reads pages but not collections
        when: The agent opens a row of a board
        then: It reads what the row says as a page, without its column values
  - id: BR-1779eb2
    status: active
    title: Limits, expiry and name of tokens
    rule: >-
      A person can have at most 20 live tokens, and each token can make at most 120 calls per minute to the MCP server. A
      new token expires by default after 30 days; one can choose 90 days, one year, any future date (it expires when that
      day ends, in the time of whoever chose it) or no expiry. Two live tokens of the same person cannot have the same
      name, ignoring capitalization and extra spaces, and the name cannot carry control or invisible characters.
    why: >-
      The name is what is read when revoking. Two names that read the same, or one that reads as another because of an
      invisible character, cause the wrong token to be revoked.
    context: >-
      The cap and the name are checked in the same transaction that saves the token, with the person's row locked:
      requesting two at once does not get past either check. The server rejects an expiry that is not after now.
      Capitalization is compared the same way in the portal and on the server, without depending on the machine's
      language. The character that joins composite emojis is accepted, because it is part of the emoji. In addition to the
      120 per token, a single address can make at most 600 calls per minute to the MCP, so trying keys also has a cap.
    supersedes: BR-b1e9e21
    superseded_reason: >-
      The name accepted invisible characters or ones that reverse the text, with which one token passed itself off as
      another in the list, and compared capitalization according to each machine's language.
    scenarios:
      - title: Going over the token cap
        given: A person with 20 live tokens
        when: They ask for one more
        then: They are told they reached the cap and it is not created
      - title: A repeated name
        given: A live token called "Claude del equipo"
        when: The same person asks for another called "  claude DEL equipo "
        then: They are told the name is already in use
      - title: A chosen date
        given: A person who chooses March 15
        when: They create the token
        then: It expires when that day ends, in their time
      - title: A name that passes itself off as another
        given: A name with a character that reverses the text
        when: The person asks for the token
        then: The name is rejected
  - id: BR-35337c0
    status: active
    title: Creating, changing and revoking a token is recorded in the log
    rule: >-
      Every time a token is created, what it has been granted is changed or it is revoked, the server log records who did
      it, on which token, in which workspace and, when creating or changing it, which permissions it grants in all spaces
      and how many places its rules reach. An attempt to get in with a key that does not work is also recorded, without the
      key.
    why: >-
      A token is an open door on behalf of a person. If it leaks or is misused, it must be possible to answer when it was
      born, who changed its scope and who closed it; and someone trying keys has to be noticeable.
    context: >-
      The log never carries the secret, its hash or the person's name or email: it carries ids. If the last use of a token
      cannot be noted, it is counted in the log and whoever brought the token gets in anyway.
  - id: BR-5e36ce0
    status: active
    title: A token can never do more than its owner
    rule: >-
      A token can only have permissions that its owner's role allows, and only in spaces and pages that its owner sees. It
      is checked when creating it, when changing it and on every call of the agent, with the role and the places the owner
      has at that moment.
    why: >-
      The token acts on behalf of a person. If it could do more than they can, creating a token would be a way of skipping
      permissions; and if its owner loses an access, the agent has to lose it along with them.
    context: >-
      Levels No access, Read only, Read and write, Full or Custom, in all spaces, in one space or on one page. How they
      combine is stated by the closest-rule rule. The portal only offers what the owner can give, but the decision belongs
      to the server, and a write permission hidden in a page rule is rejected just as anywhere else.
    supersedes: BR-d14395a
    superseded_reason: >-
      It said that what is given in a space is added to what is given in all of them; now the closest rule governs, and
      there are also per-page rules. The owner's limit did not change, but it now reaches pages too.
    scenarios:
      - title: A client asks for a token that writes
        given: A person with the CLIENT role, who can only read
        when: They ask for a token with permission to create and edit pages, in a space or on a page
        then: The server rejects it and the token is not created
      - title: The owner loses access to a space
        given: A token with read access in a restricted space of which its owner is a member
        when: The owner is removed from the space and the agent searches again
        then: The agent no longer sees anything of that space
      - title: Naming someone else's page
        given: An administrator and the page of another person's private space
        when: The administrator asks for a token with access to that page
        then: The server rejects it without saying whether the page exists
  - id: BR-61079bd
    status: active
    title: What someone wrote reaches the agent as words, never as structure
    rule: >-
      When a page is delivered as Markdown —to the agent or when exporting it—, what a person wrote is written so that it
      reads as is: a sign that would be read as formatting, a comment that would pass itself off as a block's anchor, the
      closing of a code block, a bar inside a cell or a parenthesis inside a link are written escaped. Read back, it says
      exactly the same. In the other direction, what the agent writes and the page would not store —an HTML tag as text,
      more styles than some words carry, a tag inside another of the same kind— is rejected, saying what to fix.
    why: >-
      The agent names blocks by the anchors it reads. If another person's words could fabricate an anchor, an attribute or
      the end of a block, whoever writes on a page could make the agent change a different block from the one it thinks.
      And a rejection without explanation makes the agent retry the same thing.
    context: >-
      It applies equally to what fetch delivers and to the export to Markdown. A code block is enclosed with more
      backticks than it carries in a row.
    scenarios:
      - title: A false anchor
        given: A paragraph that says "<!-- block:otro -->"
        when: The agent opens the page
        then: It reads those words as text, not as a block's anchor
      - title: A tag as text
        given: An agent that writes "usa la etiqueta <b>"
        when: It tries to save it
        then: It is told that the page does not store tags and to name it without the signs
  - id: BR-71ebff5
    status: active
    title: The agent edits pages like a person, with everything the editor offers
    rule: >-
      An agent with permission to write pages can do in them the same as a person from the editor, through the same paths
      and with the same rules. It can create pages, write, change, move and remove blocks of any type in the block menu. It
      can format text (bold, italic, code, strikethrough, underline, color and highlight) and paint a whole block. It can
      change a table cell by cell, add and remove rows, and comment on a block or on some words in it, or remove a
      comment. It can change a page's title, emoji, cover, lock, verification and owner, and move or duplicate it.
      Everything it writes reaches whoever has the page open instantly. What a block carries that does not belong to the
      agent —other people's comments, its colors, the blocks it carries inside— is not lost when changing it.
    why: >-
      The agent works on pages that people also use. A change that in passing deletes what others left is not editing like
      a person: it is overwriting.
    context: >-
      The agent does not upload images or files, so it can remove a cover but not set a new one. A comment carries the name
      of the person who owns the token. What is not touched in a table keeps its identity, its comments and the links that
      point to its cells. A block replaced whole keeps its id, its comments and its colors, unless the new one brings its
      own. Changing the words of a quote, a callout or a toggle splits them into paragraphs as when inserting them, and it
      is rejected if the block carries other blocks inside: those are changed one by one. A toggle's title is changed
      separately from what it holds.
    supersedes: BR-e608867
    superseded_reason: >-
      Replacing a block deleted the comments and colors it carried, and changing the words of a callout or a toggle
      deleted what it had inside. Now what does not belong to the agent is kept.
    scenarios:
      - title: Commenting on some words
        given: A paragraph with the phrase "fecha de cierre"
        when: The agent comments on those words
        then: The words are marked with the comment, and the comment carries the name of the token's owner
      - title: Changing a cell
        given: A table with comments in other cells
        when: The agent changes a cell
        then: The other cells keep their id and their comments
      - title: Locked page
        given: A locked page
        when: The agent tries to write on it
        then: Nothing is written and it is told that a person has to unlock it
      - title: Replacing a commented block
        given: A yellow callout with a comment from another person
        when: The agent replaces it with a paragraph
        then: The paragraph keeps the id, the comment and the yellow color
  - id: BR-75580a6
    status: active
    title: What points to a closed page does not name it
    rule: >-
      When the agent opens a page it can read, each mention, subpage, synced block or collection that points to a page its
      token does not reach appears as a mark that names nothing, without a title or id. The same applies to closed
      ancestors in a page's path and to the pages that link to it.
    why: >-
      A title is already information. If an open page let the name of a closed one be seen, closing a page would not be
      enough for the agent not to know about it.
    context: The mark keeps the id of the block that had it, so the agent can still point to that block.
    scenarios:
      - title: A mention of a closed page
        given: A token that closes the page Sueldos and an open page that mentions it
        when: The agent opens the open page
        then: It sees a mark in place of the mention, without the title or id of Sueldos
      - title: A closed ancestor
        given: A token that closes a page and reopens one of its children
        when: The agent opens a page under that child
        then: The path shows the open child and, in place of the closed one, a step with no name
  - id: BR-7cca1e0
    status: active
    title: A link to a block that is no longer there delivers its page
    rule: >-
      If the agent opens the link of a block that is no longer on its page, it receives the page as it is now, with a
      notice that the block is no longer there. If the page cannot be seen either, the response is that of something that
      does not exist.
    why: >-
      A link copied days ago still says where the information was. Answering only with an error would leave the agent with
      nothing, when what it was looking for probably is still on that page, moved or rewritten.
    scenarios:
      - title: The block was deleted
        given: A link to a block that someone deleted from its page
        when: The agent opens it
        then: It receives the whole page and the notice that the block is no longer there
  - id: BR-9687ae3
    status: active
    title: Today's page tree governs
    rule: >-
      Per-page rules are applied with the tree as it is at the moment of each call, not as it was when the token was
      given. A page that is taken out from under a given page stops being given; one that is put under an excluded page
      becomes excluded.
    why: >-
      The token acts with what its owner organizes. If the tree stayed frozen when the token was given, moving a page would
      not change who sees it, and the list of what was given would stop describing what the agent reaches.
    context: >-
      A case to keep in mind: deleting a page forever leaves its children without a parent, and a child restored from the
      trash ends up at the root of the space, where the deleted page's rule no longer reaches it and its space's rule
      governs. Restoring is done by a person who sees that page. The tree traversal cuts cycles using the path already
      walked and not a maximum depth, so that no deep page is left out of the exclusion that covers it.
    scenarios:
      - title: Taking a page out of what was given
        given: A token with access to "Vacaciones" and to what hangs from it
        when: Someone moves "Verano", which hung from "Vacaciones", to the root of the space
        then: The agent can no longer read "Verano"
      - title: Putting a page into what is excluded
        given: A token that reads everything except "RR. HH."
        when: Someone moves a page under "RR. HH."
        then: The agent no longer finds it nor can read it
  - id: BR-9ee3326
    status: active
    title: Locking, verifying and assigning an owner to a page require their own permission
    rule: >-
      Locking or unlocking a page, vouching for it as verified and giving it an owner are acts of trust over the page,
      separate from writing on it. A token can only do them if it has the permission to manage pages on that page, according
      to the closest rule. Being able to write the page is not enough. If a request mixes those changes with others that the
      token can do, such as changing the title, nothing is changed and the agent receives the reason. Only whoever can write
      can give this permission, and it comes with the full access level, not with read and write.
    why: >-
      A lock, a verification or an owner tell others that the page is looked after and by whom. If any token that writes
      could do it, an agent could lock pages by mistake or mark as verified information that nobody reviewed, on behalf of a
      person.
    context: >-
      The permission is stored like the token's other permissions, per place. A rule placed on a page that does not include
      it removes it on that page even if the token has it across the whole space.
    scenarios:
      - title: Token that only writes
        given: A token that can write a page but not manage it
        when: The agent asks to lock it and change its title in the same request
        then: Nothing is changed and it is explained that the permission to manage pages is missing
      - title: Page rule
        given: A token that can manage pages across the whole space, with a rule on a page that does not include it
        when: The agent asks to verify that page
        then: It is rejected and the page stays unverified
  - id: BR-adf07ee
    status: active
    title: On each page the closest rule governs
    rule: >-
      A token has rules per place: in all spaces, in one space or on one page (which includes everything that hangs from
      it). To decide what it can do on a page, one goes up from the page through its ancestors and uses the first rule that
      appears; if no page has one, that of its space; if not, that of all spaces; if there is none, nothing. The closest
      rule decides on its own, without adding to those above. A rule without permissions ("no access") excludes the place.
    why: >-
      It must be possible to say "only this page", "everything except this", "everything except this but yes this part" and
      "write everywhere but only read in Finance" with a single rule that can be audited: each page answers to one rule,
      and which one can be shown.
    context: >-
      Reading, searching and listing spaces apply exactly the same rule, on the server; whichever path said more is where it
      would leak. On top of the closest rule the two usual limits still hold: the owner has to see the page today, and the
      token does not go beyond what the owner's role allows today. A token made only of exclusions cannot be created. Nor
      can a space or a page that the owner does not see be named, not even to close it, nor a page in the trash.
    scenarios:
      - title: Everything except a tree
        given: A token that reads in all spaces and has "RR. HH." with no access
        when: The agent searches for or reads "Sueldos", which hangs from "RR. HH."
        then: It does not find it nor can it read it, at any depth
      - title: Reopening inside what is excluded
        given: The same token, with "RR. HH./Vacaciones" as read only
        when: The agent reads "Vacaciones" or a page that hangs from it
        then: It reads it, and "RR. HH." and "Sueldos" stay closed
      - title: Only one page
        given: A token with a single rule, on the page "Vacaciones"
        when: The agent lists spaces and searches
        then: It sees the space of "Vacaciones" and finds only that page and what hangs from it
  - id: BR-c448895
    status: active
    title: An agent retry does not create the same thing twice
    rule: >-
      When creating a page, a row, a collection, a view, a comment, a copy or new blocks, the agent can give the request an
      id of its own. If with the same token another request arrives with that id, it is not done again. If the first was
      already done, the agent is told it was not repeated and on which page it ended up. If it is still running, it is
      asked to wait and read the page. If it has gone more than ten minutes without finishing, it is not known whether it
      was done: it is asked to read the page and, if what it requested is not there, to send it with a new id. An id already
      used for another tool is rejected, saying which one it was used for. A request that was refused or failed does not
      reserve its id, and the agent can try again with it.
    why: >-
      When the response is lost on the way, the agent does not know whether its request was done and sends it again.
      Without an id, each retry leaves a repeated page or comment that someone has to find and delete by hand. Releasing
      the id of a request that was left unfinished could duplicate it, because the write may have been done even if its
      closing was not recorded.
    context: >-
      The id is optional and valid only for the token that sent it: another token can use the same id without clashing. Two
      requests with the same id that arrive at the same time are told apart by the database, not by a prior read, so only
      one writes.
    supersedes: BR-85c1bbf
    scenarios:
      - title: Retry of something already created
        given: An agent created a page with the request id "pedido-1"
        when: It sends the same request again with the same id
        then: No other page is created, and the response says it was not repeated and which page it is
      - title: Two retries at the same time
        given: An agent sends the same request twice at once with the same id
        when: Both calls arrive together
        then: Only one page is created, and the other call is told that the request is in progress
      - title: The same id on another token
        given: A token already used the id "pedido-x"
        when: Another token creates a page with the id "pedido-x"
        then: The page is created, because the id is only valid within each token
      - title: A request left unfinished
        given: A request with an id has gone more than ten minutes without finishing
        when: The agent retries it with the same id
        then: It is not done again; it is asked to read the page and use a new id if what was requested is not there
      - title: The same id for something else
        given: An agent created a page with the id "pedido-1"
        when: It uses the id "pedido-1" to comment on a block
        then: The comment is not made and the response says that id was already used in create_page
  - id: BR-cef231d
    status: active
    title: Every agent write is recorded, however it ends
    rule: >-
      Each time an agent tries to write in Neuma, a record is left of who its owner is, which token it came in with, which
      tool it used, on which page and what it requested, and whether it was done, rejected or failed. Without that record
      there is no write.
    why: >-
      An agent acts on behalf of a person and at its own speed. To answer what changed, who requested it and what it tried
      without succeeding, the complete trail is needed, including rejected attempts, which are the ones that reveal a
      badly configured token or an agent that insists.
    context: >-
      The record does not keep keys toward the page or the token, so that it can keep saying what happened even if they no
      longer exist.
    supersedes: BR-65519fe
    scenarios:
      - title: An option that does not exist
        given: A token that can write on a board
        when: The agent creates a row with a status that the board does not have
        then: Nothing is created, the agent receives the options that do exist and the record is left as rejected
      - title: A locked row
        given: A row that a person locked against changes
        when: The agent tries to change it
        then: It is told that a person has to unlock it and the record is left as rejected
  - id: BR-d015a0e
    status: active
    title: The agent writes in a collection like a person, with the same names and the same rules
    rule: >-
      The agent names columns, options, people and views as people see them, regardless of capitalization or accents, and
      Neuma translates them into what it stores. What does not match is rejected whole before writing, saying what is
      valid. Writes go through the same services the portal uses, with their validations, their locks and their view rules.
    why: >-
      An agent that guesses internal keys writes values that the board does not show. One that went through a different path
      than the portal could leave a collection in a state that the portal does not allow, such as with no views or with two
      default views.
    context: >-
      Renaming or removing an option rewrites the rows that had it. A new column receives the key the portal would give it.
      A collection's last view is not removed, and exactly one is the one it opens with.
    supersedes: BR-1dca2a0
    scenarios:
      - title: Moving a task
        given: A board with the Estado column and the options Por hacer and Hecho
        when: The agent changes a task's status to "hecho"
        then: The task ends up in Hecho, written the way the board has it
      - title: The last view
        given: A collection with a single view
        when: The agent asks to remove it
        then: It is rejected, explaining that a collection keeps at least one view
  - id: BR-d2011f8
    status: active
    title: What a page is going to draw is checked before it is saved
    rule: >-
      Before saving a diagram or a formula that an agent writes, the system checks that it can be drawn just as the page
      will draw it. It checks that the diagram can be read, that each icon it names exists among those the page draws and
      that in an architecture diagram each group contains something and no element is left outside the group its
      indentation points to. In a formula it checks that it can be typeset. If something fails, nothing is saved and the
      agent receives the exact reason with the block number, to fix it and try again.
    why: >-
      A broken diagram or one with icons that do not exist, saved silently, is only discovered afterwards by the person who
      opens the page. Rejecting it at the moment, with the reason, lets the agent fix it on its own.
    context: >-
      The check happens on the server, never in the browser. If the diagram checker does not respond in time or goes down,
      the write is not done, the failure is recorded and the checker is brought back up for the next one. A diagram that
      could not be checked is never taken as good. The failure log keeps a short reason, never what the agent wrote.
    scenarios:
      - title: Diagram that cannot be read
        given: An agent that writes a diagram with a syntax error
        when: It tries to save it on a page
        then: Nothing is saved and it receives the error with the line and the block number
      - title: Nonexistent icon
        given: A diagram that names an icon the page does not have
        when: The agent tries to save it
        then: It is rejected naming the icon and how to find one that exists
  - id: BR-dc7a320
    status: active
    title: In a collection, each row answers to its own rule
    rule: >-
      Reading, filtering or changing a collection's rows is decided row by row with the token's closest rule; a rule placed
      on a row governs over that of its collection. Reading a collection requires collections:read, changing its rows
      collections:write and changing its columns or views collections:configure, each one in the place where it is today. A
      row is also a page, and creating it, renaming it, moving it into or out of a collection or duplicating it requires
      collections:write even if the agent does it as a page.
    why: >-
      If the page tools did not require the same as the collection tools, a token that only writes pages would change rows
      through the next door.
    context: What a row says as a page, its content, still requires being able to write pages.
    supersedes: BR-ff39e6a
    scenarios:
      - title: A token that only writes pages does not create a row
        given: A token with permission to write pages and without collections:write on a collection
        when: The agent creates a page inside that collection
        then: It is rejected saying that changing rows requires collections:write, and nothing is created
      - title: Moving a page into a collection is adding a row
        given: A token without collections:write on the destination collection
        when: The agent moves a page into that collection
        then: It is rejected and the page stays where it was
  - id: BR-e3b419d
    status: active
    title: The token is seen only once
    rule: >-
      A token's secret is shown in full only once, when it is created. The server stores only its hash; in lists its name
      and its beginning are seen, never the rest.
    why: A secret that can be read again can leak from the database or from anyone's screen.
    context: >-
      If it is lost, it is revoked and another is created. Tokens start with a prefix of their own so that a secret scanner
      recognizes them if they are pasted where they should not be.
    scenarios:
      - title: Creating a token
        given: A person in their account
        when: They create a token
        then: They see the full token and the configuration for their agent, and on closing the panel they can no longer see it again
  - id: BR-e40f5c7
    status: active
    title: The agent sees the same through every path
    rule: >-
      Searching, opening and walking the tree respond with the same token rule: what cannot be opened does not appear in
      the search or in the tree either, and a link or an id of a page or a block that the agent cannot see is answered the
      same as one that does not exist. The same when writing: changing, commenting, moving, duplicating, sending to the
      trash or restoring something the token does not reach, or taking something to a place it does not reach, is answered
      the same as if the place did not exist, and changes nothing.
    why: >-
      Through whichever path answers differently, what the token must not see leaks: a response that says "you do not have
      permission" confirms that the page exists.
    context: >-
      Search returns blocks with their page and their section. Opening accepts a link copied from the portal, a page id or a
      block id. Walking the tree lists the pages of one level with how many it has below, counting only those the agent can
      see. Each tool that writes is tested against a closed place and against one that does not exist, and the two responses
      have to be identical letter for letter.
    supersedes: BR-5fc8214
    superseded_reason: >-
      It spoke only of reading. Writing over a closed place, or taking something to it, also has to be answered the same as
      a place that does not exist.
    scenarios:
      - title: The id of a block on a closed page
        given: A token that does not reach the Sueldos page
        when: The agent opens a block of that page by its id
        then: It is answered the same as for an id that does not exist
      - title: Moving to a closed page
        given: A token that writes in the whole space except on the Sueldos page
        when: The agent moves an open page under Sueldos
        then: It is answered the same as if Sueldos did not exist, and both pages stay as they were
  - id: BR-e782bed
    status: active
    title: Whoever administers sees and revokes all tokens
    rule: >-
      Whoever administers the workspace sees all live tokens, with who created them, what they can do and when they were
      used, and can revoke any of them. They see no secret, and of the places they themselves do not see (spaces, and pages
      of those spaces) only how many there are is shown, without name or title.
    why: >-
      A connected agent is an open door to the company's information; someone has to be able to see which ones there are and
      close them, without that giving access to what does not correspond to them.
    supersedes: BR-b9dbfcb
    superseded_reason: >-
      With per-page rules, what is hidden from whoever administers is no longer only spaces: also the pages of the spaces
      they do not see, with their title.
    scenarios:
      - title: A token with someone else's private space
        given: A token of another person with rules in their private space and on a page of that space
        when: Whoever administers opens the agent tokens page
        then: They see the token and how many places it has that they do not see, but not the space's name or the page's title
      - title: Revoking from administration
        given: A live token of another person
        when: Whoever administers revokes it
        then: The agent stops getting in on its next call
  - id: BR-fabc7c6
    status: active
    title: What reaches a page tree requires permission across the whole tree
    rule: >-
      When an agent does something that also reaches the pages hanging from one, such as sending it to the trash, moving it
      or copying it with its children, the token needs the permission on that page and on every page below it that has its
      own rule. If any below does not allow it, nothing is done and that page is named. Sending to the trash and restoring
      require their own permission, distinct from that of writing. Moving requires being able to write where the page is and
      where it goes, and copying requires being able to write next to the original. Nothing is deleted forever from an
      agent, and what it sends to the trash can be restored.
    why: >-
      A rule that closes a page to a token must not be bypassable by acting on the page above. If it could be, the token
      would end up doing with the closed page what its rule forbids, and a copy could bring to light a page the token cannot
      read.
    context: >-
      Only the pages below that have a rule of their own matter; the others inherit the one above, which was already checked
      on the page itself. A page in the trash that the token does not reach is answered the same as one that does not exist.
    scenarios:
      - title: Protected child
        given: A token that can send pages to the trash across the whole space, except one page that hangs from another
        when: The agent sends the page above to the trash
        then: Nothing is sent to the trash and the protected page is named
      - title: Restoring with the children
        given: A page that went to the trash with its child
        when: The agent restores it also asking for its children
        then: Both come back
  - id: BR-1dca2a0
    status: superseded
    title: The agent writes in a collection like a person, with the same names and the same rules
    rule: >-
      The agent names columns, options, people and views as people see them, regardless of capitalization or accents, and
      Company Brain translates them into what it stores. What does not match is rejected whole before writing, saying what
      is valid. Writes go through the same services the portal uses, with their validations, their locks and their view
      rules.
    why: >-
      An agent that guesses internal keys writes values that the board does not show. One that went through a different path
      than the portal could leave a collection in a state that the portal does not allow, such as with no views or with two
      default views.
    context: >-
      Renaming or removing an option rewrites the rows that had it. A new column receives the key the portal would give it.
      A collection's last view is not removed, and exactly one is the one it opens with.
    superseded_by: BR-d015a0e
    scenarios:
      - title: Moving a task
        given: A board with the Estado column and the options Por hacer and Hecho
        when: The agent changes a task's status to "hecho"
        then: The task ends up in Hecho, written the way the board has it
      - title: The last view
        given: A collection with a single view
        when: The agent asks to remove it
        then: It is rejected, explaining that a collection keeps at least one view
  - id: BR-5fc8214
    status: superseded
    title: The agent sees the same through every path
    rule: >-
      Searching, opening and walking the tree respond with the same token rule: what cannot be opened does not appear in
      the search or in the tree either, and a link or an id of a page or a block that the agent cannot see is answered the
      same as one that does not exist.
    why: >-
      If one path said more than another, what the token closes would leak through it: an id taken from a result, a link
      pasted into the conversation or a count of subpages would be enough to know that something exists.
    context: >-
      Search returns blocks with their page and their section. Opening accepts a link copied from the portal, a page id or a
      block id. Walking the tree lists the pages of one level with how many it has below, counting only those the agent can
      see.
    superseded_by: BR-e40f5c7
    superseded_reason: >-
      It spoke only of reading. Writing over a closed place, or taking something to it, also has to be answered the same as
      a place that does not exist.
    scenarios:
      - title: The id of a block on a closed page
        given: A token that reads everything except one page
        when: The agent opens a block of that page by its id or by its link
        then: It receives the same response as for an id that does not exist
      - title: A closed subpage
        given: A token that closes a subpage of a page it can read
        when: The agent lists the pages under the open page
        then: It does not see the closed subpage nor is it counted
  - id: BR-65519fe
    status: superseded
    title: Every agent write is recorded, however it ends
    rule: >-
      Each time an agent tries to write in Company Brain, a record is left of who its owner is, which token it came in with,
      which tool it used, on which page and what it requested, and whether it was done, rejected or failed. Without that
      record there is no write.
    why: >-
      An agent acts on behalf of a person and at its own speed. To answer what changed, who requested it and what it tried
      without succeeding, the complete trail is needed, including rejected attempts, which are the ones that reveal a
      badly configured token or an agent that insists.
    context: >-
      The record does not keep keys toward the page or the token, so that it can keep saying what happened even if they no
      longer exist.
    superseded_by: BR-cef231d
    scenarios:
      - title: An option that does not exist
        given: A token that can write on a board
        when: The agent creates a row with a status that the board does not have
        then: Nothing is created, the agent receives the options that do exist and the record is left as rejected
      - title: A locked row
        given: A row that a person locked against changes
        when: The agent tries to change it
        then: It is told that a person has to unlock it and the record is left as rejected
  - id: BR-85c1bbf
    status: superseded
    title: An agent retry does not create the same thing twice
    rule: >-
      When creating a page, a row, a collection, a view, a comment, a copy or new blocks, the agent can give the request an
      id of its own. If with the same token another request arrives with that id, it is not done again. If the first was
      already done, the agent is told it was not repeated and on which page it ended up. If it is still running, it is
      asked to wait and read the page. A request that was refused or failed does not reserve its id, and the agent can try
      again with it. A request that has gone more than ten minutes without finishing is considered lost, is recorded as
      failed and its id becomes free again.
    why: >-
      When the response is lost on the way, the agent does not know whether its request was done and sends it again.
      Without an id, each retry leaves a repeated page or comment that someone has to find and delete by hand.
    context: >-
      The id is optional and valid only for the token that sent it: another token can use the same id without clashing. Two
      requests with the same id that arrive at the same time are told apart by the database, not by a prior read, so only
      one writes.
    superseded_by: BR-c448895
    scenarios:
      - title: Retry of something already created
        given: An agent created a page with the request id "pedido-1"
        when: It sends the same request again with the same id
        then: No other page is created, and the response says it was not repeated and which page it is
      - title: Two retries at the same time
        given: An agent sends the same request twice at once with the same id
        when: Both calls arrive together
        then: Only one page is created, and the other call is told that the request is in progress
      - title: The same id on another token
        given: A token already used the id "pedido-x"
        when: Another token creates a page with the id "pedido-x"
        then: The page is created, because the id is only valid within each token
      - title: An abandoned request
        given: A request with an id has gone more than ten minutes without finishing because the server went down
        when: The agent retries it with the same id
        then: The old request is recorded as failed and the new one is done
  - id: BR-b1e9e21
    status: superseded
    title: Limits, expiry and name of tokens
    rule: >-
      A person can have at most 20 live tokens, and each token can make at most 120 calls per minute to the MCP server. A
      new token expires by default after 30 days; one can choose 90 days, one year, any future date (it expires when that
      day ends, in the time of whoever chose it) or no expiry. Two live tokens of the same person cannot have the same
      name, ignoring capitalization and extra spaces, and the name cannot carry control characters.
    why: >-
      A cap bounds the damage of a leak and the cost of an agent running out of control; a default expiry makes a forgotten
      token stop working on its own. Two tokens that read the same in the list get confused when revoking one.
    context: >-
      The cap and the name are checked in the same transaction that saves the token, with the person's row locked:
      requesting two at once does not get past either check. The server rejects an expiry that is not after now.
    supersedes: BR-b1fcc3a
    superseded_by: BR-1779eb2
    superseded_reason: >-
      The name accepted invisible characters or ones that reverse the text, with which one token passed itself off as
      another in the list, and compared capitalization according to each machine's language.
    scenarios:
      - title: Going over the token cap
        given: A person with 20 live tokens
        when: They ask for another
        then: The server rejects it and the portal tells them to revoke one they do not use
      - title: A repeated name
        given: A live token called "Claude del equipo"
        when: The same person asks for another called "claude  DEL equipo"
        then: The portal flags it in the field before sending, and the server rejects it if it arrives anyway
      - title: A chosen date
        given: A person who chooses March 15 as the last day
        when: They create the token
        then: The token stops working when March 15 ends in their time
  - id: BR-b1fcc3a
    status: superseded
    title: Token limits
    rule: >-
      A person can have at most 20 live tokens, and each token can make at most 120 calls per minute to the MCP server. A
      new token expires by default after 30 days; one can choose 90 days, one year or no expiry.
    why: >-
      A cap bounds the damage of a leak and the cost of an agent running out of control; a default expiry makes a forgotten
      token stop working on its own.
    superseded_by: BR-b1e9e21
    superseded_reason: >-
      The expiry stopped being just a fixed period: any future date can be chosen, and the names of a person's live tokens
      became unique.
    scenarios:
      - title: Going over the token cap
        given: A person with 20 live tokens
        when: They ask for another
        then: The server rejects it and the portal tells them to revoke one they do not use
      - title: An agent that calls too much
        given: A token that already made 120 calls in the last minute
        when: It makes another
        then: The server rejects it until the minute passes, without affecting other tokens
  - id: BR-b9dbfcb
