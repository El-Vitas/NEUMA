      las que el agente puede ver. Cada herramienta que escribe se prueba contra un lugar cerrado y contra uno que no
      existe, y las dos respuestas tienen que ser iguales letra por letra.
    supersedes: BR-5fc8214
    superseded_reason: >-
      Hablaba solo de leer. Escribir sobre un lugar cerrado, o llevar algo hacia él, también tiene que contestarse igual
