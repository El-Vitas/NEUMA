  - id: BR-e40f5c7
    status: active
    title: El agente ve lo mismo por cada camino
    rule: >-
      Buscar, abrir y recorrer el árbol responden con la misma regla del token: lo que no se puede abrir tampoco aparece
      en la búsqueda ni en el árbol, y un enlace o un id de una página o un bloque que el agente no puede ver se
      contesta igual que uno que no existe. Lo mismo al escribir: cambiar, comentar, mover, duplicar, mandar a la
