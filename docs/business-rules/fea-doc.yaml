id: FEA-DOC
name: Application documentation
purpose: Defines how the application's own manual is written and read, separate from the workspaces.
scope: docs
rules:
  - id: BR-ad71c82
    status: active
    title: The manual is written in files, not in code
    rule: >-
      The application's documentation lives in text files, one per document and one per language. Adding or fixing a
      document means writing a file; nobody has to touch the code to do it, and nobody has to know how to program to
      write it.
    why: >-
      A manual that lives inside the code is written only by whoever programs, and so it does not get written. Taking it
      out of the code is what lets anyone who knows the subject write it and fix it.
    context: >-
      Each document states in its header what it is called, what it answers and in what order it goes. What is written in
      the language being read is shown in that language; what is not is shown in the language it was written in, because
      half a manual is worse than a manual in another language.
  - id: BR-b657d72
    status: active
    title: Each part of a document has its own address
    rule: >-
      Each heading of a document answers to its own name, and the page index leads to it. The page address ending in that
      name leads straight to that part.
    why: >-
      Nobody reads a whole manual: what people do with a manual is look for one thing, and send someone else the exact
      piece instead of the whole page.
    context: >-
      The index stays fixed at the side, scrolls on its own when it is longer than the screen, and marks the part being
      read. On narrow screens it sits below the document.
