        then: The property appears in the table and in the rows, with the key that corresponds to it
      - title: Giving an option a color
        given: A select property with its options
        when: An option is given a color and saved
        then: The option is seen with that color in the table and as a board column
      - title: Removing a property without leaving rows stuck
        given: Rows that stored a value under a property
        when: That property is removed from the shape
        then: The rows can still be moved and saved, and what was left under the removed property is left behind
      - title: The title is not removed
        given: A collection's shape
        when: Removing the title property is attempted
        then: It is not offered, and it is explained that it is the one that opens each row
