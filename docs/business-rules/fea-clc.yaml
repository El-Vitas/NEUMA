        then: The way into the settings is not drawn for them
  - id: BR-3c85c11
    status: superseded
    title: A collection is brought up to a cap of rows, and says when something was left out
    rule: >-
      Reading a collection brings its rows up to a cap, not all that it stores. A query with a filter or a sort walks the
      collection up to a much higher cap before filtering, so as not to leave out rows that match and are further down.
      When the collection had more than were walked, the response declares it and whoever reads it sees that there may be
      more. A cut collection is never presented as if it were whole.
    why: >-
      A collection that grew on its own would cost, when opened, in proportion to everything it stored. But keeping silent
      about the cut is worse than the cut, and filtering over an already cut collection is keeping silent twice: the
      response says that nothing matches when what matches was left out.
    context: >-
      Today 500 rows are brought when opening a collection or a view, and a query walks up to 5000 before filtering and
      sorting. The agent receives the same warning as the screen.
    supersedes: BR-e248700
    superseded_by: BR-c0f99c2
    scenarios:
      - title: The task that matches is further down
        given: A collection of 800 tasks where only row 700 is blocked
        when: An agent queries the blocked tasks
        then: It receives row 700
  - id: BR-554783b
    status: superseded
    title: A template is a row's starting point and is never a row
    rule: >-
      A collection can have templates, and each one stores a name, a content and the values a row starts with. A template
      is not a row of the collection, so it appears in no view, count, search result, change list, trash or agent listing,
      and it does not consume a unique identifier. It is only seen in the collection's template list and by opening it
      through its address.
    why: >-
      If a template counted as a row, the totals would lie, a board would show a card that nobody created and an agent would
      act on something that is only a mold.
    context: >-
      A template is edited like any page, with the same editor and the same versions, and inherits its collection's
      permissions. Deleting it sends it to the trash with a deadline, without going through the trash listing. Duplicating a
      collection with its pages also carries its templates and the default template.
    superseded_by: BR-af673e9
    scenarios:
      - title: A count does not include templates
        given: A collection with three rows and two templates
        when: Someone asks for the view's count
        then: The count says three
      - title: A search does not find a template's content
        given: A template whose text contains a unique word
        when: Someone searches for that word
        then: There are no results
  - id: BR-5a97271
    status: superseded
    title: A card dragged to another column changes the value that column represents
    rule: >-
      On a board, each column is a value of the property it is grouped by. Dragging a card from one column to another writes
      that value in the row, and that is the whole act: nobody has to open the row afterwards to say where it ended up.
      Dropping it in the column of rows with no value removes the value instead of writing the word "sin asignar" into it.
      Dropping it where it already was writes nothing. The same is done from the keyboard, with Alt and the arrows, and the
      result is announced. Whoever cannot write the page cannot move its cards either. On a board grouped by status there is
      never a column of rows with no value, because a status always has a value.
    why: >-
      A board where each card has to be opened to change its status is not a board: it is a list in columns. And one that
      only responds to the mouse leaves out whoever cannot use it, which in a daily work product is an exclusion that is
      noticed every day.
    context: >-
      When moving a card only the property that changed travels, not the whole page: returning the complete page would
      overwrite what another person wrote in it while the card was in the air. The value has to be the identifier of one of
      the options the property offers; any other is rejected on the server, even if someone asks for it on their own. If the
      column is a day, the row receives that date, and if it had a date range, the range keeps its duration.
    supersedes: BR-d7ada57
    superseded_by: BR-8e6b1f4
    scenarios:
      - title: Moving a status card
        given: A board grouped by status
        when: A card is dragged from "To do" to "Complete"
        then: The row stores the identifier of that column's option and nothing else
