  - id: BR-e248700
    status: superseded
    title: A collection is brought up to a cap of rows, and says when something was left out
    rule: >-
      Reading a collection brings its rows up to a cap, not all that it stores. When the collection had more than fit, the
      response declares it and the screen says so next to the rows, indicating how many are being seen and that one has to
      filter or search to reach the rest. A cut collection is never presented as if it were whole.
    why: >-
      A collection that grew on its own —an inbox, an incident log— would cost, when opened, in proportion to everything it
      stored, and whoever opens it waits for rows they will not look at. But keeping silent about the cut is worse than the
      cut: five hundred out of a thousand without a warning are read as the thousand, and then decisions are made over rows
      that nobody knows are missing.
    superseded_by: BR-3c85c11
    superseded_reason: >-
      A query with a filter or a sort cut the collection before filtering, and kept silent about the rows that matched
      further down. Now it walks much further before cutting.
    scenarios:
      - title: A collection that fits
        given: A collection with fewer rows than the cap
        when: It is opened
        then: All are seen and nothing is said about any cut
      - title: A collection that does not fit
        given: A collection with more rows than the cap
        when: It is opened
        then: The first ones up to the cap are seen and it is warned that there are more
  - id: BR-fbf632f
    status: superseded
    title: Searching and changing month request the rows from the server, and what does not fit is said
    rule: >-
      Searching in a collection sends the words to the server, which filters by the row's title, and the rows, the counts and
      the next pages of all views come from that same search, so nothing is hidden on its own among what was already loaded.
      A calendar reads all the rows that start on the days of its month grid, with the days of the incomplete weeks, and
      changing month requests them again. If the grid has more than a thousand rows, the first thousand are drawn and the
      screen says so. Rows without a date are counted separately and are not lost from view.
    why: >-
      Filtering on screen only what was loaded presents an incomplete result as if it were complete, and a calendar that
      keeps the first hundred rows silently makes the rest disappear.
    context: >-
      The server's search looks at the title, not at the texts of the other properties. The words and the month travel in the
      page address so they can be shared and reloaded.
    superseded_by: BR-4ddd139
    scenarios:
      - title: Searching with many rows
        given: A table of two thousand rows of which only fifty were loaded
        when: A word is searched that a row that was not loaded says
        then: The row appears and the count counts the rows that match across the whole collection
      - title: A month with more than a hundred rows
        given: A calendar with one hundred thirty rows in the same month
        when: That month is opened
        then: The one hundred thirty rows of the grid are drawn
