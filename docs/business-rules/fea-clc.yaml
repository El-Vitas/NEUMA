      renamed or removed by another person, the change is not applied and it is said that the option already moved, instead
      of writing over it.
    why: >-
      The configuration opens at the side and stays open while the rows keep living alongside. Sending what was read when
      opening it silently erases the work of whoever touched the same view in the meantime, and nobody finds out until
      something that had been configured is missing.
    superseded_by: BR-22dc232
    scenarios:
      - title: A grouping set while the configuration was open
        given: A view that someone just grouped by status
        when: A filter is set from the configuration that was open before
        then: The view ends up with the new filter and with the grouping by status
      - title: An option that already moved
        given: An option that another person just renamed
        when: Someone tries to rename it from what they had read before
        then: The change is rejected saying that the option already moved, and the other person's rename is kept
