  - id: BR-e248700
    status: superseded
    title: Una colección se trae hasta un tope de filas, y dice cuando quedó algo fuera
    rule: >-
      Leer una colección trae sus filas hasta un tope, no todas las que guarde. Cuando la colección tenía más de las que
      caben, la respuesta lo declara y la pantalla lo dice junto a las filas, indicando cuántas se están viendo y que
      hay que filtrar o buscar para llegar al resto. Una colección cortada nunca se presenta como si fuera entera.
    why: >-
      Una colección que creció sola —una bandeja de entrada, un registro de incidencias— costaría al abrirse en
      proporción a todo lo que guardó, y quien la abre espera por filas que no va a mirar. Pero callar el corte es peor
      que el corte: quinientas de mil sin avisar se leen como las mil, y entonces se decide sobre filas que nadie sabe
      que faltan.
    superseded_by: BR-3c85c11
    superseded_reason: >-
      Una consulta con filtro u orden cortaba la colección antes de filtrar, y callaba las filas que cumplían más abajo.
      Ahora recorre mucho más antes de cortar.
    scenarios:
      - title: Una colección que cabe
        given: Una colección con menos filas que el tope
        when: Se abre
        then: Se ven todas y no se dice nada de ningún corte
      - title: Una colección que no cabe
        given: Una colección con más filas que el tope
        when: Se abre
        then: Se ven las primeras hasta el tope y se avisa que hay más
  - id: BR-fbf632f
    status: superseded
    title: Buscar y cambiar de mes piden las filas al servidor, y lo que no cabe se dice
    rule: >-
      Buscar en una colección envía las palabras al servidor, que filtra por el título de la fila, y las filas, los
      conteos y las páginas siguientes de todas las vistas salen de esa misma búsqueda, de modo que nada se oculta solo
      entre lo que ya se cargó. Un calendario lee todas las filas que empiezan en los días de su cuadrícula del mes, con
      los días de las semanas incompletas, y cambiar de mes vuelve a pedirlas. Si la cuadrícula tiene más de mil filas
      se dibujan las primeras mil y la pantalla lo dice. Las filas sin fecha se cuentan aparte y no se pierden de vista.
    why: >-
      Filtrar en la pantalla solo lo cargado presenta un resultado incompleto como si fuera completo, y un calendario
      que se queda con las primeras cien filas hace desaparecer en silencio las demás.
    context: >-
      La búsqueda del servidor mira el título, no los textos de las demás propiedades. Las palabras y el mes viajan en
      la dirección de la página para que se puedan compartir y recargar.
    superseded_by: BR-4ddd139
    scenarios:
      - title: Buscar con muchas filas
        given: Una tabla de dos mil filas de la que solo se cargaron cincuenta
        when: Se busca una palabra que dice una fila que no estaba cargada
        then: La fila aparece y el conteo cuenta las filas que coinciden en toda la colección
      - title: Un mes con más de cien filas
        given: Un calendario con ciento treinta filas en un mismo mes
        when: Se abre ese mes
        then: Se dibujan las ciento treinta filas de la cuadrícula
