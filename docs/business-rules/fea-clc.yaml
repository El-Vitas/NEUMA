      - title: Quien solo puede leer
        given: Alguien sin permiso de escribir la página
        when: Abre la colección
        then: No se le dibuja la manera de entrar a la configuración
  - id: BR-3c85c11
    status: superseded
    title: Una colección se trae hasta un tope de filas, y dice cuando quedó algo fuera
    rule: >-
      Leer una colección trae sus filas hasta un tope, no todas las que guarde. Una consulta con filtro u orden recorre
      la colección hasta un tope mucho mayor antes de filtrar, para no dejar fuera filas que cumplen y están más abajo.
      Cuando la colección tenía más de las que se recorrieron, la respuesta lo declara y quien la lee ve que puede haber
      más. Una colección cortada nunca se presenta como si fuera entera.
    why: >-
      Una colección que creció sola costaría al abrirse en proporción a todo lo que guardó. Pero callar el corte es peor
      que el corte, y filtrar sobre una colección ya cortada es callarlo dos veces: la respuesta dice que nada cumple
      cuando lo que cumple quedó afuera.
    context: >-
      Hoy se traen 500 filas al abrir una colección o una vista, y una consulta recorre hasta 5000 antes de filtrar y
      ordenar. El agente recibe la misma advertencia que la pantalla.
    supersedes: BR-e248700
    superseded_by: BR-c0f99c2
    scenarios:
      - title: La tarea que cumple está más abajo
        given: Una colección de 800 tareas donde solo la fila 700 está bloqueada
        when: Un agente consulta las tareas bloqueadas
        then: Recibe la fila 700
  - id: BR-5a97271
    status: superseded
    title: Una tarjeta arrastrada a otra columna cambia el valor que esa columna representa
    rule: >-
      En un tablero, cada columna es un valor de la propiedad por la que se agrupa. Arrastrar una tarjeta de una columna
      a otra escribe ese valor en la fila, y eso es todo el acto: nadie tiene que abrir la fila después para decir dónde
      quedó. Soltarla en la columna de las filas sin valor le quita el valor en lugar de escribirle la palabra «sin
      asignar». Soltarla donde ya estaba no escribe nada. Lo mismo se hace desde el teclado, con Alt y las flechas, y el
      resultado se anuncia. Quien no puede escribir la página tampoco puede mover sus tarjetas. En un tablero agrupado
      por estado nunca hay columna de filas sin valor, porque un estado siempre tiene valor.
    why: >-
      Un tablero donde hay que abrir cada tarjeta para cambiarle el estado no es un tablero: es una lista en columnas. Y
      uno que solo responde al ratón deja fuera a quien no puede usarlo, que en un producto de trabajo diario es una
      exclusión que se nota todos los días.
    context: >-
      Al mover una tarjeta solo viaja la propiedad que cambió, no la página entera: devolver la página completa
      sobrescribiría lo que otra persona escribió en ella mientras la tarjeta estaba en el aire. El valor tiene que ser
      el identificador de una de las opciones que la propiedad ofrece; cualquier otro se rechaza en el servidor, aunque
      alguien lo pida por su cuenta. Si la columna es un día, la fila recibe esa fecha, y si tenía un rango de fechas,
      el rango conserva su duración.
    supersedes: BR-d7ada57
    superseded_by: BR-8e6b1f4
    scenarios:
      - title: Mover una tarjeta de estado
        given: Un tablero agrupado por estado
        when: Se arrastra una tarjeta de «Por hacer» a «Completado»
        then: La fila guarda el identificador de la opción de esa columna y nada más
  - id: BR-699e037
