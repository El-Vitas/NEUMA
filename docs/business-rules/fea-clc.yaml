id: FEA-CLC
name: Collections, properties and views
purpose: Groups the rules for what a collection stores, how its shape is defined and how it is viewed.
scope: collections
rules:
  - id: BR-0017487
    status: active
    title: '"Me" in a filter is whoever is looking, not whoever saved the view'
    rule: >-
      In a filter on a person, on created by or on edited by, "me" resolves to the person who queries the view, or to the
      token's owner when an agent queries. Two people who open the same view saved with "me" each see their own rows, and
      the counts and totals come from the same rows. The portal offers "Me" as the first option in the list of people, and
      the agent writes it as @me.
    why: >-
      A "My tasks" view saved with the identifier of whoever created it only serves that person. With "me" the same view
      serves the whole team and nobody sees someone else's rows by mistake.
    context: '"Me" only means something in those three properties. In any other, @me is text like any other.'
    scenarios:
      - title: Two people, one view
        given: A view filtered by assignee equal to me, and rows belonging to Ana and to Bo
        when: Ana and Bo open it
        then: Ana sees Ana's rows and Bo sees Bo's
  - id: BR-0e8cbda
    status: active
    title: A card's cover comes from the first image of a files property
    rule: >-
      A gallery or a board can show on each card the first image of a files property that the view names, and can draw the
      cards in three sizes that are stored in the view. A row with no image in that property carries no cover, and a file
      that is not an image does not count. The cover does not come from the content of the row's page.
    why: >-
      The images of a property travel with the row and can be requested all at once; reading the body of each row to find
      an image would cost one read per card and would force a notice every time someone edits a body.
    context: >-
      A cover from the content stays pending until there is a notice of changes to the rows' body. Size and cover belong to
      the view and are seen by everyone who looks at it.
    scenarios:
      - title: Row with a photo and a PDF
        given: A files property with a PDF first and an image afterwards
        when: The gallery is drawn with that property as the cover
        then: The card shows the image, not the PDF
  - id: BR-1de6648
    status: active
    title: A new row copies its template with new identifiers and in a single operation, and what is given wins
    rule: >-
      Creating a row from a template copies its content and its values with new identifiers, and everything is written
      together or nothing is. What whoever creates the row gives explicitly wins over the template, and the template wins
      over each column's initial value. If the row brings no title, it takes the template's; if it brings no content, it
      takes the template's.
    why: >-
      Whoever creates a row from a board column or a calendar day has already said where it goes, and the template must
      fill in the rest without undoing what was already said. With new identifiers, editing the row touches neither the
      template nor another row.
    context: >-
      Asking for a template that does not exist in that collection is rejected and creates nothing. Expressly asking for
      "no template" creates a blank row even if there is a default one.
    scenarios:
      - title: What is given wins
        given: A template with points equal to 3
        when: A row is created from it with points equal to 8
        then: The row ends up with 8 points and the rest of the template
      - title: The template wins over the initial value
        given: A column with initial value 1 and a template with 3
        when: A row is created from the template without giving the column
        then: The row ends up with 3
  - id: BR-1f4ab0f
    status: active
    title: Who created a row and when is told by the row itself, and nobody writes it
    rule: >-
      The properties creation date, last edit date, created by and edited by show what the row says about itself: when it
      was created, when it was last edited and who did it. The server fills them in and they cannot be written, neither
      through the screen nor through a request built outside. They can be filtered, sorted and grouped like any date or
      person, and they update on their own when the row changes.
    why: >-
      Copying that data as values would force keeping it up to date on every edit, and someone could write an author or a
      date that is not true. Reading them from the row makes them always true.
    context: A property of this kind is not marked as required nor does it change type.
    scenarios:
      - title: Writing a creation date
        given: A collection with the property "Creada"
        when: A request tries to write that value in a row
        then: It is rejected, and the row keeps showing its real date
  - id: BR-26daa9e
    status: active
    title: A change in the rows a rollup reads notifies whoever is looking at the collection
    rule: >-
      When a row changes in a collection that another collection reads with a rollup, whoever has the second collection
      open is informed and its values are recalculated. Whoever asks what changed in a collection also receives the rows
      whose rollup may have changed because a linked row changed, marked as such and not as changes of their own.
    why: >-
      If the rollup keeps the value from the last time it was looked at, a project's total contradicts the line items that
      were just edited.
    context: >-
      A person editing a row sees instantly how the formulas of that same row change, without waiting for the server; the
      server's value confirms it afterwards.
    scenarios:
      - title: A line item is edited
        given: A project that sums its line items and someone looking at it
        when: Another person changes the cost of a line item
        then: The project's total is updated
  - id: BR-2a96107
    status: active
    title: A property changes on its own, on top of what the row has at that moment
    rule: >-
      Changing a property of a row sends only that property, and the server merges it with those the row has at the moment
      of writing, without touching what the page says nor cutting a version. A row that has not yet stored any property
      sends all of them the first time.
    why: >-
      Sending all the properties back returned stale copies of those that were not touched: if another person changed the
      status while someone was editing the priority, the status went back. And rewriting the content along with the
      property could overwrite what the live document had just saved.
    scenarios:
      - title: Two people change different properties at once
        given: A task with status "Por hacer" and priority "Baja"
        when: One moves it to "Hecho" and another, at the same time, raises the priority to "Alta"
        then: The task ends up in "Hecho" and with priority "Alta"
  - id: BR-313962a
    status: active
    title: A board lets you hide groups and cross them into bands from the board itself
    rule: >-
      Whoever can edit a board view can hide a group from its column menu. Hidden groups are not drawn, are listed
      separately with the number of rows they hold and can be shown again one by one; their rows keep existing and are
      counted. They can also cross the board into bands by a second property, or remove them, and choose the size and cover
      of the cards, without opening the collection's settings. The group of rows with no value is hidden with its own
      button.
    why: >-
      A group that one team does not need, such as finished ones, takes up screen that another team needs, and hiding it
      must not change the data nor force deleting the option.
    context: >-
      Hiding belongs to the view and does not change what any row says. Moving a card to the hidden group is not possible
      while it is hidden, because there is nowhere to drop it.
    scenarios:
      - title: Hide and show again
        given: A board with the columns Pendiente and Hecho
        when: Hecho is hidden from its menu
        then: Hecho leaves the screen, appears in the list of hidden groups with its count, and can be shown again
  - id: BR-3695f4e
    status: active
    title: An open view finds out what other people change in its collection, only of what it can read
    rule: >-
      Whoever has a collection's view open receives a notice when another person changes a row, a view or the shape of that
      collection, and the view is drawn again without reloading the page. The notice carries only the identity and the
      version of the rows that changed, never their content. Each person receives only the rows they can read, and a row
      closed to them is not named, not counted and does not appear. When a row's permissions change or it leaves the
      collection, the person receives the order to query again, without saying which row it was. Several notices in a row
      are handled with a single read, and when a dropped connection comes back it is read once. Changes to a row's body are
      not notified through this channel.
    why: >-
      Without a notice, two people on the same board overwrite each other without knowing until one reloads. And a notice
      that named closed rows would reveal that they exist.
    context: >-
      The live channel admits up to 20 collections per connection. The same person's own pending writes go before the read,
      because the server's actions are executed in the order they were sent.
    scenarios:
      - title: A card moves for whoever is looking
        given: Two people with the same board open
        when: One changes a card's status
        then: The other sees it move to the new column without reloading
      - title: A closed row
        given: A person who cannot read a row of the collection
        when: Another person edits that row
        then: The first receives no notice that names it
  - id: BR-38653c2
    status: active
    title: A formula computes a row's value from what the row itself stores
    rule: >-
      A collection can have properties of type formula. A formula is written in a language of its own (operations,
      comparisons, conditions, text, number, date and list functions) and reads other properties of the same row by their
      name. Its result is a number, a text, a checkbox, a date or a list, and the column is treated as a property of that
      type, so it is displayed, filtered, sorted, grouped and computed as such. The value is not written by hand nor
      stored in the row, it is computed every time it is read, so it never shows something stale. A badly written formula,
      one that reads a property that does not exist, that mixes types that cannot be mixed or that depends on itself, is
      rejected when saving with a message that says what is wrong and, if there are similar properties, which ones they
      were.
    why: >-
      Whoever keeps a budget or a task list needs a total, a deadline or a status that is deduced from other data, and
      maintaining it by hand goes stale the day someone changes a datum.
    context: >-
      A formula can read other formulas and rollups, up to a depth cap. The same formula gives the same result in the
      portal, in the server's query and for agents. The text of a formula, its size and the work it can do per cell have
      caps, and a cell that exceeds them shows an error instead of hanging the view.
    scenarios:
      - title: A total recalculates on its own
        given: A collection with price and quantity, and a formula that multiplies them
        when: Someone changes a row's quantity
        then: That row's total shows the new value without anyone editing it
      - title: A formula with a misspelled name
        given: A formula that reads the property Prise
        when: It is attempted to save
        then: It is rejected and Price is suggested
  - id: BR-3dcf9e7
    status: active
    title: A required property is enforced when creating the row and when writing that property
    rule: >-
      A property can be marked as required. A new row is not created if it lacks a value in a required property, and
      whoever writes that property in a row cannot leave it empty. Editing another property of a row is not blocked because
      that row lacks a required value that was marked afterwards. A status, a checkbox, a unique identifier and the
      creation and edit data are not marked as required, because they always have a value.
    why: >-
      Enforcing required properties on every edit would block old rows because of a rule that was added later, and nobody
      could touch them until they filled in what was not asked for when they were created. Enforcing them only on creation
      would allow emptying them afterwards without anyone noticing.
    context: In the portal the property's name carries an asterisk.
    scenarios:
      - title: A property that became required later
        given: Old rows with no value in a property that is now required
        when: Someone edits another property of one of those rows
        then: The edit is accepted
  - id: BR-3de097e
    status: active
    title: A property that another reads cannot be removed or changed in a way that breaks it
    rule: >-
      A property that a formula reads, or that a rollup of this or another collection uses, cannot be removed while
      something reads it, and the rejection says which formula or rollup needs it. If it is renamed, the formulas that name
      it are updated to keep reading it. A formula or a rollup cannot be marked as required nor written by hand, nor
      converted from another type nor to another type.
    why: >-
      Silently removing a property would leave formulas and rollups that fail on every row without anyone knowing why.
    context: The same rule applies to whoever changes the shape from the portal and to an agent.
    scenarios:
      - title: Removing a property that a formula reads
        given: A formula that uses the price
        when: Removing the price is attempted
        then: It is rejected, naming the formula that uses it
  - id: BR-4d9da78
    status: active
    title: Changing a collection's shape and completing its rows is a single operation
    rule: >-
      When saving a collection's shape, what that change requires of the rows that already exist happens in the same
      operation as the change: the initial status of a new status property, the number of a new unique identifier
      property, and the cleanup of the options that were removed. If any step fails, for example because whoever saves
      cannot edit one of the rows, neither the new shape nor any changed row remains.
    why: >-
      A property created with the old rows half completed forces guessing what is missing and leaves different numbers or
      statuses depending on who got there first.
    context: >-
      The notices to those who have the collection open go out when the whole operation has already been confirmed. Saving
      the shape again after a rejection completes the rows without repeating numbers.
    scenarios:
      - title: A row that cannot be edited
        given: A collection with a row that whoever saves can only read
        when: They add a unique identifier property
        then: It is rejected, the property does not exist and the row did not change
      - title: All fine
        given: A collection with three rows
        when: A status property is added
        then: The three rows end up in the initial status along with the property
  - id: BR-4ddd139
    status: active
    title: Searching and changing month request the rows from the server, and what does not fit is said
    rule: >-
      Searching in a collection sends the words to the server, which filters by the row's title and by its text answers
      (rich text, link, email and phone), without distinguishing capitalization or accents. The rows, the counts and the
      next pages of all views come from that same search, and the words are kept when changing view, so nothing is hidden
      on its own among what was already loaded. A calendar reads all the rows that start on the days of its month grid,
      with the days of the incomplete weeks, and changing month requests them again. If the grid has more than a thousand
      rows, the first thousand are drawn and the screen says so. Rows without a date are counted separately and are not
      lost from view.
    why: >-
      Filtering on screen only what was loaded presents an incomplete result as if it were complete, and a calendar that
      keeps the first hundred rows silently makes the rest disappear.
    context: >-
      Numbers, dates and option names are not searched, because typing a 3 would match half the collection. The words and
      the month travel in the page address so they can be shared and reloaded.
    supersedes: BR-fbf632f
    scenarios:
      - title: Searching with many rows
        given: A table of two thousand rows of which only fifty were loaded
        when: A word is searched that a row that was not loaded says
        then: The row appears and the count counts the rows that match across the whole collection
      - title: Searching in a text answer
        given: A row whose title does not say reunión but whose notes do
        when: reunion is searched without the accent
        then: The row appears
      - title: A month with more than a hundred rows
        given: A calendar with one hundred thirty rows in the same month
        when: That month is opened
        then: The one hundred thirty rows of the grid are drawn
  - id: BR-4fef023
    status: active
    title: A collection is viewed in several ways, and each one remembers its own
    rule: >-
      The same rows of a collection are viewed as a table, as a board, as a list, as a gallery, as a calendar or as
      progress, and a collection can have several views at once. Each view stores on its own what it groups by, what it
      filters, how it sorts, which properties it shows and how tall a row is, so changing one does not touch the others.
      One of them is marked as the main one, and it is the one the collection opens with when nobody asks for another.
    why: >-
      The same rows answer different questions depending on who looks at them: whoever distributes work wants columns by
      status, whoever reviews dates wants a calendar, and whoever looks for a note wants a list of names. Forcing everyone
      to look at the same table makes each person build their own outside, and then there stops being a single collection.
    context: >-
      A board and a grid group; a table, a list and a gallery do not. A view that needs to group and has nothing to group
      by says so before being saved, instead of staying blank.
    scenarios:
      - title: Two views of the same rows
        given: A collection with a table view and a board view
        when: A filter is set on the board
        then: The table keeps showing what it showed
      - title: The view it opens with
        given: A collection whose main view is the gallery
        when: Someone opens the collection's page
        then: They are shown the gallery
      - title: A board with nothing to group by
        given: A board view for which no grouping property was chosen
        when: It is attempted to save the settings
        then: It says what is missing and does not save
  - id: BR-59b630f
    status: active
    title: A status always has a value and its options live in three groups
    rule: >-
      A status property offers its options distributed in three fixed groups: to do, in progress and done. Each group keeps
      at least one option. A status property is born with one option in each group, a new row starts at the first "to do"
      option, and a row never stays without a status: deleting it is not allowed. One can filter by an option or by a whole
      group, and rows are sorted by group and, within it, by the option's position.
    why: >-
      A status is what says where the work stands. If a row could be left without a status, the "unassigned" column of a
      board would hide work that nobody knows where it stands. And the groups make it possible to ask "what is still open"
      without having to list all the options that each team invented.
    context: >-
      A status cannot be made required, because it already always has a value. Removing an option moves its rows to
      another of the same group. A status is not converted from another type nor converted into another.
    scenarios:
      - title: A new row
        given: A collection with a status property
        when: A row is created without stating the status
        then: The row starts at the first option of the "to do" group
      - title: Trying to leave a row without a status
        given: A row with a status
        when: Someone asks to delete the value
        then: It is rejected, and the status stays as it was
  - id: BR-5bd97c6
    status: active
    title: Each option of a property carries its name, its color and an identifier of its own
    rule: >-
      A select, multi-select or status property defines its options, and each option is a name, a color and an identifier
      that the server gives it when creating it and that never changes. Rows, filters, groupings and column caps store the
      identifier, not the name. Renaming an option changes only the collection's shape and no row is touched. Removing an
      option leaves the rows that had it without that value, and in a status those rows move to another option of the same
      group. The color is optional and is a closed, named set; one that the product does not know is discarded when read
      and the option is left without a color.
    why: >-
      With the name as the value, renaming an option forced rewriting every row that had it, and two people renaming at the
      same time left rows pointing to a name that no longer existed. With a stable identifier the name is only what is
      read, and changing it is immediate and cannot break anything.
    context: >-
      Identifiers are unique within each property, not across properties. That is why a row that is moved to another
      collection whose options have other identifiers is rejected, instead of storing a value that that collection does not
      understand. Collections created earlier stored the name: a migration gave each option an identifier and rewrote rows,
      filters and groupings. The option's name is always shown next to the color.
    supersedes: BR-12b587f
    scenarios:
      - title: Renaming does not touch the rows
        given: A select with the option "Alta" that two rows have chosen
        when: Someone renames it to "Urgente"
        then: Both rows still choose it and show it as "Urgente", without any row having been written
      - title: Removing an option from a status
        given: A status with two options in the "In progress" group and a row from which one will be removed
        when: That option is removed
        then: The row moves to the other option of the "In progress" group
  - id: BR-5e4ab65
    status: active
    title: Selecting everything that matches acts on all the rows, up to a thousand, or says there are too many
    rule: >-
      When the marked rows are fewer than those that match the view and the search, the bar offers to mark all those that
      match, including those that were not loaded. Up to a thousand rows can be marked at once; if more match, the bar says
      so and asks to narrow down with a search or a filter, and does not mark a part. What is done with those rows can be
      undone with the values they had.
    why: >-
      Deleting or assigning over the loaded rows while the screen implies that they are all leaves rows untouched and
      nobody notices.
    context: The limit of a thousand is the number of ids that a query response returns.
    scenarios:
      - title: More rows than loaded
        given: A table of one hundred thirty-eight rows with fifty loaded and marked
        when: Marking all that match is chosen
        then: All one hundred thirty-eight end up marked
      - title: Too many
        given: A table in which one thousand five hundred rows match
        when: The loaded ones are marked
        then: The bar says there are too many and does not offer to mark them all
  - id: BR-61a1857
    status: active
    title: A date can be a day or a range, and a person can be one or several
    rule: >-
      A date property stores a day or a starting instant and, if desired, an end that is never earlier than the start; both
      ends are either both days or both instants. A date that falls within a range matches any day of the range, and
      "before" and "after" compare against the range's end and start. A person property always stores a list of space
      members. By default it admits a single person; the property can allow several, and then it is filtered with
      "contains" and "does not contain".
    why: >-
      A job lasts days and does not fit in a single date. And a job with several people responsible forced creating one
      person property for each.
    context: >-
      The calendar places a row on the day it starts. Moving a row from one day to another keeps its range's duration.
      Changing a person property from several to a single one does not rewrite the rows that already have more than one.
    scenarios:
      - title: An end earlier than the start
        given: A date that starts on the 10th
        when: It is attempted to save it with an end on the 8th
        then: It is rejected
  - id: BR-6571dc2
    status: active
    title: A rollup never counts a row that whoever is looking cannot open
    rule: >-
      When computing a rollup for someone, the linked rows that that person cannot open, and those that are in the trash,
      are not read and therefore are not counted, not summed and not shown. Two people can see different values in the
      same rollup, and that is correct. It applies equally to the portal and to agents, which have the permissions of the
      person who owns their token.
    why: >-
      A total that includes a secret row tells whoever looks at it that the row exists and how much it is worth, even if
      they cannot open it.
    context: The same applies when filtering, sorting, grouping and computing a view's totals by a rollup.
    scenarios:
      - title: A closed line item does not add up
        given: A project with three line items and a person who can only open two
        when: That person reads the sum rollup
        then: The sum does not include the third line item
  - id: BR-65a2252
    status: active
    title: A date window brings all the rows that reach those days, and warns if they do not fit
    rule: >-
      A timeline or a calendar asks the server for the rows whose dates overlap the days it shows, not only those that
      start in them; a row that started earlier and reaches the window is drawn. When the end is in another property, the
      overlap also covers the row that only has a start, which lasts the day it starts. If there are more rows in the
      window than the screen reads, the screen says how many it draws instead of passing the first ones off as all of
      them. An agent asks for the same with a window of days over a date column, which is added to the view's filter.
    why: >-
      Asking only for the rows that start inside the window hides long tasks exactly when they are in progress, which are
      the ones that matter most. And a silent cut makes people believe there is nothing more.
    context: >-
      The window is compared by days in the calendar of whoever is looking. A row without a date is never in a window; it
      is counted separately.
    scenarios:
      - title: A task that started last month
        given: A row from September 28 to October 5
        when: The October window is requested
        then: The row comes, because its range touches October
      - title: An overly full window
        given: A window with more rows than the screen reads
        when: The timeline is opened
        then: The screen warns that it draws only the first ones
  - id: BR-6972f50
    status: active
    title: A number has a format, and a link, an email and a phone are checked when saved
    rule: >-
      A number property chooses how it is displayed: number, percentage or currency, with a maximum number of decimals that
      is enforced when saving. A percentage is written and displayed as a percentage but is stored as a fraction, so
      changing the format does not change what the rows stored. A currency carries its three-letter code. A link property
      only admits web addresses, the email property requires an email with a valid form and the phone property requires a
      number with a reasonable number of digits; a link is never opened if it is not a web address. A files property stores
      up to ten files that were already uploaded and that whoever writes can attach.
    why: >-
      A free text field lets through a link that does not open, an email with a typo or a number without its currency, and
      the error is discovered when someone tries to use it. And a percentage stored as 25 in one row and as 0.25 in another
      cannot be summed.
    context: >-
      The files in a cell are chosen from those that were uploaded to the row's page. Whoever can read the row can read the
      names of those files, no more.
    scenarios:
      - title: A link that is not web
        given: A link property
        when: Someone saves "javascript:alert(1)"
        then: It is rejected
  - id: BR-6d4a26c
    status: active
    title: A unique identifier numbers the rows without repeating or reusing a number
    rule: >-
      A unique identifier property gives each new row the next number of the collection, starting at one. The number is
      written by the server when creating the row; nobody writes or changes it, and a number that someone sends is ignored.
      A number is never given again, not even when the row is deleted. The property can carry a prefix that only changes
      how the number is displayed, not the stored number. When adding the property to a collection with rows, each existing
      row receives its number in the order in which it was created.
    why: >-
      An identifier that is reused or that can be written stops identifying: two different rows would end up with the same
      number in a conversation, and nobody would know which one is being talked about.
    context: >-
      Two rows created at the same time receive different numbers. It cannot be marked as required, because the server
      fills it in.
    scenarios:
      - title: A deleted row
        given: A collection with rows 1, 2 and 3
        when: Row 3 is deleted and another row is created
        then: The new row receives 4
  - id: BR-6d8414e
    status: active
    title: What the server fills in is written by nobody else, whichever path it comes in through
    rule: >-
      The number of a unique identifier and the fields of who created or edited a row and when are filled in by the
      server. A block write that tries to set or change them, whether it comes from a hand-sent transaction or from the live
      channel, is rejected whole with the code BLOCK_PROPERTY_SERVER_ASSIGNED and changes nothing. Creating a row that
      asks for a number of its own is not rejected: the server gives it the next one and discards the request.
    why: >-
      If only the pages API watched over it, a block transaction would be enough to give a row another row's number or
      sign it with someone else's name. The rule holds in a single place, where all writes pass.
    context: >-
      The server keeps writing these values through its own path. The row's other values are written normally in the same
      transaction.
    scenarios:
      - title: A hand-written number
        given: A row with the number 3 in a collection with a unique identifier
        when: A block transaction tries to set it to 99
        then: It is rejected with BLOCK_PROPERTY_SERVER_ASSIGNED and the row keeps the 3
      - title: Someone else's signature
        given: A collection with a field of who created the row
        when: A transaction creates a row with another person in that field
        then: It is rejected and the row is not created
  - id: BR-81880e6
    status: active
    title: Each change to a view touches a single thing, and two people who touch different things do not overwrite each other
    rule: >-
      A view is changed with small operations, each on a single thing, such as setting a filter, removing a sort,
      widening a column or folding a group. The server applies them on top of what the view has at that moment, all or none,
      and raises the view's version for each operation. If two people change different things of the same view, both
      changes remain; if they change the same thing, the last one remains. A filter is changed through its conditions, each
      with its identifier, not by rewriting the whole filter. Only whoever can edit its collection can change a view, and a
      locked collection or one in the trash does not change its views.
    why: >-
      Sending the complete view configuration silently erases what another person changed in the meantime, and the
      configuration stays open while the rows keep living alongside. With small operations one person's change never
      carries stale copies of what it did not touch.
    context: >-
      Changing a view's name or the one that opens by default is still changing the collection's shape. The screen keeps
      editing a complete configuration; what travels is only the difference.
    supersedes: BR-22dc232
    scenarios:
      - title: Two people in the same view
        given: Two people with the same view open
        when: One groups by status and the other widens a column
        then: The view ends up grouped by status and with the widened column
      - title: A locked collection
        given: A locked collection
        when: Someone tries to set a filter on one of its views
        then: The change is rejected and the view stays as it was
  - id: BR-8986494
    status: active
    title: An agent can create and configure date and card views, with the names people see
    rule: >-
      An agent can create a timeline view and change, in any view, the date column that places the rows, the column where
      each row ends, the scale, the column the cover comes from, the size of the cards and a board's second grouping,
      naming columns as people see them. A column that is not of the type that setting asks for is rejected, saying which.
      What the agent changes arrives as the change of those keys of the view, so it does not overwrite what another person
      changed in the meantime, and when reading the collection it sees those settings with the columns' names.
    why: >-
      An agent that can only look at a timeline or leave it as the person created it cannot prepare it for whoever is going
      to use it. And if the agent's views were stored whole, they would erase the settings the person made on screen.
    context: >-
      The permissions are those of the person who owns the token. Views are created with the complete configuration only
      when they are born.
    scenarios:
      - title: A column that is not a date
        given: A collection with a text column called Notas
        when: An agent asks for the timeline to start at Notas
        then: It is rejected, saying that it is not a date column
  - id: BR-8bd78a9
    status: active
    title: An agent handles templates with the same rules as a person
    rule: >-
      An agent can list a collection's templates, create a row by naming a template by its name or its identifier, and
      create, change and delete templates. It receives exactly the permissions of the person who owns its profile, so
      whoever cannot edit the collection does not change its templates through the agent. The descriptions of the agent's
      service explain how the default template and the words today and me work.
    why: >-
      An agent that could not use templates would have to reproduce by hand what the template already knows, and would do
      it differently each time.
    context: >-
      Naming a template with a repeated name asks for the identifier. Asking for a template that does not exist lists those
      that do exist only if the profile can read the collection.
    scenarios:
      - title: An agent creates a row without naming a template
        given: A collection with a default template
        when: An agent creates a row with just a title
        then: The row is born with the content and values of the default template
  - id: BR-8e6b1f4
    status: active
    title: A dragged card changes the column's value and stays where it was dropped, in a single write
    rule: >-
      On a board, each column is a value of the property it is grouped by. Dragging a card to another column writes that
      value in the row and leaves it at the place where it was dropped, among the other cards of that view, and both things
      happen together or neither happens. Dropping it in the column of rows with no value removes the value instead of
      writing the word "sin asignar" into it. Dropping it where it already was writes nothing. When the property stores
      several values, the card leaves the value of the column it comes from and takes that of the column it arrives at, and
      keeps the others. If the view sorts by a property, that order decides the place and only the value is written. The
      same is done from the keyboard, with Alt and the arrows, and the result is announced. Whoever cannot edit the row
      cannot move its card. On a board grouped by status there is never a column of rows with no value, because a status
      always has a value.
    why: >-
      A board where each card has to be opened to change its status is a list in columns. And if the value and the place
      were written separately, a half failure would leave the card in the new column and the old place, or the other way
      around.
    context: >-
      When moving a card only what changed travels, not the whole page. The value has to be the identifier of an option
      that the property offers; any other is rejected on the server. Each view has its own order of cards.
    supersedes: BR-5a97271
    scenarios:
      - title: Moving and ordering
        given: A board with three cards in Por hacer and one in Hecho
        when: The last one in Por hacer is dragged to the beginning of Hecho
        then: The card ends up in Hecho, before the one that was already there, and stays there on reload
      - title: A half failure
        given: A row that cannot be edited
        when: Moving it to another column is attempted
        then: Neither its value nor its place changes
  - id: BR-951dca7
    status: active
    title: A table lets you put rows in another place by hand and wrap text per column
    rule: >-
      In a table that does not sort its rows by any property, whoever can edit can take a row to another place by dragging
      it by its handle or with the keyboard, and the row ends up next to the neighbor it was dropped on. The place is that
      view's own order and is seen by everyone who looks at it; other views of the collection do not change. When the view
      sorts by a property, the row's place is that of that order and the handle is not offered. Each column can also wrap
      its text across several lines even if the table as a whole does not, and the view's width and pinned columns are
      also stored in it.
    why: >-
      A manual order that changes the whole collection's order scrambles the side tree and the other views. And wrapping
      the text of all columns because of a single long one makes the table illegible.
    context: >-
      A row is only taken among those of its same group when the table groups. Wrapping a column raises a short row to
      medium, because the extra lines would be cut off.
    scenarios:
      - title: Taking a row before another
        given: A table with no sort by property with rows A, B and C
        when: C is dropped on the upper half of A
        then: It ends up C, A, B, with a single write that names A as the neighbor
      - title: Sorted table
        given: A table sorted by priority
        when: It is looked at by someone who can edit
        then: There is no handle to take rows to another place
  - id: BR-974f23f
    status: active
    title: A calendar is seen by week or by month and draws ranges day by day
    rule: >-
      A calendar can be seen by month or by week, and the scale is stored in the view. A row with a date range appears on
      each day it lasts, at the same height on all of them and named where each stretch begins; rows that share a day do
      not cover each other. Dragging a stretch moves the whole range taking as reference the day it was grabbed by, and
      with the keyboard the day moves one at a time or seven at a time.
    why: >-
      A three-day task drawn on a single day lies about the real load of those days. And moving a range by its first day
      when it was grabbed by the last leaves it far from where the hand dropped it.
    context: Changing month or week requests the new days from the server; the scale does not change because of that.
    scenarios:
      - title: Range grabbed by its second day
        given: A range from September 10 to 12
        when: It is grabbed by the 11th and dropped on the 15th
        then: The range ends up from the 14th to the 16th
  - id: BR-991f4fd
    status: active
    title: A quick filter is added to the view without changing it
    rule: >-
      Whoever looks at a collection can put a quick filter on top of the view's, with the same conditions, including
      relative dates and "me". The quick filter travels in the page address and is added with "and" to the view's. It
      applies to the rows, the counts, the next pages and the selection of all that match, and is kept when changing view.
      It is not stored, nobody else sees it and the view stays as it was. If it lets no row through, the screen says so and
      offers to remove it.
    why: >-
      Looking at "my things this week" for a moment should not force editing the team's view nor creating another, nor
      leaving a filter that the next person to open it does not know where it came from.
    context: It can also be used by those who only read the collection.
  - id: BR-9afad17
    status: active
    title: The default template is used when creating a row by any path, and there is only one per collection
    rule: >-
      A collection has at most one default template. When a row is created without naming a template, from a table, a
      board, a calendar or an agent, the default template is used if it exists. Changing the default template is a single
      write on the collection, and deleting the template that was the default leaves the collection without a default
      template.
    why: >-
      If the default depended on the view, the same row would be born differently depending on where it was created and an
      agent would have no way of knowing what it starts with.
    context: >-
      The default template belongs to the collection and not to each view. A template per view could be added later without
      changing this rule. A collection stores at most fifty templates.
    scenarios:
      - title: A board column uses the default template
        given: A collection with a default template
        when: Someone adds a card in a board column
        then: The card is born with that template's content and values and with the column's value
  - id: BR-a4aa5e3
    status: active
    title: A rollup summarizes a property of the rows that a relation links
    rule: >-
      A collection can have properties of type rollup. A rollup follows a relation of the collection, takes a property of
      the linked rows and summarizes it with a calculation (count, sum, average, minimum, maximum, median, fill
      percentages, or show the original values). The calculations offered are those that make sense for the type of the
      chosen property, and the result is a value of the corresponding type, which is filtered, sorted and grouped like any
      other. The original values serve for display and for agents, but cannot be filtered, sorted or grouped. A rollup can
      read a property of another collection that is itself a rollup or a formula, up to a depth cap, and can never form a
      cycle.
    why: >-
      A project's total line items, the progress of its tasks or the next delivery date live in rows of another collection,
      and without this everyone sums them by hand or exports them to a spreadsheet.
    context: >-
      A rollup only reads rows of the collection the relation points to and cannot switch relations without choosing the
      property and the calculation again.
    scenarios:
      - title: Sum of a project's line items
        given: A project linked with three line items of 10, 20 and 30
        when: The rollup that sums the cost is read
        then: It shows 60
  - id: BR-aa08c26
    status: active
    title: A row with no value does not meet what asks for a value
    rule: >-
      A row that has nothing in the property does not meet a condition that asks for a value ("is", "contains", "is before",
      "is greater than", "is in the group"), and does meet one that asks for its absence ("is not", "does not contain", "is
      not in the group"). A checkbox that was never touched is read as unchecked. The conditions "is empty" and "has a
      value" stay the same.
    why: >-
      With "assignee contains me" or "due before today", rows without an assignee or without a date appeared in the list as
      if they belonged to the person or were overdue, and the view stopped being useful for what it promised.
    context: >-
      Before, a row with no value passed any condition on that property. The shared engine and the server's query apply the
      same rule.
  - id: BR-ae2730d
    status: active
    title: A selection is sorted by the position of its options, not by its name
    rule: >-
      When sorting rows by a select, a multi-select or a status, the order is that of the property's option list, not
      alphabetical: the first option goes first. A status sorts by group and, within each group, by position. A date sorts
      by its start and then by its end, and a relation by how many links it has. Rows with no value always go last.
    why: >-
      An alphabetical order of "alta", "baja" and "media" is not the order someone gave to priority, and it forces
      numbering the options so that they come out right.
    context: Changing the order of the options changes the order of the rows.
    scenarios:
      - title: Priorities
        given: A select with the options Alta, Media and Baja in that order
        when: The rows are sorted from lowest to highest by that select
        then: Those with Alta come out, then Media, then Baja, and those without a value last
  - id: BR-af673e9
    status: active
    title: A template is a row's starting point and is never a row, and a deleted template can be recovered
    rule: >-
      A collection can have templates, and each one stores a name, a content and the values a row starts with. A template
      is not a row of the collection, so it appears in no view, count, search result, change list, side tree or agent
      listing, and it does not consume a unique identifier. It is only seen in the collection's template list and by
      opening it through its address. A deleted template goes to the trash, where it is shown as a template of its
      collection and not as a row, and when restored it returns to the collection's templates, without becoming the
      default template again.
    why: >-
      If a template counted as a row, the totals would lie and a board would show a card that nobody created. And an
      accidental deletion cannot be unrecoverable while any other page is recovered from the trash.
    context: >-
      A template is edited like any page and inherits its collection's permissions. Duplicating a collection with its pages
      also carries its templates and the default template. Emptying the trash also deletes the templates in it.
    supersedes: BR-554783b
    scenarios:
      - title: A count does not include templates
        given: A collection with three rows and two templates
        when: Someone asks for the view's count
        then: The count says three
      - title: Recovering a deleted template
        given: A default template that someone deleted by mistake
        when: Someone restores it from the trash
        then: It returns to the collection's template list and the collection is left without a default template
  - id: BR-b52cd07
    status: active
    title: A view's totals say what percentage of the rows has a value
    rule: >-
      Besides counting and summing, a view's footer can show the percentage of rows with a value and the percentage of
      empty rows of a property. The result is the same for stored and for computed properties, and when there are no rows
      the percentage is not invented.
    why: Knowing that 40% of the tasks have no assignee says more than knowing it is 12 of 30.
    context: A percentage of a computed property is measured among the rows that could be computed.
    scenarios:
      - title: Percentage with a value
        given: Four rows and a property with a value in three
        when: The percentage with a value is requested
        then: The result is 75%
  - id: BR-c00503a
    status: active
    title: '"Today" and "me" in a template are resolved when creating the row, for whoever creates it'
    rule: >-
      A template can leave a date column to be filled with today's date and a person column to be filled with whoever
      creates the row. They are the only two words a template admits. They are resolved at the moment each row is created,
      with the calendar of the time zone of whoever creates it, and the resulting row stores the day and the person, never
      the word.
    why: >-
      A weekly meeting template that always said the date on which the template was made would be useless, and one that
      always pointed to its author would assign the work to whoever it does not belong to.
    context: >-
      "Today" only fits in a date column and "me" only in a person column; any other combination is rejected when saving
      the template. Without a time zone, UTC is used. What whoever creates the row gives explicitly wins over these words.
    scenarios:
      - title: Today according to the zone of whoever creates
        given: A template with the due date marked as today
        when: A person in Santiago creates a row at 23:30 local time
        then: The due date is the local day in Santiago
  - id: BR-c0f99c2
    status: active
    title: A collection is read in pages, and a cut one is never presented as if it were whole
    rule: >-
      A view does not bring all of a collection's rows. It brings a first page of rows, or of each column if it groups, and
      each page says whether there are more and where to continue from. Whoever reads asks for the next page with that
      continuation point, and the order does not change between pages even if rows are added or moved. How many rows there
      are in total, how many there are in each group and what the columns sum or average are computed over all the rows
      that pass the filter, not over those already brought, and arrive separately so that the rows are drawn without waiting
      for them. A cut collection is never presented as whole.
    why: >-
      A collection that grew on its own would cost, when opened, in proportion to everything it stored, and filtering over
      an already cut collection answers that nothing matches when what matches was left out. Giving the total separately
      makes it possible to see the rows right away and still not lie about how many there are.
    context: >-
      Each response carries at most a thousand rows and a page of rows carries at most a hundred. The agent receives the
      same as the screen and can ask for only the counts, only one group or only the columns it needs.
    supersedes: BR-3c85c11
    scenarios:
      - title: A collection of thousands of rows
        given: A collection with ten thousand rows and a table view
        when: Someone opens the view
        then: They see the first rows right away, the total arrives afterwards, and they can ask for more rows without the order changing
      - title: A count with a filter
        given: A view with a filter that leaves three thousand rows
        when: The total is requested
        then: The total is three thousand even though only fifty rows were brought
  - id: BR-c974803
    status: active
    title: An agent reads only what changed in a collection since its last read, without losing any change
    rule: >-
      A collection query delivers a cursor, and the changes tool returns the rows written since that cursor, with their
      current state, the identifiers of those that went to the trash, the total number of rows the agent can read and a new
      cursor. The cursor relies on the identifier of the transaction that wrote each row, so a write that is confirmed late
      is never lost; in exchange, it can repeat rows, and each row carries its version to recognize the repetition. Rows
      closed to the agent are neither named nor counted. A cursor that the server did not write asks to read the collection
      again. The agent can ask the call to wait up to 25 seconds for something to change.
    why: >-
      Rereading the whole collection to know what changed wastes the agent's context and does not say what changed. A
      cursor by date would lose the changes of transactions that started earlier and were confirmed later.
    context: >-
      Each write of a block leaves in it the identifier of its transaction by means of a database trigger. This turns a
      block's updates into non-HOT ones for the index that serves it.
    scenarios:
      - title: Only what changed
        given: An agent with the cursor from its last read
        when: Someone renames a row
        then: The tool returns that row and a new cursor, and the next call returns nothing
      - title: A late transaction
        given: A transaction that started before the cursor was delivered and is confirmed afterwards
        when: The agent asks for the changes since that cursor
        then: The row from that transaction appears
  - id: BR-d1358d5
    status: active
    title: A timeline places each row on the days it lasts
    rule: >-
      A timeline view draws each row as a bar from its start day to its end day, on a scale of days, weeks or months that is
      stored in the view. The start and the end come from a single date property with a range, or from two date properties
      when the view names one for the end. A row with no start has no place in time, so it is listed separately with its
      total count, and the bar of a row that continues beyond the displayed days is cut at the edge saying that it
      continues. A mark points to today's date in the calendar of whoever is looking.
    why: >-
      A start date and an end date say how long something lasts, and that is what a team needs to see in order to plan. A
      row without a date that disappears from the drawing looks deleted, and a fixed scale forces choosing between seeing
      the year or seeing the week.
    context: >-
      Days are read without the time; an end earlier than the start is read as the start day. The scale belongs to the view,
      not to whoever is looking. If the view does not yet say which date holds the start, the screen asks for it instead of
      drawing empty.
    scenarios:
      - title: A row with a range
        given: A row with a date from September 14 to 18 and a timeline by days
        when: The timeline is opened on those days
        then: The row is drawn as a five-day bar that starts on the 14th
      - title: A row with no start
        given: A row with no start date
        when: The timeline is opened
        then: It has no bar and appears in the list of rows with no start, which says how many there are in total
  - id: BR-d39ee9c
    status: active
    title: What someone cannot open does not enter their counts, and if it cannot be computed correctly that is said
    rule: >-
      A view's totals, group counts and calculations are made only over the rows that whoever is looking can open, and two
      people with the same permissions see the same numbers on screen and in the agent. A relation neither counts nor shows
      the rows of the other collection that whoever is looking cannot open, and if they cannot open that collection the
      relation looks empty. If a collection has so many rows closed to whoever is looking that they cannot be left out
      exactly, the query is rejected with an error that says so and is recorded with the collection, instead of silently
      counting wrong.
    why: >-
      A count that includes rows that cannot be seen gives away that they exist and how many, and a count computed in a
      different way for each screen never matches. Rejecting with a reason is better than giving a number that may be false.
    context: >-
      The limit is five thousand closed rows in a single collection. The own rules of an agent token over specific pages
      count the same as the row's permissions.
    scenarios:
      - title: A closed row
        given: A collection of ten rows, one closed to a person
        when: That person asks for the total and the group counts
        then: They see nine rows, nine in the groups and nine in the total
      - title: Too many closed
        given: A collection with more than five thousand rows closed to a person
        when: They ask for a count
        then: They receive an error that says why it cannot be computed
  - id: BR-d71ba80
    status: active
    title: Each view orders rows by hand in its own way, and until it does it follows the collection's order
    rule: >-
      A view can have its own manual row order. As long as it does not have one, it follows the order in which the
      collection lists its rows, so the side bar and the views that nobody ordered look as always. The first time someone
      places a row in a view, that view takes the collection's order as its starting point and from then on carries it on
      its own, without touching that of the others. A new row is added at the end of the views that already have an order
      of their own, in the same operation that creates it. A row that is deleted forever disappears from all orders in the
      same operation. Two people who place different rows at the same time keep both placements.
    why: >-
      A single order for the collection would mean that moving a card on a board changes the row's place in every table and
      list, and a per-view list of ids that does not clean up what is deleted ends up pointing to rows that no longer exist.
    context: >-
      A manual order stores up to twenty thousand rows. If the view sorts by a property, that property governs and the
      manual order only breaks ties.
    scenarios:
      - title: A view with no order of its own
        given: A table and a board of the same collection, and nobody has placed rows
        when: A card is moved on the board
        then: The board ends up with the new order and the table stays as it was
      - title: A deleted row
        given: A row that appears in a board's order
        when: It is deleted forever
        then: The board no longer carries it in its order nor is it counted in any relation
  - id: BR-dcdbcbc
    status: active
    title: A cell that cannot be computed says so, and does not spoil the rest
    rule: >-
      When a formula or a rollup cannot be computed for a row (for example, a division by zero, a text that is not a number
      or a datum that depends on another that failed), that cell shows an error with its code and its reason, and the other
      cells and rows are computed normally. An agent receives the same error in the row's property. The view's totals do
      not count those cells as values and say how many failed.
    why: >-
      An error hidden as an empty cell makes people think there is no data, and an error that brings down the whole table
      because of a single row prevents working with the others.
    context: >-
      If the view's computation asks to look at more rows than can be computed at once, the query is rejected with a message
      that asks to narrow the filter, instead of returning something partial without saying so.
    scenarios:
      - title: A division by zero
        given: A formula that divides by the quantity and a row with quantity 0
        when: The table is read
        then: That cell shows a division-by-zero error and the other rows show their result
  - id: BR-dd13106
    status: active
    title: Dragging or stretching a bar changes that row's dates and nothing else
    rule: >-
      Moving a timeline bar shifts the start and the end together, keeping the duration and the time of day. Stretching one
      of its ends changes only that end, without letting it cross the other. Each gesture is a single write that carries
      only the dates that changed, so it does not overwrite what another person edited in the row in the meantime, and the
      bar is seen in its new place before the server responds and goes back to where it was if the server rejects it. Every
      gesture has its keyboard equivalent, and whoever cannot edit looks but does not drag.
    why: >-
      If the drag sent the whole row, two people moving different things of the same row would undo each other. And a
      gesture that can only be done with the mouse leaves out whoever cannot use it.
    context: >-
      With the end in another property, moving writes both properties in the same write; stretching the end of a row that
      had no end creates one.
    scenarios:
      - title: Moving a bar
        given: A bar from September 14 to 18
        when: It is dragged three days to the right
        then: The row ends up from the 17th to the 21st, with a single write of its date
      - title: Stretching past the start
        given: A bar from September 14 to 18
        when: Its end is stretched nine days to the left
        then: The end stays on the start day and does not cross it
  - id: BR-f45f95c
    status: active
    title: A relation links rows of another collection, and each link is added or removed one at a time
    rule: >-
      A relation property points to the rows of another collection in the same space. It can be created in one direction,
      or in both: in that case the other collection receives a property that points back, and adding or removing a link on
      one side adds or removes it on the other in the same act. Links are changed one at a time, with one add command and
      another remove command, so that two people editing the same cell at once do not overwrite each other; the whole list
      is not written. A cell links up to a hundred rows and respects the order in which they were added. Whoever reads only
      sees the links to rows they can open. To change a relation in both directions it is necessary to be able to edit the
      row on the other side as well: if that is not possible, the whole operation is rejected with an error that names that
      side, and nothing changes. Removing a relation property leaves the one on the other side as a one-way relation, with
      its values.
    why: >-
      Without relations, linking two collections forces copying names by hand, which go stale. And if a person could edit
      someone else's row through the mirror of a relation, the relation would be a door to skip that row's permissions.
    context: >-
      The collection it points to is chosen only once, when creating the property. The property pointing back is never
      named from outside: the server creates it. A relation is not added from an external agent today; it is only read.
    scenarios:
      - title: Linking in both directions
        given: A two-way relation between Tareas and Proyectos
        when: Task T1 is linked to project P1
        then: P1 shows T1 in the property pointing back, with no other change
      - title: No permission to edit the other side
        given: A person who can edit T1 but only read P1
        when: They try to link T1 to P1 in a two-way relation
        then: Everything is rejected, with an error that says the mirror side cannot be edited
  - id: BR-f6f03fe
    status: active
    title: A column change does not overwrite the one that someone else made in the meantime
    rule: >-
      Whoever changes a collection's columns does so on the shape they read. If when saving the shape is no longer that one,
      because another person or an agent changed it in between, the change is rejected whole and it is announced that the
      collection changed, so that it is looked at again before trying again.
    why: Saving over an old shape would silently erase the column or the option that the other had just added.
    context: It applies equally to the portal and to agents. What had already been done before the rejection is reported as done.
    scenarios:
      - title: Two changes at once
        given: An agent read a collection's columns
        when: A person adds a column and then the agent saves its change
        then: The agent's change is rejected saying that the collection changed, and the new column is still there
  - id: BR-f707396
    status: active
    title: A filter is built with groups, and each group says whether it asks for all or any
    rule: >-
      A view's filter is not a flat list of conditions: it is a group that contains conditions and other groups, and each
      group declares whether it is met when all the things it carries inside are met or when any one of them is met. This
      is how "due this week and unassigned, or marked as urgent" is expressed without leaving the screen. A condition that
      points to a property the collection no longer has stops being applied and is not drawn, instead of filtering by
      something that nobody can see or correct.
    why: >-
      With loose conditions always joined by "and", half of the real questions cannot be written, and whoever needs them
      ends up creating a view for each case or exporting to a spreadsheet. And a filter that keeps applying a deleted
      property hides rows for a reason that no longer appears anywhere.
    scenarios:
      - title: Two ways to pass
        given: A filter whose root group asks for any of its two groups
        when: A row meets only the second group
        then: The row passes the filter
      - title: A property that is no longer there
        given: A filter with a condition on a property that was removed
        when: The view is looked at
        then: That condition is neither applied nor drawn, and the rest of the filter remains valid
  - id: BR-f7880be
    status: active
    title: A filter's date can move with the day it is looked at
    rule: >-
      A date filter (also on the creation date and the last edit date) can compare with an exact day or with a relative date
      that is resolved every time it is queried, in the calendar of whoever is looking. The relative dates are today,
      yesterday, tomorrow, this week, last week, next week, this month, last month, next month, the last N days and the next
      N days. Weeks run from Monday to Sunday, and the last and next N days include today. "Overdue" is "is before" today,
      and "is the day or before" and "is the day or after" keep the day itself. A date with a range matches when it
      overlaps the requested days, and "before" looks at where the range ends and "after" at where it starts. A date
      without a time is compared by days and one with a time by instants, so a block created late in the afternoon falls on
      the day of whoever is looking and a due date stays on its calendar day wherever the person is.
    why: >-
      A "what is due this week" view saved with exact days goes stale the next day. And a person's day in Santiago is not
      the day in UTC, so always comparing in UTC makes today's things seem like tomorrow's or yesterday's at certain hours.
    context: >-
      Whoever is looking states their time zone and, if they do not, UTC is used. A date marker that does not exist is
      rejected when saving the view and when querying, with a message, and is not compared as text.
    scenarios:
      - title: The week changes earlier in one place than in another
        given: It is Sunday night in Santiago and already Monday in UTC
        when: Two people look at the same "this week" view
        then: Whoever is in Santiago sees the week that ends today and whoever is in UTC sees the one that starts today
  - id: BR-f94b138
    status: active
    title: A collection's shape is changed after creating it
    rule: >-
      An already created collection can be reconfigured: adding properties of any of the existing types, renaming them,
      removing them, marking them as required, setting what each type needs (a number's format, a unique identifier's
      prefix, which collection a relation points to, whether a person admits several) and deciding which options a list
      property offers and what color each one is. None of that travels until it is saved, so a collection is never left in
      a half-way shape. The title property cannot be removed, because it is the one that opens each row. A property keeps
      its type when what it stores would not fit in another: a status, a relation, files, the unique identifier and the
      creation and edit data do not change type nor are converted from another. Only whoever can write the page sees where
      to enter.
    why: >-
      A collection whose shape is decided the day it is born forces knowing in advance what will be needed, which is
      precisely what nobody knows at the start. And changing midway the type of what stores option, row or file ids would
      leave rows with values that the property no longer knows how to read.
    context: >-
      What the rows had already written is not touched: values live in each row, not in the shape. Renaming a property or an
      option, or changing an option's color, does not move any row. Between the types text, number, date, person, checkbox
      and select it can be changed, and what does not fit the new type has to be answered again.
    supersedes: BR-37f128e
    scenarios:
      - title: A status is not converted into something else
        given: A status property with rows in different groups
        when: Someone tries to change its type to select
        then: The type is not offered, because the rows' values are identifiers of the status's options
  - id: BR-fb3c415
    status: active
    title: A collection has a cap on properties and views, whoever asks for it
    rule: >-
      A collection's shape has caps: how many properties it can define and how many views it can have. The caps are applied
      by the server and not only by the screen, so a request built outside the portal is rejected just like an attempt made
      from the interface.
    why: >-
      The screen's caps protect whoever uses the screen. Whoever sends a thousand properties at once does not do it from
      there, and a collection with a thousand properties is not drawn, is not filtered and is not exported: it stops being
      usable for everyone who shares the space, not just for whoever sent it.
    scenarios:
      - title: A shape within the caps
        given: A request with fewer properties and views than the cap
        when: It is sent
        then: The shape is saved
      - title: A shape over the cap
        given: A request with more properties than the cap, built outside the portal
        when: It is sent
        then: It is rejected as invalid and the collection stays as it was
  - id: BR-12b587f
    status: superseded
    title: Each option of a property carries its name and its color
    rule: >-
      A select property, single or multiple, defines its options, and each option is a name and a color. The color is
      optional: an option without a color is shown the same as the others, with the neutral background. The colors are a
      closed, named set, not a free value, so that the same option looks the same in the table, in a board's column and on
      any screen that shows it. A color that the product does not know is discarded when read, and the option is left
      without a color instead of breaking the page.
    why: >-
      On a board, the column is a value of the property it is grouped by. Without color, all the columns look the same and
      one has to read each header to know where one is. Color is what makes a board readable at a glance. And making it a
      closed set prevents each person from writing a different color for the same thing.
    context: >-
      Options are stored as objects with a name and a color. Collections created earlier stored them as a list of names, and
      those are still read: they arrive without color. Color is never the only signal of anything, because the option's name
      is always shown next to it.
    superseded_by: BR-5bd97c6
    scenarios:
      - title: An option with color
        given: A select property with the option "hecho" in green
        when: A row that has it is looked at
        then: The option is shown with its name on a green background
      - title: An option without color
        given: A property whose options have no color
        when: A row is looked at
        then: The option is shown with the neutral background, without losing its name
      - title: A collection written earlier
        given: A collection whose options were stored as a list of names
        when: It is opened
        then: The options are read the same, and are shown without color
      - title: A color that does not exist
        given: An option stored with a color that the product does not know
        when: It is read
        then: The option is shown without color, and the page opens anyway
  - id: BR-22dc232
    status: superseded
    title: Changing a view does not overwrite what another person changed in the meantime
    rule: >-
      Saving a view's configuration sends what the collection says at that moment, not what it said when the configuration
      screen was opened. If between one and the other someone changed the grouping, setting a filter keeps that grouping
      instead of returning it to how it was. The same applies when renaming or removing a property's option: the option is
      named by its identifier, and if it was already removed by another person the change is not applied and it is said
      that the option already moved, instead of writing over it. Renaming can no longer clash with another rename, because
      the name is not the option's address.
    why: >-
      The configuration opens at the side and stays open while the rows keep living alongside. Sending what was read when
      opening it silently erases the work of whoever touched the same view in the meantime, and nobody finds out until
      something that had been configured is missing.
    context: A status cannot be left without an option in one of its groups, so removing the last one of a group is rejected.
    supersedes: BR-699e037
    superseded_by: BR-81880e6
    scenarios:
      - title: Removing an already removed option
        given: Two people with the same option open
        when: Both remove it
        then: The second receives that the option already moved and nothing is written
  - id: BR-37f128e
    status: superseded
    title: A collection's shape is changed after creating it
    rule: >-
      An already created collection can be reconfigured: adding properties of whatever type is wanted, renaming them,
      removing them, and deciding which options a select offers and what color each one is. None of that travels until it is
