id: FEA-BLQ
name: Bloques de página
purpose: Define qué puede sostener una página y cómo se comporta cada tipo de bloque al escribirlo, mostrarlo y guardarlo.
scope: pages
rules:
  - id: BR-01743a9
    status: active
    title: Dónde se para un bloque en la columna
    rule: >-
      Un bloque que no es escritura puede pararse a la izquierda, al centro, a la derecha o a lo ancho de la columna, y
      esa elección se guarda con la página.
    why: >-
      La misma página mezcla lectura y material de apoyo; poder correr una imagen o un reproductor a un lado es lo que
      permite que el texto siga leyéndose.
    context: >-
      Elegir a lo ancho es pararse a la izquierda ocupando toda la columna, de modo que estrecharlo después no lo hace
      saltar de lado. La opción se ofrece solo a bloques que pueden moverse; una línea de archivo no tiene dónde ir.
  - id: BR-0322257
    status: active
    title: Una página nombrada en la escritura se llama como se llama hoy
    rule: >-
      Nombrar una página ya escrita guarda qué página es, no cómo se llama: el nombre se lee de la página cada vez que
      se muestra, y delante lleva la marca de una página. Vive dentro de la frase, mientras que una página empezada aquí
      ocupa su propia línea.
    why: >-
      Un nombre copiado envejece, y un enlace que anuncia un nombre viejo manda a la gente a algo que cree conocer.
      Además, quien lee tiene que poder distinguir de un vistazo lo que cuelga de esta página de lo que solo se está
      mencionando.
    context: >-
      Se busca por título desde `@` o desde el menú `/`, que son la misma búsqueda. El nombre escrito al insertarlo
      queda de respaldo para una página que no se pueda leer desde aquí, como la de otro espacio.
  - id: BR-061d307
    status: active
    title: Una tabla se recorre y crece mientras se llena
    rule: >-
      Una tabla nace con encabezado y con el cursor en su primera celda, se recorre celda por celda con la tecla de
      tabulación y agrega una fila al llegar al final. El encabezado es siempre la primera fila. Una tabla más ancha que
      la página se desplaza dentro de su propia caja sin arrastrar la página.
    why: Una tabla se pide para llenarla, y detenerse a agregar filas con el ratón rompe ese ritmo.
  - id: BR-0736884
    status: active
    title: Escribir marcas conocidas crea el bloque correspondiente
    rule: >-
      Escribir las marcas de siempre al principio de una línea crea el bloque que representan, como almohadillas para un
      encabezado, un guion para una lista, corchetes para una tarea, un signo mayor para una cita, tres guiones para un
      separador y tres acentos graves para un bloque de código.
    why: >-
      Quien viene de escribir en texto plano ya conoce estas marcas, y tener que ir al menú por cada bloque interrumpe
      la escritura.
  - id: BR-09d3e17
    status: active
    title: Un bloque de código dice en qué está escrito y se lleva entero
    rule: >-
      Un bloque de código guarda en qué lenguaje está escrito, permite copiarlo entero, ajustar las líneas largas para
      que no se corten, y sangrar con la tecla de tabulación sin sacar el foco de la página.
    why: >-
      El código se consulta para copiarlo y para leerlo; si tabular saca el foco o las líneas se cortan, deja de poder
      trabajarse ahí.
  - id: BR-2c31f48
    status: active
    title: Una tarea nace sin marcar y solo se tacha a sí misma
    rule: >-
      Al terminar una tarea y seguir escribiendo nace otra tarea, siempre sin marcar. Marcar una tarea la tacha solo a
      ella, nunca a las que cuelgan de ella.
    why: >-
      Una lista de pendientes se escribe de corrido, y dar por hechas las subtareas porque se marcó la de arriba es dar
      por hecho trabajo que nadie hizo.
  - id: BR-2dee8f4
    status: active
    title: Tamaño de un bloque que no es escritura
    rule: >-
      Un bloque que no es escritura —imagen, video, grabación, documento o contenido incrustado— guarda cuánto ocupa
      como proporción de la columna de escritura, no en píxeles, y se ajusta arrastrando su borde derecho.
    why: >-
      Una medida en píxeles es una medida en una sola pantalla; la misma página se lee en un monitor ancho y en un
      teléfono.
    context: >-
      Un bloque que nadie ha medido ocupa la columna entera, salvo el video, que no se agranda más allá de la resolución
      del archivo.
  - id: BR-47933f7
    status: active
    title: Un aviso dice de qué clase es, no qué dibujo lleva
    rule: >-
      Un bloque destacado guarda de qué clase de aviso se trata, como idea, información, advertencia, listo, bloqueado o
      fijado, y no el símbolo con que se dibuja.
    why: >-
      La página dice lo mismo para todos los que la leen, y cada quien ve el dibujo que le toque según la interfaz de su
      momento.
  - id: BR-4efd88a
    status: active
    title: Cada control de un bloque dice qué hace y confirma
    rule: >-
      Cada botón de un bloque dice qué hace tanto a quien lo ve como a quien no puede verlo, y las acciones que no dejan
      rastro visible confirman que ocurrieron.
    why: >-
      Un dibujo en un botón no explica nada hasta que alguien ya lo aprendió, y copiar algo sin señal alguna deja a la
      persona sin saber si funcionó.
    context: >-
      Copiar el texto de un bloque avisa que se copió. Descargar entrega el archivo. Ver a pantalla completa se puede
      deshacer con la misma tecla de siempre.
  - id: BR-5a00e66
    status: active
    title: Las listas se anidan y se distinguen por nivel
    rule: >-
      Un punto de una lista puede colgar del punto de arriba, y cada nivel se distingue por su propia marca. Una lista
      numerada respeta el número donde se le dijo empezar y renumera sola al intercalar un punto.
    why: La jerarquía de una lista se lee por la marca; si todos los niveles se ven igual, la lista deja de decir nada.
  - id: BR-5f3a4aa
    status: active
    title: Un diagrama se escribe como texto y se dibuja
    rule: >-
      Un diagrama se escribe como texto en la página y se dibuja a partir de él. El bloque puede mostrar solo el dibujo,
      solo el texto o ambos, y la elección se guarda con la página.
    why: >-
      Lo que se guarda es el texto, de modo que un diagrama siempre se puede volver a editar, buscar y conservar aunque
      cambie la forma de dibujarlo.
    context: >-
      El dibujo se rehace cuando la escritura se detiene, no en cada tecla, para no parpadear mientras alguien escribe.
      El dibujo no se guarda, se deriva del texto.
    scenarios:
      - title: Sintaxis incorrecta
        given: Un diagrama a medio escribir o mal escrito
        when: La página intenta dibujarlo
        then: El bloque explica qué falló y en qué línea, conserva el texto y el resto de la página sigue funcionando
  - id: BR-66a1e2d
    status: active
    title: Un bloque solo se coloca donde la página puede guardarlo
    rule: >-
      Un bloque se coloca únicamente donde la página admite tenerlo. Si el sitio elegido no lo admite, sube hasta el
      lugar más cercano que sí lo acepte.
    why: >-
      La escritura permite más combinaciones de las que una página puede guardar, y un bloque puesto donde no cabe solo
      se descubre cuando la página deja de guardarse.
    context: Por ejemplo, una cita sostiene escritura pero no un video; el video queda entonces debajo de la cita.
  - id: BR-6f1d15d
    status: active
    title: Las estampas de un diagrama viajan con la pagina
    rule: >-
      Las estampas que un diagrama puede nombrar viajan con la pagina. Dibujar un diagrama nunca es una peticion a un
      servidor ajeno, ni siquiera para traer un dibujito.
    why: >-
      Una pagina que se dibuja delante de quien la lee no debe contarle a un tercero quien la esta leyendo, y una pagina
      interna tiene que poder leerse igual sin salida a internet.
  - id: BR-705d16a
    status: active
    title: Un diagrama puede fijar su propio aspecto
    rule: >-
      Un diagrama puede fijar en su propio texto el aspecto con que quiere dibujarse, y la pagina lo respeta en lugar de
      imponerle el suyo.
    why: >-
      Quien escribe un diagrama sabe con que colores se entiende lo que esta explicando, y un diagrama es material de
      lectura antes que decoracion de la interfaz.
    context: >-
      El costo aceptado es que ese diagrama se ve igual de dia y de noche. Un diagrama que no dice nada al respecto si
      sigue el modo en que se esta leyendo la pagina.
  - id: BR-744f3ec
    status: active
    title: El índice al costado acompaña a quien lee la página
    rule: >-
      Toda página muestra sus encabezados en un índice al costado, sin que nadie tenga que insertarlo, y marca el
      encabezado que se está leyendo. Aparece solo donde hay ancho de sobra; en pantalla angosta la página se queda con
      todo el ancho.
    why: >-
      Saber dónde está uno en una página larga es cosa de quien la lee, no de quien la escribió; pedirle al autor que
      inserte un bloque para que los demás puedan orientarse deja sin índice justo a las páginas que más lo necesitan.
    context: >-
      Convive con el bloque de índice, que sigue siendo del autor: ese ocupa una línea de la página, se guarda con ella
      y se ve en cualquier pantalla. El del costado no se guarda en ninguna parte.
    scenarios:
      - title: Página sin encabezados
        given: Una página que no tiene encabezados
        when: Alguien la abre en una pantalla ancha
        then: No se muestra ningún índice al costado, y la página conserva todo el ancho
  - id: BR-77de182
    status: active
    title: Cómo se muestra un archivo lo decide el bloque
    rule: >-
      Cada bloque de archivo dice si se muestra como documento leído en la página o como una línea con su nombre, tipo y
      peso. La opción solo se ofrece cuando puede cumplirse.
    why: >-
      El mismo documento es material de lectura en una página y algo que se guarda en otra, y ofrecer una forma que el
      sistema no puede dibujar es un menú que no hace nada.
    context: Un archivo que la página no sabe dibujar se muestra siempre como línea, y no se le ofrece la elección.
  - id: BR-85d65ab
    status: active
    title: Un encabezado pliega lo que sostiene
    rule: >-
      Un encabezado puede plegarse para ocultar todo lo que va debajo de él hasta el siguiente encabezado del mismo
      nivel, y ese estado se guarda con la página.
    why: >-
      Una página larga se recorre plegando lo que no se está mirando; si el plegado se pierde al recargar, no sirve de
      nada.
    context: >-
      Lo plegado sigue en la página, solo queda fuera de la vista, y un encabezado plegado lo dice aunque el puntero no
      esté encima.
  - id: BR-921afcd
    status: active
    title: Un enlace que no se puede mostrar se queda como enlace
    rule: >-
      Si una dirección no se puede mostrar dentro de la página, o si no se pudo leer nada sobre ella, el bloque se queda
      como enlace y la página lo dice con un aviso.
    why: >-
      Un enlace que desaparece o un marco vacío hacen dudar de si se perdió algo; dejarlo como enlace conserva siempre
      lo que la persona pegó.
    context: >-
      Solo unos pocos servicios pueden mostrarse dentro de la página; el resto de las direcciones son enlaces o
      tarjetas.
  - id: BR-94069a8
    status: active
    title: Una subpágina se nombra donde vive
    rule: >-
      Una página puede tener páginas colgando de ella, puestas en la escritura como la línea que lleva a cada una. El
      bloque guarda qué página es, no cómo se llama: el nombre se lee de la página cada vez que se muestra. Borrar el
      bloque no borra la página.
    why: >-
      Un nombre copiado en la escritura envejece en cuanto alguien renombra la página, y la página termina anunciada con
      un nombre que ya no es el suyo. Y borrar una línea de una página no puede significar tirar a la basura todo lo que
      hay escrito en otra.
    context: >-
      El nombre escrito al insertarla queda de respaldo, para una hija que ya no se puede leer desde aquí. Una subpágina
      ocupa su propia línea, con la marca de una página delante, que es lo que la distingue de un enlace a una página
      que ya existía.
    scenarios:
      - title: La hija cambia de nombre
        given: Una página con una subpágina llamada «Sin título»
        when: Alguien abre la hija y la renombra
        then: La línea en la madre pasa a decir el nombre nuevo
  - id: BR-9577952
    status: active
    title: Un bloque que esta versión no conoce se conserva tal como llegó
    rule: >-
      Una página guarda solo los tipos de bloque que la versión actual conoce, y cualquier bloque desconocido se
      conserva tal como llegó y se dibuja nombrado como algo que la página sostiene pero no sabe mostrar.
    why: >-
      Dos versiones distintas leen la misma página; descartar lo que una no entiende sería borrar el trabajo hecho en la
      otra.
  - id: BR-9961539
    status: active
    title: El menú de un bloque se abre junto al botón que lo abrió
    rule: El menú de un bloque se abre a la altura de los botones que lo abren, no en el borde superior del bloque.
    why: >-
      En un bloque alto, como un video o un documento, el borde superior puede quedar fuera de la pantalla, y el menú
      aparece donde nadie lo está mirando.
  - id: BR-9eaf811
    status: active
    title: Un bloque sincronizado guarda dónde vive, no lo que dice
    rule: >-
      Un bloque puede mostrarse en otra página sin dejar de vivir en la suya: lo que la otra página guarda es qué página
      y qué bloque, y lo que muestra es lo que ese bloque dice ahora. Se escribe donde vive; donde se muestra, se lee.
      Romper la sincronización deja una copia que ya no es de nadie más.
    why: >-
      Copiar la escritura sería tener dos versiones de lo mismo envejeciendo por separado, que es justo lo que un bloque
      sincronizado viene a evitar. Y un mismo bloque editado desde dos lados a la vez es un bloque que en algún momento
      pierde la mitad de lo escrito.
    context: >-
      Donde se muestra va apartado, con su marca y el enlace a donde vive. La copia que queda al romper el vínculo lleva
      la misma escritura pero no quién era el otro bloque ni lo que se comentó sobre él. Un bloque cuya página ya no lo
      tiene lo dice en vez de mostrar un recuadro vacío.
    scenarios:
      - title: El bloque cambia en su página
        given: Una página que muestra un bloque que vive en otra
        when: Alguien corrige ese bloque donde vive
        then: La página que lo muestra dice lo corregido
  - id: BR-a27127f
    status: active
    title: Un bloque que no sostiene nada no se guarda con contenido
    rule: >-
      Los bloques que no sostienen nada dentro, como un separador, una imagen, un reproductor o una tarjeta, se guardan
      sin contenido alguno.
    why: >-
      Escribirles un contenido vacío es una forma que la página rechaza, y el rechazo aparece en medio de una tecla, sin
      que nadie entienda qué hizo mal.
  - id: BR-a87ec49
    status: active
    title: Video y grabación se reproducen en la página
    rule: >-
      Un video o una grabación subidos a una página se reproducen dentro de ella, sin salir a otra pantalla ni
      descargarlos, y con controles propios de la página.
    why: >-
      Lo que se sube a una página se consulta ahí mismo; obligar a bajarlo rompe la lectura y deja copias sueltas fuera
      del espacio de trabajo.
    context: >-
      Los controles son los de la página (reproducir, punto de reproducción, tiempo, silencio y pantalla completa para
      el video) para que se lean igual que el resto de la interfaz. Cada control dice qué hace para quien no puede
      verlo.
    scenarios:
      - title: Video subido a una página
        given: Una persona con permiso de edición y un video en un formato aceptado
        when: Lo sube a la página
        then: El video queda en el punto donde estaba escribiendo y se reproduce ahí mismo
      - title: Salto dentro de una grabación larga
        given: Una grabación ya publicada en la página
        when: Quien la escucha mueve el punto de reproducción
        then: La reproducción continúa desde ese punto sin esperar a que baje la grabación entera
  - id: BR-ab31bcc
    status: active
    title: Un dibujo no le pide nada a nadie
    rule: >-
      Nada de lo que se escribe en un diagrama puede hacer que el navegador de quien lo lee pida algo a un servidor
      ajeno. Las direcciones escritas en un diagrama se quitan antes de dibujarlo y se vuelven a quitar del dibujo
      terminado.
    why: >-
      Un diagrama lo escribe cualquiera que pueda escribir en la pagina y lo mira todo el que la lee. Una direccion
      metida ahi es una peticion que sale una vez por cada lector, y le cuenta a un tercero quien esta leyendo, desde
      donde y cuando.
    context: >-
      Limpiar solo el dibujo terminado llega tarde: para medirlo, el motor lo pone en la pagina un instante, y en ese
      instante ya se pidio. Por eso se limpia lo escrito antes de dibujar.
  - id: BR-b11ee41
    status: active
    title: Una pagina que no se puede guardar lo dice
    rule: >-
      Cuando lo escrito pasa de lo que una pagina acepta —un bloque mas largo de lo permitido, sobre todo— la pagina lo
      dice de inmediato y sigue funcionando. Nunca deja de guardarse en silencio.
    why: >-
      Seguir escribiendo sobre una pagina que dejo de guardarse es perder trabajo sin enterarse, que es la peor forma de
      fallar que tiene un editor.
  - id: BR-bd24008
    status: active
    title: Una formula se escribe y la pagina la compone
    rule: >-
      Una formula se escribe como texto en el lenguaje en que se escriben las formulas, y la pagina la compone a partir
      de ese texto. El bloque puede mostrar solo la formula, solo el texto o ambos, y esa eleccion se guarda con la
      pagina.
    why: >-
      Lo que se guarda es el texto, de modo que una formula se puede buscar, copiar y corregir, y sigue siendo la misma
      formula aunque cambie la forma de componerla.
    context: >-
      Es el mismo bloque que dibuja diagramas, con otro lenguaje. No se ofrece descargarla, porque una formula no es un
      dibujo aparte, y las letras con que se compone viajan con la pagina.
  - id: BR-bfe4bc6
    status: active
    title: Un diagrama se lee al tamaño en que fue dibujado
    rule: >-
      Un diagrama se muestra al tamaño en que fue dibujado. Cuando resulta más ancho que la columna en que se lee, no se
      encoge para caber; es su propia caja la que se desplaza, sin arrastrar la página.
    why: >-
      Un diagrama de varios pasos ajustado al ancho de la columna queda dibujado a una fracción de su tamaño, y deja de
      leerse mucho antes de dejar de caber.
    context: Un dibujo más pequeño que la columna se centra en ella y no se estira para llenarla.
  - id: BR-c189a28
    status: active
    title: Una fila de columnas se arma y se reparte por proporción
    rule: >-
      Una zona de la página se parte en columnas arrastrando un bloque contra el costado de otro, y el mismo gesto
      contra una fila ya armada le agrega una columna más. El ancho de cada columna se guarda como la parte que le toca
      de la fila, nunca en píxeles. La columna que queda sin nada se retira sola.
    why: >-
      Un ancho en píxeles vale solo para la pantalla en que se eligió, y deja la página rota en cualquier otra; una
      parte de la fila significa lo mismo en todas. Una columna vacía es un hueco que nadie escribió a propósito.
    context: >-
      Bajo el ancho en que dos columnas dejan de leerse, se apilan en el orden en que fueron escritas y cada una toma
      todo el ancho; ahí no hay ancho que repartir y la separación no se ofrece.
    scenarios:
      - title: La última pertenencia de una columna se va a otra
        given: Una fila de columnas donde una tiene un solo bloque
        when: Ese bloque se arrastra a otra columna
        then: La columna que quedó sin nada desaparece y la fila sigue con las demás
  - id: BR-c32c578
    status: active
    title: Un dibujo se recorre y se acerca para leerlo
    rule: >-
      Un diagrama que alcanza más allá de su caja se arrastra para recorrerlo, y se acerca o se aleja con la rueda para
      leer lo que quedó demasiado pequeño o ver entero lo que quedó demasiado grande. Llevado a pantalla completa se
      comporta igual, con el dibujo ocupando todo el espacio disponible.
    why: >-
      Un diagrama existe para mirarlo, y uno grande no se entiende ni de una sola mirada ni a través de una ventana del
      ancho de un párrafo.
    context: Tomar un dibujo con el puntero no escribe en la página, así que ese gesto no llega al editor ni mueve el cursor.
  - id: BR-cbe82d0
    status: active
    title: La tarjeta de un enlace guarda lo que se leyó
    rule: >-
      Cuando un enlace se muestra como tarjeta, el título y el ícono se leen una sola vez y quedan guardados con la
      página. No se vuelve a consultar el sitio cada vez que alguien abre la página.
    why: >-
      Una página tiene que leerse igual mañana, y el sitio al que apunta puede estar caído o haber desaparecido. Además,
      una página no debe ir a tocar servidores ajenos cada vez que se la mira.
    context: >-
      La consulta la hace el servidor del sistema y nunca el navegador de quien escribe, solo por conexión segura, y se
      guarda únicamente el nombre del enlace y la marca del sitio. Lo que un sitio dice de sí mismo a un desconocido a
      menudo describe otra cosa, y una tarjeta que cita algo falso es peor que una que no cita nada.
  - id: BR-d3e1e93
    status: active
    title: Los dibujos siguen el modo de lectura de la interfaz
    rule: >-
      Un diagrama se dibuja con los colores del modo en que se está leyendo la página, claro u oscuro, y se vuelve a
      dibujar solo cuando ese modo cambia.
    why: >-
      Un dibujo dejado en los colores de la noche es ilegible de día, y nadie va a reescribir un diagrama para arreglar
      eso.
  - id: BR-dc609a1
    status: active
    title: Un botón escribe lo que tiene dentro
    rule: >-
      Un botón sostiene los bloques que escribe, escritos dentro de él como se escribe en cualquier parte de la página.
      Al pulsarlo deja una copia de lo que tiene, donde se le haya dicho: debajo de sí mismo, al principio o al final.
      También puede, en vez de escribir, agregar una fila a una colección.
    why: >-
      Un botón que hubiera que llenar por un formulario propio sería el único bloque de la página en el que no se puede
      escribir, y lo que va a escribir no se vería hasta pulsarlo. Y lo que deja es una copia porque el mismo bloque no
      puede estar dos veces en la misma página.
    context: >-
      Sus ajustes están detrás de «Configurar»: una página llena de botones enseñando sus tripas se lee como una
      máquina. La fila que crea se llama como la primera línea que el botón habría escrito, y se le dan a la colección
      los valores por defecto que no queden vacíos. Dónde escribe deja de ofrecerse cuando el botón hace filas.
    scenarios:
      - title: La colección exige un valor a cada fila
        given: Un botón que agrega filas a una colección con propiedades obligatorias
        when: Alguien lo pulsa
        then: La fila se crea con los valores por defecto de esa colección, sin los que quedarían vacíos
  - id: BR-e1147d1
    status: active
    title: Un documento se lee dentro de la página
    rule: >-
      Un documento adjunto se lee dentro de la página, se pasa de página, se ve a pantalla completa y se descarga entero
      con un clic conservando su nombre original.
    why: Un manual o un contrato se consultan mientras se escribe sobre ellos.
  - id: BR-e5e524e
    status: active
    title: La línea escrita bajo una imagen es también lo que se lee en voz alta
    rule: >-
      La única línea que se escribe bajo una imagen es a la vez su leyenda visible y el texto que se lee a quien no
      puede verla.
    why: Pedir la misma frase dos veces es como una página termina con leyenda y sin texto alternativo.
  - id: BR-f1c0b40
    status: active
    title: El índice se lee de la página, no se guarda
    rule: >-
      Una página puede tener un índice de sus encabezados. El índice no guarda la lista: la lee de los encabezados de la
      página cada vez que se muestra y se rehace mientras alguien escribe.
    why: >-
      Guardar la lista sería guardar dos veces lo mismo, y quedaría vieja en cuanto se corrija un título; un índice que
      miente es peor que no tener índice.
    context: >-
      Cada línea del índice lleva al encabezado que nombra y deja el cursor ahí, porque quien llega a un encabezado
      suele querer escribir en él. La jerarquía se muestra con sangría por nivel.
    scenarios:
      - title: Página sin encabezados
        given: Una página que todavía no tiene encabezados
        when: Se inserta el índice
        then: El índice dice que no hay encabezados aún, y se puebla solo al escribir el primero
  - id: BR-f2b2986
    status: active
    title: Una colección es una página con forma, mirada desde donde se la nombra
    rule: >-
      Una colección se crea como una página y su forma se define en el mismo acto. Empieza con lo mínimo: el nombre, que
      es el título de la página que cada fila es, y una columna propia. El bloque que la muestra dentro de otra página
      no guarda sus filas: guarda qué colección es y por qué vista se la mira.
    why: >-
      Una página que iba a ser colección y quedó sin forma no se distingue de una cualquiera, y nadie sabría que quedó a
      medias. Y adivinar columnas es decidir por quien la escribe para qué va a servir.
    context: >-
      La misma colección puede mostrarse en varias páginas y varias veces en una. Mostrar una que vive en otra parte
      pregunta primero si esa página es una colección; si no lo es, se dice en vez de dejar un hueco. Un bloque puede
      cambiar entre mantener la colección a la vista y dejar solo el enlace a su página, sin que la colección se toque.
    scenarios:
      - title: La página elegida no es una colección
        given: Alguien pide mostrar una colección que vive en otra parte
        when: Elige una página que no tiene forma
        then: No se inserta nada y se explica que esa página no es una colección
  - id: BR-f5cb934
    status: active
    title: Insertar un bloque no reemplaza el que estaba
    rule: >-
      Poner algo en una página cuando hay un bloque seleccionado lo coloca debajo de ese bloque, nunca encima. Lo que la
      página ya sostenía no se pierde.
    why: >-
      Un bloque seleccionado es lo que alguien está mirando, no un hueco donde dejar caer lo siguiente. Reemplazarlo
      hace desaparecer trabajo sin aviso.
    scenarios:
      - title: Segundo archivo subido con un bloque elegido
        given: Una página con un documento seleccionado
        when: Se sube otro archivo
        then: El archivo nuevo queda debajo y el documento sigue en la página
  - id: BR-f6955e5
    status: active
    title: Un enlace pegado ofrece tres formas
    rule: >-
      Al pegar una dirección sola, la página la escribe como enlace y ofrece mostrarla como enlace, como tarjeta o
      incrustada dentro de la página. La misma elección sigue disponible después desde el menú del bloque.
    why: >-
      Quien pega un enlace no siempre sabe en ese segundo qué quiere de él, y escribirlo primero como enlace hace que
      seguir escribiendo deje exactamente lo que se pegó.
    context: >-
      Solo se ofrece la elección a direcciones seguras, que son las únicas que la página puede consultar o mostrar
      dentro de sí.
    scenarios:
      - title: Enlace pegado y dejado como estaba
        given: Una dirección pegada en una línea vacía
        when: Quien escribe sigue escribiendo sin elegir nada
        then: La línea queda con el enlace tal como se pegó
  - id: BR-fdb811b
    status: active
    title: Un enlace se escribe como se escribe en todas partes
    rule: >-
      Escribir el nombre entre corchetes seguido de la dirección entre paréntesis deja el nombre enlazado a esa
      dirección, y un enlace entre las palabras se ve como un enlace.
    why: >-
      Es la forma en que la gente ya escribe enlaces a mano en otras herramientas, y un enlace que no se distingue del
      texto no invita a seguirlo.
