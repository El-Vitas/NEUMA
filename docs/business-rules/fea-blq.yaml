id: FEA-BLQ
name: Page blocks
purpose: Defines what a page can hold and how each type of block behaves when written, displayed and saved.
scope: pages
rules:
  - id: BR-01743a9
    status: active
    title: Where a block stands in the column
    rule: >-
      A block that is not writing can stand on the left, in the center, on the right or across the full width of the
      column, and that choice is saved with the page.
    why: >-
      The same page mixes reading and supporting material; being able to move an image or a player to one side is what
      lets the text keep being read.
    context: >-
      Choosing full width means standing on the left while taking up the whole column, so narrowing it later does not
      make it jump sideways. The option is offered only to blocks that can move; a file line has nowhere to go.
  - id: BR-0322257
    status: active
    title: A page named in the writing is called what it is called today
    rule: >-
      Naming an already written page saves which page it is, not what it is called: the name is read from the page every
      time it is shown, and it carries a page mark in front. It lives inside the sentence, whereas a page started here
      takes up its own line.
    why: >-
      A copied name ages, and a link that announces an old name sends people to something they think they know.
      Furthermore, whoever reads has to be able to tell at a glance what hangs from this page from what is only being
      mentioned.
    context: >-
      It is searched by title from `@` or from the `/` menu, which are the same search. The name written at insertion
      stays as a fallback for a page that cannot be read from here, such as one in another space.
  - id: BR-061d307
    status: active
    title: A table is traversed and grows as it is filled
    rule: >-
      A table is born with a header and with the cursor in its first cell, is traversed cell by cell with the tab key and
      adds a row on reaching the end. The header is always the first row. A table wider than the page scrolls inside its
      own box without dragging the page.
    why: A table is requested in order to fill it, and stopping to add rows with the mouse breaks that rhythm.
  - id: BR-0736884
    status: active
    title: Typing known marks creates the corresponding block
    rule: >-
      Typing the usual marks at the start of a line creates the block they represent, such as hash signs for a heading, a
      hyphen for a list, brackets for a task, a greater-than sign for a quote, three hyphens for a separator and three
      backticks for a code block.
    why: >-
      Whoever comes from writing in plain text already knows these marks, and having to go to the menu for each block
      interrupts the writing.
  - id: BR-09d3e17
    status: active
    title: A code block says what it is written in and is taken whole
    rule: >-
      A code block stores which language it is written in, allows copying it whole, wrapping long lines so they are not
      cut off, and indenting with the tab key without taking the focus out of the page.
    why: >-
      Code is consulted to be copied and to be read; if tabbing takes the focus away or lines are cut off, it can no
      longer be worked on there.
  - id: BR-2693dd5
    status: active
    title: A link to this app does not reload the browser
    rule: Following a link that points to a page of this app takes you to it without reloading the entire page.
    why: >-
      A full reload to reach another page of the same space throws away everything the browser already had and makes
      people wait for something that was already there.
  - id: BR-29a76e9
    status: active
    title: Naming a page that does not exist offers to create it
    rule: >-
      When what is typed after `@` matches no page, the search offers to create one with that name. The page is created
      hanging from the one where it was typed and is mentioned at the same point in the text.
    why: >-
      Naming a page that does not exist yet is how a page usually begins: the thought comes first. Answering "I found
      nothing" forces leaving the sentence, creating the page elsewhere and coming back.
    context: The page where it is typed has to be created before another can be hung from it.
  - id: BR-2a30ebb
    status: active
    title: A formula that cannot be drawn is shown as it was written
    rule: >-
      An inline formula is drawn next to the text without altering the line height. If it cannot be drawn, exactly what
      was written is shown, saying why, instead of leaving a gap or breaking the page.
    why: >-
      What is written belongs to whoever wrote it: losing it because a library does not understand it is worse than
      showing it as is and explaining it.
  - id: BR-2c31f48
    status: active
    title: A task is born unchecked and only strikes itself through
    rule: >-
      When finishing a task and continuing to write, another task is born, always unchecked. Checking a task strikes
      through only it, never the ones that hang from it.
    why: >-
      A to-do list is written in one go, and treating the subtasks as done because the one above was checked is taking
      for granted work nobody did.
  - id: BR-2dee8f4
    status: active
    title: Size of a block that is not writing
    rule: >-
      A block that is not writing —image, video, recording, document or embedded content— stores how much space it takes
      up as a proportion of the writing column, not in pixels, and is adjusted by dragging its right edge.
    why: >-
      A measurement in pixels is a measurement on a single screen; the same page is read on a wide monitor and on a
      phone.
    context: >-
      A block nobody has measured takes up the entire column, except video, which does not grow beyond the file's
      resolution.
  - id: BR-357e60a
    status: active
    title: Searching in the page opens what the match hides
    rule: >-
      Searching within a page highlights all the matches, says how many there are and which one you are on, and on
      reaching one that is inside a folded heading or a closed toggle it opens it. Only what hides that match is opened,
      not the other folds of the page. Searching and jumping from one match to another does not enter the undo history;
      replacing does.
    why: >-
      A match that cannot be seen is not a match found. And opening the neighboring folds along the way undoes an order
      the reader had chosen. Undoing right after searching must give back the last sentence written, not the search.
  - id: BR-39b1413
    status: active
    title: The formatting bar belongs to the moment of choosing
    rule: >-
      The bar that appears over selected text goes away as soon as the reader no longer has that writing in hand: when
      the selection collapses, when clicking on another field or when going to another part of the page. It does not go
      away because focus has entered a menu that the bar itself opened, nor because the whole window was left.
    why: >-
      The editor keeps the selection when it loses focus, in order to restore it on return, but a bar floating over text
      that nobody has selected anymore offers nothing: it only covers the writing and gets in the way, especially for
      whoever moves with the keyboard arrows.
  - id: BR-400b88c
    status: active
    title: The page does not claim what it does not know about a person
    rule: >-
      Hovering over a named person shows their name and, when the data is at hand, the address they can be reached at.
      When nothing more is known, only the name is shown: it is never said that the person is no longer there.
    why: >-
      With what the editor has there is no way to tell "this person left" from "nobody loaded the list", and saying the
      former is asserting something false about someone who is there.
  - id: BR-41e9452
    status: active
    title: The frame of a diagram belongs to the page and the zoom belongs to whoever looks
    rule: >-
      A diagram is shown in a frame that does not exceed the height of the screen, and if the diagram is smaller, the
      frame fits it. Whoever edits the page can enlarge or shrink the frame, and that height is saved in the page, so
      everyone sees the diagram in the same frame. Zooming in, zooming out, fitting the diagram to the frame and viewing
      it at real size belong to each person looking and are not saved. A diagram larger than its frame opens fitted to
      it, and when viewed full screen it fits the screen.
    why: >-
      A frame as tall as the diagram pushes the page off the screen even though the diagram still is not fully visible.
      Separating the frame, which is part of the page, from the zoom, which belongs to whoever reads, lets each person
      navigate the diagram without changing it for the others.
    context: >-
      The frame is adjusted by dragging its bottom edge or with the keyboard arrows, and double-clicking returns it to
      automatic size. It has a minimum and a maximum height. The text inside a diagram is never cut off inside its box.
    scenarios:
      - title: Adjusting the frame
        given: A large diagram on a page
        when: A person enlarges its frame
        then: Everyone who opens the page sees it in the enlarged frame
      - title: Zooming in on the diagram
        given: Two people looking at the same diagram
        when: One zooms in on it
        then: Only what that person sees changes
  - id: BR-42fc687
    status: active
    title: The day is counted in the time zone of whoever reads
    rule: >-
      Today, tomorrow and yesterday are calculated on the local day of whoever writes, never by adding hours in UTC, and
      a date is always shown in the format and language of whoever reads.
    why: >-
      At ten at night in Santiago it is already the next day in UTC, so "today" would write tomorrow and "tomorrow" the
      day after. A day is the calendar day of whoever names it.
  - id: BR-47933f7
    status: active
    title: A callout says what kind it is, not what drawing it carries
    rule: >-
      A highlighted block stores what kind of notice it is, such as idea, information, warning, done, blocked or pinned,
      and not the symbol it is drawn with.
    why: >-
      The page says the same thing to everyone who reads it, and each person sees whichever drawing corresponds to them
      according to the interface of the moment.
  - id: BR-4e634dd
    status: active
    title: A named page is followed like a link
    rule: >-
      Clicking on a page named in the middle of a sentence takes you to that page without reloading the entire browser,
      just like a link to a page of this app.
    why: >-
      For whoever reads they are the same thing —something written that leads to another page—, and one reloading and the
      other not is a difference that exists only because of how each one is drawn.
  - id: BR-4efd88a
    status: active
    title: Each control of a block says what it does and confirms
    rule: >-
      Each button of a block says what it does both to whoever sees it and to whoever cannot see it, and actions that
      leave no visible trace confirm that they happened.
    why: >-
      A drawing on a button explains nothing until someone has already learned it, and copying something with no signal
      at all leaves the person not knowing whether it worked.
    context: >-
      Copying a block's text announces that it was copied. Downloading delivers the file. Viewing full screen can be
      undone with the same key as always.
  - id: BR-5a00e66
    status: active
    title: Lists nest and are distinguished by level
    rule: >-
      A list item can hang from the item above, and each level is distinguished by its own mark. A numbered list respects
      the number where it was told to start and renumbers itself when an item is inserted.
    why: A list's hierarchy is read from the mark; if all levels look the same, the list stops saying anything.
  - id: BR-5f3a4aa
    status: active
    title: A diagram is written as text and drawn
    rule: >-
      A diagram is written as text on the page and drawn from it. The block can show only the drawing, only the text or
      both, and the choice is saved with the page.
    why: >-
      What is saved is the text, so a diagram can always be edited, searched and preserved again even if the way of
      drawing it changes.
    context: >-
      The drawing is redone when the writing pauses, not on every key, to avoid flickering while someone types. The
      drawing is not saved, it is derived from the text.
    scenarios:
      - title: Incorrect syntax
        given: A diagram half written or badly written
        when: The page tries to draw it
        then: The block explains what failed and on which line, keeps the text and the rest of the page keeps working
  - id: BR-66a1e2d
    status: active
    title: A block is only placed where the page can store it
    rule: >-
      A block is placed only where the page allows having it. If the chosen spot does not allow it, it moves up to the
      nearest place that does accept it.
    why: >-
      The writing allows more combinations than a page can store, and a block placed where it does not fit is only
      discovered when the page stops saving.
    context: For example, a quote holds writing but not a video; the video then ends up below the quote.
  - id: BR-6dd8d27
    status: active
    title: Every block has an id that it shares with no other
    rule: >-
      Each block, including each page, has an id that it shares with no other block in the whole database. It receives it
      when written, whether a person writes it in the editor, the API or an agent, and keeps it as long as it exists,
      also when moved to another page or to another space. Duplicating a page gives new ids to the entire copy, and the
      references that pointed inside the copied branch now point to the copy. A change that brings the id of a block that
      lives on another page does not touch it; the written block receives a new id.
    why: >-
      A block is reached through its id. The link that is copied, the search that finds it and the agent that cites it
      point to it and not to the whole page. Two blocks with the same id are a link that nobody knows where it leads.
    supersedes: BR-1557ee4
    scenarios:
      - title: Duplicating a page with an internal mention
        given: A page with a subpage that mentions it
        when: The page is duplicated with its descendants
        then: The copy and its subpage have new ids, and the mention in the copied subpage points to the copy
      - title: Moving a block to another page
        given: A block linked from another page
        when: It is moved to a third page
        then: It keeps its id and the link still leads to it
  - id: BR-6f1d15d
    status: active
    title: A diagram's stamps travel with the page
    rule: >-
      The stamps that a diagram can name travel with the page. Drawing a diagram is never a request to an outside server,
      not even to fetch a little picture.
    why: >-
      A page that is drawn in front of whoever reads it must not tell a third party who is reading it, and an internal
      page has to be readable just the same without access to the internet.
  - id: BR-705d16a
    status: active
    title: A diagram can set its own appearance
    rule: >-
      A diagram can set in its own text the appearance it wants to be drawn with, and the page respects it instead of
      imposing its own.
    why: >-
      Whoever writes a diagram knows which colors make what they are explaining understandable, and a diagram is reading
      material before it is interface decoration.
    context: >-
      The accepted cost is that this diagram looks the same by day and by night. A diagram that says nothing about it does
      follow the mode in which the page is being read.
  - id: BR-744f3ec
    status: active
    title: The side index accompanies whoever reads the page
    rule: >-
      Every page shows its headings in an index at the side, without anyone having to insert it, and marks the heading
      being read. It appears only where there is plenty of width; on a narrow screen the page keeps the full width.
    why: >-
      Knowing where you are on a long page is a matter for whoever reads it, not for whoever wrote it; asking the author
      to insert a block so that others can orient themselves leaves without an index precisely the pages that most need
      one.
    context: >-
      It coexists with the index block, which remains the author's: that one takes up a line of the page, is saved with it
      and is seen on any screen. The side one is not saved anywhere.
    scenarios:
      - title: Page without headings
        given: A page that has no headings
        when: Someone opens it on a wide screen
        then: No side index is shown, and the page keeps the full width
  - id: BR-77de182
    status: active
    title: How a file is shown is decided by the block
    rule: >-
      Each file block says whether it is shown as a document read on the page or as a line with its name, type and
      weight. The option is only offered when it can be fulfilled.
    why: >-
      The same document is reading material on one page and something to be saved on another, and offering a form that the
      system cannot draw is a menu that does nothing.
    context: A file that the page does not know how to draw is always shown as a line, and the choice is not offered.
  - id: BR-7a7269d
    status: active
    title: An already written link is reached without following it
    rule: >-
      Resting the pointer on a link brings up a bubble that shows where it goes and offers the only two things that can be
      done to it: change its destination or stop being a link. While the bubble is in view, the formatting bar is not
      shown over the same words.
    why: >-
      Placing the cursor inside a link is also the way to follow it, so resting on top of it is all that is left for
      asking it something. Two things floating over the same words cover each other.
  - id: BR-85d65ab
    status: active
    title: A heading folds what it holds
    rule: >-
      A heading can be folded to hide everything below it up to the next heading of the same level, and that state is
      saved with the page.
    why: >-
      A long page is traversed by folding what is not being looked at; if the folding is lost on reload, it is of no use.
    context: >-
      What is folded is still on the page, it is only out of view, and a folded heading says so even when the pointer is
      not over it.
  - id: BR-8609c2e
    status: active
    title: Inline color uses the same bounded palette
    rule: >-
      The text color and the background color can be applied to what is selected, not only to the entire block, and are
      chosen from the same bounded palette that blocks use, with the option to remove it and go back to the default.
      There is no free color picker.
    why: >-
      Whoever selects four words and looks for a color wants those four; painting the entire block would paint what they
      did not choose. A bounded palette is what guarantees that each color reads well by day and by night and that
      nothing becomes illegible on the page's paper.
  - id: BR-921afcd
    status: active
    title: A link that cannot be shown stays as a link
    rule: >-
      If an address cannot be shown inside the page, or if nothing could be read about it, the block stays as a link and
      the page says so with a notice.
    why: >-
      A link that disappears or an empty frame make people doubt whether something was lost; leaving it as a link always
      preserves what the person pasted.
    context: >-
      Only a few services can be shown inside the page; the rest of the addresses are links or cards.
  - id: BR-94069a8
    status: active
    title: A subpage is named where it lives
    rule: >-
      A page can have pages hanging from it, placed in the writing as the line that leads to each one. The block stores
      which page it is, not what it is called: the name is read from the page every time it is shown. Deleting the block
      does not delete the page.
    why: >-
      A name copied into the writing ages as soon as someone renames the page, and the page ends up announced with a name
      that is no longer its own. And deleting a line from one page cannot mean throwing away everything written on
      another.
    context: >-
      The name written at insertion stays as a fallback, for a child that can no longer be read from here. A subpage takes
      up its own line, with a page mark in front, which is what distinguishes it from a link to a page that already
      existed.
    scenarios:
      - title: The child is renamed
        given: A page with a subpage called "Untitled"
        when: Someone opens the child and renames it
        then: The line in the parent changes to the new name
  - id: BR-9577952
    status: active
    title: A block this version does not know is kept as it arrived
    rule: >-
      A page stores only the block types that the current version knows, and any unknown block is kept as it arrived and
      is drawn named as something the page holds but does not know how to show.
    why: >-
      Two different versions read the same page; discarding what one does not understand would be erasing the work done
      in the other.
  - id: BR-9961539
    status: active
    title: A block's menu opens next to the button that opened it
    rule: A block's menu opens at the height of the buttons that open it, not at the top edge of the block.
    why: >-
      In a tall block, such as a video or a document, the top edge can be off screen, and the menu appears where nobody is
      looking.
  - id: BR-9eaf811
    status: active
    title: A synced block stores where it lives, not what it says
    rule: >-
      A block can be shown on another page without ceasing to live on its own: what the other page stores is which page
      and which block, and what it shows is what that block says now. It is written where it lives; where it is shown, it
      is read. Breaking the sync leaves a copy that no longer belongs to anyone else.
    why: >-
      Copying the writing would mean having two versions of the same thing aging separately, which is exactly what a
      synced block is meant to avoid. And the same block edited from two sides at once is a block that at some point loses
      half of what was written.
    context: >-
      Where it is shown it is set apart, with its mark and the link to where it lives. The copy left when the link is
      broken carries the same writing but not who the other block was nor what was commented on it. A block whose page no
      longer has it says so instead of showing an empty box.
    scenarios:
      - title: The block changes on its page
        given: A page that shows a block that lives on another
        when: Someone corrects that block where it lives
        then: The page that shows it says what was corrected
  - id: BR-a27127f
    status: active
    title: A block that holds nothing is not saved with content
    rule: >-
      Blocks that hold nothing inside, such as a separator, an image, a player or a card, are saved without any content.
    why: >-
      Writing empty content into them is a shape the page rejects, and the rejection appears in the middle of a keystroke,
      without anyone understanding what they did wrong.
  - id: BR-a75d589
    status: active
    title: The page says how its saving is going, in a single place
    rule: >-
      The page says whether it is saving, what time it finished, or that something is unsaved, and says it in a single
      place, next to the title. If the connection is lost it says so and does not try to save; when it returns, it sends
      what is pending on its own. Closing the tab with something unsaved warns before leaving, and only then. A saving
      error never appears without saying what to do.
    why: >-
      Whoever writes needs to know whether their work is safe, and two indicators saying the same thing in two places give
      not more certainty but less. Trying to save without a connection only produces errors that mean nothing.
  - id: BR-a87ec49
    status: active
    title: Video and recording play on the page
    rule: >-
      A video or a recording uploaded to a page plays inside it, without going to another screen or downloading it, and
      with the page's own controls.
    why: >-
      What is uploaded to a page is consulted right there; forcing a download breaks the reading and leaves loose copies
      outside the workspace.
    context: >-
      The controls are the page's own (play, playback position, time, mute and full screen for video) so they read like
      the rest of the interface. Each control says what it does to whoever cannot see it.
    scenarios:
      - title: Video uploaded to a page
        given: A person with edit permission and a video in an accepted format
        when: They upload it to the page
        then: The video ends up at the point where they were writing and plays right there
      - title: Jump within a long recording
        given: A recording already published on the page
        when: Whoever listens to it moves the playback position
        then: Playback continues from that point without waiting for the whole recording to download
  - id: BR-ab31bcc
    status: active
    title: A drawing asks nothing of anyone
    rule: >-
      Nothing written in a diagram can make the browser of whoever reads it request something from an outside server.
      The addresses written in a diagram are removed before drawing it and removed again from the finished drawing.
    why: >-
      A diagram is written by anyone who can write on the page and viewed by everyone who reads it. An address placed
      there is a request that goes out once per reader, and tells a third party who is reading, from where and when.
    context: >-
      Cleaning only the finished drawing comes too late: to measure it, the engine puts it on the page for an instant, and
      in that instant the request has already been made. That is why what is written is cleaned before drawing.
  - id: BR-b11ee41
    status: active
    title: A page that cannot be saved says so
    rule: >-
      When what is written exceeds what a page accepts —a block longer than allowed, above all— the page says so
      immediately and keeps working. It never stops saving silently.
    why: >-
      Continuing to write on a page that stopped saving is losing work without finding out, which is the worst way an
      editor can fail.
  - id: BR-bd24008
    status: active
    title: A formula is written and the page typesets it
    rule: >-
      A formula is written as text in the language formulas are written in, and the page typesets it from that text. The
      block can show only the formula, only the text or both, and that choice is saved with the page.
    why: >-
      What is saved is the text, so a formula can be searched, copied and corrected, and remains the same formula even if
      the way of typesetting it changes.
    context: >-
      It is the same block that draws diagrams, with another language. Downloading it is not offered, because a formula is
      not a separate drawing, and the letters it is typeset with travel with the page.
  - id: BR-bfe4bc6
    status: active
    title: A diagram is read at the size it was drawn
    rule: >-
      A diagram is shown at the size it was drawn. When it turns out wider than the column it is read in, it is not
      shrunk to fit; its own box scrolls instead, without dragging the page.
    why: >-
      A multi-step diagram fitted to the width of the column ends up drawn at a fraction of its size, and stops being
      readable long before it stops fitting.
    context: A drawing smaller than the column is centered in it and not stretched to fill it.
  - id: BR-c189a28
    status: active
    title: A row of columns is built and divided by proportion
    rule: >-
      An area of the page is split into columns by dragging a block against the side of another, and the same gesture
      against an already built row adds one more column to it. The width of each column is saved as the share it gets of
      the row, never in pixels. A column left with nothing removes itself.
    why: >-
      A width in pixels is valid only for the screen where it was chosen, and leaves the page broken on any other; a share
      of the row means the same thing on all of them. An empty column is a gap that nobody wrote on purpose.
    context: >-
      Below the width at which two columns stop being readable, they stack in the order they were written and each takes
      the full width; there is no width to distribute there and the separation is not offered.
    scenarios:
      - title: The last belonging of a column goes to another
        given: A row of columns where one has a single block
        when: That block is dragged to another column
        then: The column left with nothing disappears and the row continues with the others
  - id: BR-c32c578
    status: active
    title: A drawing is traversed and zoomed to be read
    rule: >-
      A diagram that reaches beyond its box is dragged to traverse it, and is zoomed in or out with the wheel to read what
      turned out too small or to see whole what turned out too large. Taken to full screen it behaves the same, with the
      drawing taking up all the available space.
    why: >-
      A diagram exists to be looked at, and a large one is understood neither at a single glance nor through a window the
      width of a paragraph.
    context: Grabbing a drawing with the pointer does not write on the page, so that gesture does not reach the editor nor move the cursor.
  - id: BR-c84eff6
    status: active
    title: Typing `@` offers pages, people and days in a single list
    rule: >-
      What is typed after `@` is searched at once among the pages, among the members of that page's space and among the
      named days (today, tomorrow, yesterday), and the answers are ordered by closeness to what was typed, not grouped by
      type. Each one is distinguished by its own icon.
    why: >-
      Whoever types `@ana` is not thinking "I am going to mention a person": they are looking for Ana. Forcing them to
      choose the kind of thing first is asking about the machine instead of answering what was meant.
    context: Only people with access to that page's space appear.
  - id: BR-cbe82d0
    status: active
    title: A link's card stores what was read
    rule: >-
      When a link is shown as a card, the title and the icon are read just once and are stored with the page. The site is
      not queried again every time someone opens the page.
    why: >-
      A page has to read the same tomorrow, and the site it points to may be down or may have disappeared. Furthermore, a
      page must not go touch outside servers every time it is looked at.
    context: >-
      The query is made by the system's server and never by the browser of whoever writes, only over a secure connection,
      and only the link's name and the site's mark are stored. What a site says about itself to a stranger often describes
      something else, and a card that cites something false is worse than one that cites nothing.
  - id: BR-d3e1e93
    status: active
    title: Drawings follow the interface's reading mode
    rule: >-
      A diagram is drawn with the colors of the mode in which the page is being read, light or dark, and is redrawn only
      when that mode changes.
    why: >-
      A drawing left in night colors is illegible by day, and nobody is going to rewrite a diagram to fix that.
  - id: BR-d8c9964
    status: active
    title: A named date is a word of the sentence
    rule: >-
      A date named in the middle of a text is drawn at the height of the line that surrounds it, just like a named person
      or an inline formula, and the minimum touch target size applies to the surface of the calendar that opens, never to
      the written word.
    why: >-
      The 44-pixel rule exists for controls that a finger has to hit. Applied to a word inside a sentence, it stretches
      that line —from 27 to 44 pixels— and makes the surrounding text jump.
  - id: BR-dc4e430
    status: active
    title: Nothing that depends on the browser is read when drawing the page for the first time
    rule: >-
      The connection state, the window size and anything else that only the browser knows are read after mounting the
      page, never while deciding the first drawing.
    why: >-
      The server and the browser have to draw the same thing the first time. By reading the connection state during the
      first drawing, the server decided it was offline —Node has a `navigator` without `onLine`— and the browser that it
      was online; React redid that piece of the tree and the editor was left attached to a node that was no longer on the
      page, so it was not possible to write anywhere in the application.
    context: It is a cross-cutting rule, even though the case that revealed it was saving.
  - id: BR-dc609a1
    status: active
    title: A button writes what it has inside
    rule: >-
      A button holds the blocks it writes, written inside it the way one writes anywhere on the page. When pressed, it
      leaves a copy of what it has, where it was told: below itself, at the start or at the end. Instead of writing, it
      can also add a row to a collection.
    why: >-
      A button that had to be filled in through its own form would be the only block on the page where one cannot write,
      and what it is going to write would not be seen until it was pressed. And what it leaves is a copy because the same
      block cannot be twice on the same page.
    context: >-
      Its settings are behind "Set up": a page full of buttons showing their guts reads like a machine. The row it
      creates is named after the first line the button would have written, and the collection is given the default values
      that would not be left empty. Where it writes stops being offered when the button makes rows.
    scenarios:
      - title: The collection requires a value for each row
        given: A button that adds rows to a collection with required properties
        when: Someone presses it
        then: The row is created with that collection's default values, without those that would be left empty
  - id: BR-de73559
    status: active
    title: Typing the sign changes the shape of the line, not which line it is
    rule: >-
      The signs used when writing by hand —`#`, `-`, `1.`, `>`, `---`, and `**`, `*`, `` ` ``, `~~` inside the line—
      convert what is written into what they represent and the signs go away with them. The converted line remains the
      same one: it keeps who it is, its colors and what was commented on it. Undoing right afterwards gives back the sign
      exactly as it was typed.
    why: >-
      Leaving the asterisks in view is answering only half of what was asked; and giving the line a new identity would
      break the links to that block and leave orphaned what was commented on it. Undoing has to give back what was typed
      because sometimes what was wanted was the sign.
    context: >-
      Inside a code block no conversion happens: what is typed there is what was meant, sign by sign.
  - id: BR-e1147d1
    status: active
    title: A document is read inside the page
    rule: >-
      An attached document is read inside the page, pages can be turned, it can be viewed full screen and it is downloaded
      whole with one click keeping its original name.
    why: A manual or a contract is consulted while writing about it.
  - id: BR-e5e524e
    status: active
    title: The line written under an image is also what is read aloud
    rule: >-
      The single line written under an image is at once its visible caption and the text that is read to whoever cannot
      see it.
    why: Asking for the same sentence twice is how a page ends up with a caption and no alternative text.
  - id: BR-ea2b093
    status: active
    title: A link is asked for in a single question
    rule: >-
      Placing a link over what is selected opens a field that asks where it goes, and that field accepts both an address
      and the name of a page of the app: if what is typed is an address it is linked as is, and if it is not, the pages are
      searched to pick one. What is not any place that can be gone to is rejected with a message instead of being written.
    why: >-
      From where whoever writes stands, an address and the name of a page answer the same question —where should this
      lead—, and having to say beforehand which of the two it is would be a question about the machine. A broken link
      stored silently is worse than not allowing it to be stored.
    context: A link can lead to the web, to an email or to a page of this app.
  - id: BR-eab444c
    status: active
    title: What is pasted merges with the writing where it lands
    rule: >-
      Pasting plain text merges what is pasted with the writing where it lands: the first line continues the block the
      cursor is in and the last one joins with what followed, so pasting a word in the middle of a sentence does not split
      it. Only the middle lines form blocks of their own. A Markdown paste, however, arrives as whole blocks.
    why: >-
      A block that grows with the size of what is pasted ends up longer than the page accepts, and then it cannot be saved:
      the bigger the paste, the surer the loss. And a word pasted into a sentence is part of the sentence, not a new
      sentence.
    context: A heading or a list pasted as Markdown are blocks, and so they do not merge into the paragraph where they land.
  - id: BR-f1c0b40
    status: active
    title: The index is read from the page, not stored
    rule: >-
      A page can have an index of its headings. The index does not store the list: it reads it from the page's headings
      every time it is shown and is redone while someone writes.
    why: >-
      Storing the list would be storing the same thing twice, and it would go stale as soon as a title is corrected; an
      index that lies is worse than having no index.
    context: >-
      Each line of the index leads to the heading it names and leaves the cursor there, because whoever arrives at a
      heading usually wants to write in it. The hierarchy is shown with indentation per level.
    scenarios:
      - title: Page without headings
        given: A page that does not have headings yet
        when: The index is inserted
        then: The index says there are no headings yet, and fills itself in when the first one is written
  - id: BR-f2b2986
    status: active
    title: A collection is a page with a shape, viewed from where it is named
    rule: >-
      A collection is created as a page and its shape is defined in the same act. It starts with the minimum: the name,
      which is the title of the page that each row is, and a column of its own. The block that shows it inside another
      page does not store its rows: it stores which collection it is and through which view it is looked at.
    why: >-
      A page that was going to be a collection and was left without a shape is indistinguishable from any other, and nobody
      would know it was left half done. And guessing columns is deciding for whoever writes it what it will be used for.
    context: >-
      The same collection can be shown on several pages and several times on one. Showing one that lives elsewhere first
      asks whether that page is a collection; if it is not, it says so instead of leaving a gap. A block can switch between
      keeping the collection in view and leaving only the link to its page, without the collection being touched.
    scenarios:
      - title: The chosen page is not a collection
        given: Someone asks to show a collection that lives elsewhere
        when: They choose a page that has no shape
        then: Nothing is inserted and it is explained that that page is not a collection
  - id: BR-f5cb934
    status: active
    title: Inserting a block does not replace the one that was there
    rule: >-
      Putting something on a page when a block is selected places it below that block, never on top of it. What the page
      already held is not lost.
    why: >-
      A selected block is what someone is looking at, not a gap to drop the next thing into. Replacing it makes work
      disappear without notice.
    scenarios:
      - title: Second file uploaded with a block chosen
        given: A page with a document selected
        when: Another file is uploaded
        then: The new file ends up below and the document stays on the page
  - id: BR-f6955e5
    status: active
    title: A pasted link offers three forms
    rule: >-
      When pasting an address on its own, the page writes it as a link and offers to show it as a link, as a card or
      embedded inside the page. The same choice remains available afterwards from the block's menu.
    why: >-
      Whoever pastes a link does not always know at that second what they want from it, and writing it first as a link
      means that continuing to write leaves exactly what was pasted.
    context: >-
      The choice is only offered for safe addresses, which are the only ones the page can query or show inside itself.
    scenarios:
      - title: Link pasted and left as it was
        given: An address pasted on an empty line
        when: Whoever writes keeps writing without choosing anything
        then: The line keeps the link exactly as it was pasted
  - id: BR-fdb811b
    status: active
    title: A link is written the way it is written everywhere
    rule: >-
      Writing the name in brackets followed by the address in parentheses leaves the name linked to that address, and a
      link among the words looks like a link.
    why: >-
      It is the way people already write links by hand in other tools, and a link that cannot be told apart from the text
      does not invite being followed.
  - id: BR-1557ee4
    status: superseded
    title: Every block has its own id
    rule: >-
      Each block of a page has an id that it shares with no other block on the same page. It receives it when written,
      whether a person writes it in the editor, the API or an agent, and keeps it as long as it exists. If a page arrives
      whole with two blocks having the same id, the second receives a new one. A change that inserts or replaces blocks
      cannot bring the id of another block that is already on the page: it is rejected, saying which. Moving a block
      together with another that it contains moves it only once, along with what it carries.
    why: >-
      A block is reached through its id: the link that is copied, the search that finds it and the agent that cites it
      point to it and not to the whole page. Two blocks with one id are a link that nobody knows where it leads.
    context: >-
      The id is unique within its page, not in the whole database: duplicating a page or moving blocks to another keeps the
      ids. Pages that existed before this rule are completed with the block maintenance, which is run by whoever
      administers the workspace, one run at a time per workspace: two at once would give different ids to the same page.
    supersedes: BR-d44883b
    superseded_by: BR-6dd8d27
    scenarios:
      - title: Moving a list with one of its items
        given: A list and one of its items, named together
        when: They are moved to the end of the page
        then: The list moves once, with the item inside, and no id is left repeated
  - id: BR-d44883b
    status: superseded
    title: Every block has its own id
    rule: >-
      Each block of a page has an id that it shares with no other block on the same page. It receives it when written,
      whether a person writes it in the editor, the API or an agent, and keeps it as long as it exists. If two blocks
      arrive with the same id, the second receives a new one.
    why: >-
      A block is reached through its id: the link that is copied, the search that finds it and the agent that cites it
      point to it and not to the whole page. Without an id, a block cannot be pointed to.
    context: >-
      The id is unique within its page, not in the whole database: duplicating a page or moving blocks to another keeps the
      ids. Pages that existed before this rule are completed with the block maintenance, which is run by whoever
      administers the workspace.
    superseded_by: BR-1557ee4
    superseded_reason: >-
      A change could bring a block with the id of another on the same page, and moving a block together with one of those
      it contains copied it. Now the first is rejected and the second is moved once.
    scenarios:
      - title: A block written by the API without an id
        given: A page created by the API with paragraphs without an id
        when: It is saved
        then: Each paragraph ends up with an id of its own
      - title: Two blocks with the same id
        given: A content that brings two blocks with the same id
        when: It is written to the page
        then: The first keeps its id and the second receives a new one
