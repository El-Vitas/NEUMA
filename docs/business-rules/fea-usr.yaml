id: FEA-USR
name: Users
purpose: Defines the system's user management rules.
scope: users
rules:
  - id: BR-009
    status: active
    title: Unique email
    rule: No two users with the same email can exist in the system.
    why: >-
      The email is the unique identifier of each account. A duplicate email would cause authentication and account
      recovery conflicts.
    scenarios:
      - title: Registration with an existing email
        given: A user registered with email test@test.com
        when: A new user tries to register with the same email test@test.com
        then: The system rejects the registration, indicating that the email is already in use, and does not create the account
      - title: Registration with a new email
        given: No user exists with email nuevo@test.com
        when: A user tries to register with email nuevo@test.com
        then: The system creates the account successfully and returns an AuthSession
  - id: BR-010
    status: active
    title: Name length
    rule: The user name must be between 2 and 100 characters long.
    why: A name that is too short is not informative; a name that is too long affects the interface.
  - id: BR-011
    status: active
    title: Email format
    rule: The email must have a valid format and at most 255 characters.
    why: Standard email format validation to avoid invalid data.
  - id: BR-014
    status: active
    title: Own profile
    rule: A user can only view their own profile.
    why: Privacy — a user must not be able to access another user's data.
  - id: BR-5198703
    status: active
    title: The first administrator is created from the server
    rule: >-
      On a new installation, the first administrator is created with a command on the server, and only while no
      administrator exists. The password is delivered through standard input, never written as an argument or in the
      terminal, so that it does not end up in the history or in plain view.
    why: >-
      With registration closed there is no other entry point, and it has to be one that only whoever operates the server
      uses and that closes by itself once used.
    context: Once an administrator exists, the command refuses and accounts are created from the application.
    supersedes: BR-013
    scenarios:
      - title: New installation
        given: A database with no administrator
        when: Whoever operates the server runs the command with an email, a name and the password through standard input
        then: The account is created with the administrator role and can already sign in to the portal
      - title: An administrator already exists
        given: A database with at least one administrator
        when: Someone runs the command
        then: It refuses, explains that accounts are created from the application, and creates nothing
      - title: Password typed in the terminal
        given: The command is run with nothing on standard input
        when: It waits for the password from the terminal
        then: It refuses and shows how to deliver it through standard input
  - id: BR-6925d74
    status: active
    title: Only an administrator creates accounts
    rule: >-
      Nobody can create an account for themselves. Accounts are created by an administrator, who chooses the role of each
      one; whoever creates the account does not end up with the new person's session, who signs in on their own with the
      email and password they were given.
    why: >-
      Neuma holds an organization's internal knowledge. With open registration, anyone who reached the server could
      create an account and read all the internal spaces.
    context: >-
      The form for creating the account starts at the role with the least access, so that nobody receives more than they
      should through oversight.
    supersedes: BR-012
    scenarios:
      - title: Someone without an account tries to create one
        given: A person who has not signed in
        when: They try to create an account
        then: It is rejected and nothing is created
      - title: An administrator creates a worker account
        given: An administrator who is signed in
        when: They create an account and choose the worker role
        then: The account is created with that role, and the person signs in with their email and password
      - title: Someone who is not an administrator tries to create an account
        given: A worker or a client who is signed in
        when: They try to create an account
        then: It is rejected and nothing is created
  - id: BR-012
    status: superseded
    title: Default role on registration
    rule: On registration, the user is created with the CLIENT role by default.
    why: Only administrators can assign higher roles; public registration is always as a client.
    superseded_by: BR-6925d74
  - id: BR-013
    status: superseded
    title: Auto-login on registration
    rule: After successfully registering a user, the system must return a session token.
    why: The user must not have to log in separately right after registering; the transition must be immediate.
    superseded_by: BR-5198703
