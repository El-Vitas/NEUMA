id: FEA-COL
name: Escritura en vivo
purpose: >-
  Define cómo varias personas escriben la misma página a la vez y qué ocurre cuando la conexión en vivo no está
  disponible.
scope: collaboration
rules:
  - id: BR-0606cda
    status: active
    title: El texto de cada bloque lo guarda el servidor, una sola vez
    rule: >-
      Cada bloque guarda su propio texto, y el servidor es el único que guarda el estado de edición de ese texto. Un
      navegador recibe ese estado al abrir la página y lo continúa; nunca arma uno por su cuenta. Un bloque con texto
      que todavía no tiene estado de edición lo recibe del servidor la primera vez que alguien lo edita en vivo.
    why: >-
      Si cada navegador armara su propia copia del texto al encontrarlo vacío, dos personas que abren la página a la vez
      lo escribirían dos veces, y el bloque quedaría con su texto duplicado.
    supersedes: BR-1e9a26a
    scenarios:
      - title: Dos personas abren a la vez una página que nadie había abierto
        given: Una página cuyos bloques nunca se editaron en vivo
        when: Dos personas la abren al mismo tiempo y escriben en el mismo bloque
        then: Las dos ven el texto una sola vez, con lo que escribió cada una
  - id: BR-7ee2df8
    status: active
    title: La página se sigue escribiendo sin conexión en vivo
    rule: >-
      La escritura en vivo permite que varias personas trabajen la misma página a la vez y vean quién está presente. Si
      esa conexión no se puede establecer, la página se sigue escribiendo y guardando; lo único que se pierde es ver a
      los demás en el momento.
    why: >-
      La conexión en vivo es una comodidad, no la condición para trabajar. Un servidor reiniciándose no puede dejar a
      nadie sin poder escribir.
  - id: BR-8f11b30
    status: active
    title: Todo cambio entra por el mismo camino y corta una versión por racha
    rule: >-
      Todo lo que cambia una página entra por el mismo camino, lo escriba una persona en el editor, la API o un agente,
      y se guarda solo en los bloques que toca. Quien tiene la página abierta ve el cambio sin recargar. Una racha de
      edición de una persona corta una sola versión de la página, sin importar cuántos navegadores la tengan abierta, y
      guardar lo que no cambió no corta ninguna.
    why: >-
      Si un cambio pudiera llegar a lo guardado por un costado, quien tiene la página abierta no se enteraría y su
      próxima escritura lo pisaría. Y si cada navegador abierto cortara su propia versión, el mismo cambio quedaría
      varias veces en el historial.
    supersedes: BR-585748e
    scenarios:
      - title: Un agente agrega un bloque mientras alguien tiene la página abierta
        given: Una persona tiene la página abierta y escribiendo
        when: Un agente agrega un bloque al final
        then: La persona ve el bloque aparecer sin recargar, y la página guardada tiene lo de ambos
      - title: Dos personas escriben en la misma página
        given: Dos personas tienen la página abierta
        when: Una escribe una palabra y se detiene
        then: Se corta una sola versión, no una por cada navegador
  - id: BR-bacaeed
    status: active
    title: Cada persona escribe con su nombre visible
    rule: >-
      Quien entra a escribir en vivo se anuncia con su nombre para el resto, y ese nombre se actualiza si cambia sin
      necesidad de reconectar.
    why: >-
      Ver quién más está en la página es lo que evita pisarse el trabajo, y un participante sin nombre no dice nada a
      nadie.
  - id: BR-be93570
    status: active
    title: Una página bloqueada no se escribe en vivo
    rule: >-
      Una página bloqueada se puede leer en vivo, pero el servidor rechaza todo lo que intente escribirla, venga del
      editor, de otra página o de un agente.
    why: >-
      El editor ya no deja escribir en una página bloqueada, pero eso ocurre en el navegador. Un bloqueo que solo
      respeta la pantalla lo esquiva cualquiera que hable directo con el servidor.
  - id: BR-d7afef8
    status: active
    title: Una conexión rechazada no interrumpe la escritura
    rule: >-
      Que la conexión en vivo sea rechazada no puede mostrarse como un fallo del sistema ni interrumpir a quien está
      escribiendo. La página lo refleja en su estado de conexión y sigue funcionando.
    why: >-
      Abrir una página mientras el servidor se reinicia es algo cotidiano, y presentarlo como un error hace dudar de si
      lo escrito se perdió.
  - id: BR-d985817
    status: active
    title: Un corte provoca una sola reconexión
    rule: >-
      Un corte de la conexión en vivo provoca un solo intento de reconexión, con una espera que crece entre intentos y
      un máximo de intentos. Al agotarlos, la página avisa que dejó de intentarlo.
    why: >-
      El mismo corte se conoce por más de una vía, y tratar cada aviso como un corte distinto abre varias sesiones
      compitiendo y gasta los intentos al doble de velocidad de lo que se le dijo a la persona.
    scenarios:
      - title: Un corte avisado varias veces
        given: Una página conectada en vivo
        when: La conexión se cae y el sistema se entera por más de una vía
        then: Se programa una sola reconexión y el estado de la página lo dice una sola vez
  - id: BR-1e9a26a
    status: superseded
    title: El documento en vivo lo siembra el servidor, una sola vez
    rule: >-
      La primera vez que alguien abre una página, el servidor arma su documento en vivo con lo que la página tiene
      guardado. Ningún navegador lo siembra por su cuenta.
    why: >-
      Si cada navegador sembraba el documento al encontrarlo vacío, dos personas que abrían la página a la vez lo
      escribían dos veces, y la página quedaba con todo su contenido duplicado.
    superseded_by: BR-0606cda
    scenarios:
      - title: Dos personas abren a la vez una página que nadie había abierto
        given: Una página que nunca se abrió en vivo
        when: Dos personas la abren al mismo tiempo
        then: Las dos ven el contenido una sola vez
  - id: BR-585748e
    status: superseded
    title: La página se guarda desde su documento en vivo
    rule: >-
      El contenido de una página se guarda a partir de su documento en vivo, cada vez que el servidor lo persiste. Todo
      lo que cambia el contenido desde fuera del editor —quien escribe sin conexión en vivo, los bloques que se mueven a
      otra página, lo que escribe un agente— entra a ese documento, nunca directo a lo guardado. Un cambio corta una
      sola versión, sin importar cuántas personas tengan la página abierta, y guardar lo que no cambió no corta ninguna.
    why: >-
      Lo guardado y lo que se ve en vivo son dos copias del mismo texto. Si algo escribe en una sin pasar por la otra,
      la siguiente vez que se guarda la otra pisa lo escrito. Y si cada navegador abierto guardaba su copia, el mismo
      cambio quedaba dos veces en el historial.
    superseded_by: BR-8f11b30
    scenarios:
      - title: Un agente agrega un bloque mientras alguien tiene la página abierta
        given: Una persona tiene la página abierta y escribiendo
        when: Un agente agrega un bloque al final
        then: La persona ve el bloque aparecer sin recargar, y la página guardada tiene lo de ambos
      - title: Dos personas escriben en la misma página
        given: Dos personas tienen la página abierta
        when: Una escribe una palabra
        then: Se corta una sola versión, no una por cada navegador
