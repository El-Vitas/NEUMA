id: FEA-COL
name: Live writing
purpose: >-
  Defines how several people write the same page at once and what happens when the live connection is not available.
scope: collaboration
rules:
  - id: BR-0606cda
    status: active
    title: The text of each block is stored by the server, only once
    rule: >-
      Each block stores its own text, and the server is the only one that stores the editing state of that text. A
      browser receives that state when opening the page and continues it; it never builds one on its own. A block with
      text that does not yet have an editing state receives it from the server the first time someone edits it live.
    why: >-
      If each browser built its own copy of the text upon finding it empty, two people opening the page at the same time
      would write it twice, and the block would end up with its text duplicated.
    supersedes: BR-1e9a26a
    scenarios:
      - title: Two people open at the same time a page nobody had opened
        given: A page whose blocks were never edited live
        when: Two people open it at the same time and write in the same block
        then: Both see the text only once, with what each one wrote
  - id: BR-7ee2df8
    status: active
    title: The page can still be written without a live connection
    rule: >-
      Live writing lets several people work on the same page at once and see who is present. If that connection cannot be
      established, the page can still be written and saved; the only thing lost is seeing the others in the moment.
    why: >-
      The live connection is a convenience, not the condition for working. A server restarting cannot leave anyone
      unable to write.
  - id: BR-8f11b30
    status: active
    title: Every change comes in through the same path and cuts one version per streak
    rule: >-
      Everything that changes a page comes in through the same path, whether a person writes it in the editor, the API or
      an agent, and it is stored only in the blocks it touches. Whoever has the page open sees the change without
      reloading. A person's editing streak cuts a single version of the page, no matter how many browsers have it open,
      and saving what did not change cuts none.
    why: >-
      If a change could reach what is stored from the side, whoever has the page open would not find out and their next
      write would overwrite it. And if each open browser cut its own version, the same change would end up several times
      in the history.
    supersedes: BR-585748e
    scenarios:
      - title: An agent adds a block while someone has the page open
        given: A person has the page open and is writing
        when: An agent adds a block at the end
        then: The person sees the block appear without reloading, and the stored page has what both did
      - title: Two people write on the same page
        given: Two people have the page open
        when: One writes a word and stops
        then: A single version is cut, not one per browser
  - id: BR-bacaeed
    status: active
    title: Each person writes with their name visible
    rule: >-
      Whoever joins to write live announces themselves to the others with their name, and that name is updated if it
      changes without needing to reconnect.
    why: >-
      Seeing who else is on the page is what prevents overwriting each other's work, and a participant without a name
      tells nobody anything.
  - id: BR-be93570
    status: active
    title: A locked page is not written live
    rule: >-
      A locked page can be read live, but the server rejects anything that tries to write it, whether it comes from the
      editor, from another page or from an agent.
    why: >-
      The editor no longer allows writing on a locked page, but that happens in the browser. A lock that only the screen
      respects is sidestepped by anyone who talks directly to the server.
  - id: BR-d7afef8
    status: active
    title: A rejected connection does not interrupt writing
    rule: >-
      The live connection being rejected cannot be shown as a system failure nor interrupt whoever is writing. The page
      reflects it in its connection state and keeps working.
    why: >-
      Opening a page while the server restarts is an everyday occurrence, and presenting it as an error makes people
      doubt whether what they wrote was lost.
  - id: BR-d985817
    status: active
    title: One drop causes a single reconnection
    rule: >-
      A drop of the live connection causes a single reconnection attempt, with a wait that grows between attempts and a
      maximum number of attempts. When they run out, the page warns that it stopped trying.
    why: >-
      The same drop is known through more than one route, and treating each notice as a different drop opens several
      competing sessions and burns the attempts at twice the speed the person was told.
    scenarios:
      - title: A drop reported several times
        given: A page connected live
        when: The connection goes down and the system finds out through more than one route
        then: A single reconnection is scheduled and the page's state says so only once
  - id: BR-1e9a26a
    status: superseded
    title: The live document is seeded by the server, only once
    rule: >-
      The first time someone opens a page, the server builds its live document from what the page has stored. No browser
      seeds it on its own.
    why: >-
      If each browser seeded the document upon finding it empty, two people opening the page at the same time wrote it
      twice, and the page ended up with all its content duplicated.
    superseded_by: BR-0606cda
    scenarios:
      - title: Two people open at the same time a page nobody had opened
        given: A page that was never opened live
        when: Two people open it at the same time
        then: Both see the content only once
  - id: BR-585748e
    status: superseded
    title: The page is stored from its live document
    rule: >-
      A page's content is stored from its live document, every time the server persists it. Everything that changes the
      content from outside the editor —whoever writes without a live connection, blocks that are moved to another page,
      what an agent writes— goes into that document, never directly into what is stored. A change cuts a single version,
      no matter how many people have the page open, and saving what did not change cuts none.
    why: >-
      What is stored and what is seen live are two copies of the same text. If something writes to one without going
      through the other, the next time the other is saved it overwrites what was written. And if each open browser stored
      its copy, the same change ended up twice in the history.
    superseded_by: BR-8f11b30
    scenarios:
      - title: An agent adds a block while someone has the page open
        given: A person has the page open and is writing
        when: An agent adds a block at the end
        then: The person sees the block appear without reloading, and the stored page has what both did
      - title: Two people write on the same page
        given: Two people have the page open
        when: One writes a word
        then: A single version is cut, not one per browser
