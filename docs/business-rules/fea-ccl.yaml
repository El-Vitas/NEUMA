id: FEA-CCL
name: Local cache in the browser
purpose: That what has already been read and what has just been written is neither lost nor leaked, and that the board follows the others without reloading.
scope: collections
rules:
  - id: BR-0322339
    status: active
    title: The local copy belongs to one person and is deleted on sign-out
    rule: >-
      The browser keeps a local copy of what a person read and wrote, and that copy is theirs alone. Signing out deletes
      it. If another person signs in on the same browser, the previous person's copy is deleted before anything is shown.
    why: >-
      A shared browser must not show one person what another read, even if the previous session ended without signing
      out.
    context: >-
      The copy is not encrypted, just like the session cookies of the same browser. Without storage available, the copy
      lives only in the tab and the interface says so when there are unsent changes.
    scenarios:
      - title: Another person enters the same browser
        given: Ana closed the tab without signing out and her local copy is still in the browser
        when: Beto signs in and opens a page
        then: Ana's copy is deleted and Beto only sees his own
      - title: Signing out deletes the copy
        given: Ana has a local copy
        when: Ana signs out
        then: The browser no longer keeps anything of Ana's
  - id: BR-141db89
    status: active
    title: A collection of up to 10,000 rows is filtered, sorted, grouped and counted by the browser
    rule: >-
      A collection with up to 10,000 rows visible to whoever opens it, whose filter, sort and grouping do not use
      formulas, rollups or relations and with no text search active, is fetched complete just once, ordered by its
      manual order. From there the browser filters, sorts, groups, counts and computes the table footers without asking
      the server for anything, with the same result as the server. Above the threshold, with a text search, or with a
      filter, sort or grouping that only the server knows how to resolve, the view keeps asking the server.
    why: >-
      With rows already in the browser, changing a quick filter or asking for more rows does not have to cost a round
      trip, and a collection of 100,000 rows does not fit in the tab.
    context: >-
      The first load is still drawn on the server and, from there, the browser switches to its own computation without
      flicker. Changing the view's saved filter, a reset of the changes, a loss of access or a change of the manual order
      by another person fetch the rows again.
    scenarios:
      - title: Collection of 2,000 rows
        given: A board of 2,000 cards with no search
        when: The person changes the quick filter
        then: The cards are filtered and the column counts change without any request
      - title: Large collection
        given: A table of 10,001 rows
        when: The person opens it
        then: The view asks the server for the rows in pages, as before
      - title: Text search
        given: A small collection with a text search active
        when: The person searches for a word with accents
        then: The server responds, because only it normalizes accents and capitalization
  - id: BR-44999db
    status: active
    title: A view's changes wait for the connection except those involving lists
    rule: >-
      Changing a cell's single value, moving a card or a row without touching lists and creating a row are shown
      instantly, are saved in the browser before being sent and are sent in order when there is a connection, each one
      with the same identifier on every attempt. A change that depends on what enters and leaves a list (several
      options, people, relations or files) needs a connection; without one it is undone on screen and the person is told
      it was not saved. A change that the server rejects is set aside with its text so that the person can decide.
    why: >-
      A person editing a table without a connection must not lose what they wrote nor be left with a screen that lies,
      and a list can only be changed without overwriting another person if the server applies it.
    context: >-
      A rejection does not hold back the following changes, because each cell or place is independent of the others,
      unlike the text of a document. After a rejection the view reads the server's rows again.
    scenarios:
      - title: Editing a cell without a connection
        given: A person edits the status of a row and there is no connection
        when: The connection returns
        then: The change is sent once and the row shows the new status
      - title: Changing a multiple selection without a connection
        given: A person adds an option to a multiple-selection cell and there is no connection
        when: They confirm the option
        then: The cell goes back to its previous value and the person sees that the change needs a connection
  - id: BR-59740bf
    status: active
    title: What was written and not answered survives closing the tab
    rule: >-
      Every change a person writes is saved in the browser before being sent and is deleted only when the server
      responds. If the connection fails or the tab is closed, when the page is opened again with a connection the change
      is sent exactly as it was. When signing out with unsent changes, the person sees how many there are and decides
      whether to lose them.
    why: Writing without a connection cannot cost text, and losing it must always be the person's decision.
    context: It is sent with the same identifier it already had, so sending it twice does not apply it twice.
    scenarios:
      - title: Editing without a connection
        given: The connection dropped while Ana was editing a page
        when: Ana closes the tab and opens the page again with a connection
        then: The text she wrote appears on the page and nothing is left pending in the browser
      - title: Signing out with unsent changes
        given: Ana has 3 unsent changes
        when: Ana chooses to sign out
        then: She is told there are 3 and that they will be lost, and she does not sign out until she confirms
  - id: BR-6429f99
    status: active
    title: A row that another person changes is placed without reloading the view
    rule: >-
      When another person changes a row, the view of whoever is looking (table, list, gallery, board, calendar or
      timeline) places that row in its group, its position or its days without redrawing, with the same filter and sort
      rules the server uses. If the browser cannot know where the row goes (there is a search, the filter or the sort
      depend on other rows, the group is not drawn, the days window only shows the first rows or the order is manual), it
      asks the server for the view again, and only for the affected columns when the order is manual.
    why: >-
      Watching a row change must not cost a query for the whole view for each person looking, nor make what the other
      person has on screen jump.
    context: >-
      The group counts and the number of rows without a date are requested again from the server when the content of any
      group changes. The chart only shows counts, so it is redrawn from the server.
    supersedes: BR-4950377
    scenarios:
      - title: Row with a changed date in a calendar
        given: A calendar shows September and another person moves a row to October
        when: The change notice arrives
        then: The row leaves September without reloading the calendar and the count of rows without a date is updated
      - title: Truncated window
        given: A timeline shows only the first rows of its window
        when: Another person creates a row inside the window
        then: The browser asks the server for the view again
  - id: BR-6beb537
    status: active
    title: A collection already seen is painted from the local copy and brought up to date afterwards
    rule: >-
      When opening a collection the person has already seen, the view is drawn immediately with what they last saw,
      marked as updating, while the server responds. Afterwards only the changes since the last read are requested and
      are placed in the copy with the same rules the server uses. If the server cannot describe the changes, or a place
      depends on an order that only the server knows, the server's response replaces the copy.
    why: Returning to a collection must not show an empty page nor repeat the full read of what did not change.
    context: >-
      A copy that has gone 30 days without being confirmed with the server is not shown. The first visit without a copy
      is drawn with what the server reads, with no blank page.
    scenarios:
      - title: Returning to a board already seen
        given: A person saw the board yesterday and another has moved a card since then
        when: The first one opens it again
        then: They see yesterday's board instantly with the card already moved, without waiting for the full read
      - title: Manual order
        given: A new card arrived in a column with manual order
        when: The person opens the board from the copy
        then: The copy does not place that card and waits for the server's response
  - id: BR-8f1fc0c
    status: active
    title: Computed values are not trusted to the local copy
    rule: >-
      Formulas and rollups are computed every time they are read and the local copy does not store them. A view painted
      from the copy shows those cells empty until the server's read arrives. When a collection that feeds a rollup
      changes, the view reads the complete rows again.
    why: >-
      A computed value depends on other rows that the copy does not see, so showing it stored could display a result that
      is no longer true.
    context: >-
      No formula or rollup takes part in the filter, sort or grouping of a view that the browser resolves on its own.
    scenarios:
      - title: Formula in a view painted from the copy
        given: A collection with a formula column already seen
        when: The person opens it again
        then: The column appears empty at first and is filled with the value the server computes
  - id: BR-97a194c
    status: active
    title: A row that a new read stops citing is confirmed with the server
    rule: >-
      When the server redraws a view and no longer includes rows that the local copy stored for that same question, the
      browser asks the server, with the version it stores for each one, which of those rows the person can no longer open
      and immediately deletes the ones the server points out. Rows that merely left the view but are still readable are
      kept. Each stored row carries the version the server gave it and never a version invented by the browser.
    why: >-
      Removing a permission does not notify whoever already read the row, and a local copy cannot keep showing what is no
      longer allowed.
    context: >-
      If the server does not respond nothing is deleted, because it is not known; the next read asks again. A calendar or
      a timeline painted from the copy is brought up to date just like the rest of the views.
    scenarios:
      - title: Row closed to a person
        given: A person has in their copy a table with a row that another person stops sharing with them
        when: The person opens the table again and the server draws it without that row
        then: The row disappears from the view and from the copy, and the other rows stay stored
      - title: Row that merely left the filter
        given: A row stopped meeting the view's filter but the person can still open it
        when: The server draws the view without it
        then: The row stays stored in the copy
  - id: BR-c60e45e
    status: active
    title: What can no longer be read is deleted from the local copy
    rule: >-
      If the server says the person lost access to a collection or a row, or cannot describe which rows changed, the
      browser immediately deletes what it stored of that collection and stops showing it. Rows that are still readable
      are stored again with the next read. Without a connection it cannot be known, so the last thing seen is shown
      until the connection returns or 30 days pass.
    why: A copy cannot keep showing what is no longer allowed to be seen, even if seeing it was legitimate before.
    context: >-
      Being without a connection is a known and accepted limitation, not a solved case. The count of readable rows that
      the server reports does not reveal rows the person cannot open.
    scenarios:
      - title: Row that becomes unreadable
        given: A person has in the copy a collection with a row that another person stops sharing
        when: The server warns that it must rebuild what it knows of the collection
        then: The row disappears from the view and from the copy
  - id: BR-cf0c9df
    status: active
    title: A change that the server rejects is not discarded
    rule: >-
      A change that the server rejects (for permissions, for validation or because what it touched no longer exists) is
      stored separately with the reason and is not resent. It stays there until the person decides what to do with it.
    why: The server rejecting a change does not authorize throwing away what the person wrote.
    context: A stored change that the browser can no longer read is not discarded either; it is set aside with the reason and the person is told.
    scenarios:
      - title: Permission removed while there was no connection
        given: Ana wrote without a connection and in the meantime lost permission to edit the page
        when: Her browser reconnects and sends the change
        then: The server rejects it, the change is set aside with the reason and is not resent
  - id: BR-4950377
    status: superseded
    title: A card that another person moves is placed without reloading the board
    rule: >-
      When another person changes a card on the board, the board of whoever is looking places that card in its column and
      its position without redrawing, with the same filter and sort rules the server uses. If the browser cannot know
      where the card goes (there is a search, the filter or the sort depend on other rows, or the column is not drawn),
      it asks the server for the view again. When the order is manual, only the affected columns are read again.
    why: >-
      Watching a card move must not cost a query for the whole view for each person looking, nor make what the other
      person has on screen jump.
    context: The column counts are requested again from the server when the content of any column changes.
    superseded_by: BR-6429f99
    scenarios:
      - title: Moving a card between columns
        given: Ana and Beto look at the same board sorted by priority
        when: Beto moves a card from Pendiente to Hecho
        then: >-
          Ana sees the card in Hecho, in the place that corresponds to it by priority, without the whole board being
          redrawn
      - title: Active search
        given: Ana searches for a word on the board
        when: Beto moves a card
        then: Ana's board asks the server for the view again
