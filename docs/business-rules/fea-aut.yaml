id: FEA-AUT
name: Authentication
purpose: Defines the authentication and access control rules
scope: auth
rules:
  - id: BR-001
    status: active
    title: Invalid credentials
    rule: The system must reject invalid credentials without revealing which field (email or password) is incorrect.
    why: Security — do not give clues about which accounts exist.
    context: >-
      Applies to the sign-in endpoint. Both a nonexistent email and an incorrect password must produce the same error
      without revealing which field is incorrect.
    scenarios:
      - title: Login with an incorrect password
        given: A user registered with email test@test.com
        when: They try to sign in with a correct email and an incorrect password
        then: The system rejects the sign-in without indicating whether the email exists
  - id: BR-002
    status: active
    title: Inactive user
    rule: 'A user with isActive: false cannot sign in.'
    why: The administrator deactivated the account; access must be blocked.
    scenarios:
      - title: Deactivated user tries to log in
        given: 'A user with isActive: false'
        when: They try to sign in with correct credentials
        then: The system rejects the sign-in, indicating that the account is inactive
  - id: BR-003
    status: active
    title: Password length
    rule: The password must be between 8 and 100 characters long.
    why: Security minimum without penalizing UX with excessive limits.
  - id: BR-004
    status: active
    title: System roles
    rule: 'There are three user roles: ADMIN, WORKER and CLIENT.'
    why: Defines the levels of access and responsibility within the system.
  - id: BR-005
    status: active
    title: ADMIN permissions
    rule: The ADMIN role has full permission over the User module and Read + Update permission over Account.
    why: The administrator needs full control over the system's accounts.
  - id: BR-006
    status: active
    title: WORKER permissions
    rule: The WORKER role has Read + Update permission over Account (their own account).
    why: An operational user manages their own account but does not administer other users.
  - id: BR-007
    status: active
    title: CLIENT access
    rule: >-
      The CLIENT role has no administrative permissions; it can only authenticate and access the own resources that each
      project defines.
    why: Extension point — each project defines which resources a client owns.
  - id: BR-008
    status: active
    title: JWT payload
    rule: The session token must contain the id, email, name and role of the authenticated user.
    why: The application needs this user data without making an additional call to the server.
  - id: BR-ea307b3
    status: active
    title: A session token only works as a session
    rule: >-
      The token that opens a session says that it is a session token, and the API only accepts as a session a token that
      says so. A token signed for something else, such as the one that allows editing a page live, does not open the API
      even if it is valid and belongs to the same user.
    why: A short-scope token that worked as a session would give more than was asked for when it was issued.
    context: A session started before this change stops being valid and one has to sign in again.
    scenarios:
      - title: The live-editing token does not open the API
        given: A user with a valid live-editing token
        when: They use it to call the API
        then: The API responds that they are not authenticated
  - id: BR-f22be9d
    status: active
    title: Each renewal changes the token, and reusing a spent one cuts off that device
    rule: >-
      Each time a session is renewed, the presented refresh token is spent and a new one is delivered. An already spent
      token that is presented again after 10 seconds cuts off that device's session, with all the tokens it had issued,
      and the other devices stay open. Signing out cuts off only the device where it is done. Changing the password cuts
      off all of the account's devices, except the browser where it was changed, which signs in again.
    why: >-
      A stolen refresh token stops working as soon as the legitimate owner renews, and signing out on one machine should
      not sign the person out of the others.
    context: >-
      During the 10 seconds after being spent, the same token receives the same new token again, because two requests
      from the same browser can cross before the cookie arrives. The access token already in use is valid until it
      expires, a few minutes. Refresh tokens from before this change do not work and one has to sign in once.
    supersedes: BR-99902bf
  - id: BR-99902bf
    status: superseded
    title: Signing out or changing the password cuts off all of the account's sessions
    rule: >-
      When signing out or changing the password, no refresh token issued earlier works again, on any device. Whoever
      changes their password stays signed in in the browser where they changed it; the other devices must sign in again.
    why: >-
      A session that cannot be cut off stays open for seven days even if the password has leaked or the machine has been
      lost. Changing the password has to lock out whoever was using it.
    context: The access token already in use is valid until it expires, a few minutes. What is cut off is the renewal.
    superseded_by: BR-f22be9d
    scenarios:
      - title: Sign-out
        given: A person with a session open on two machines
        when: They sign out on one
        then: On both machines the session stops renewing
      - title: Password change
        given: A person with an open session
        when: They change their password
        then: The earlier refresh tokens are rejected and the browser where they changed it stays signed in
