id: FEA-NTF
name: Notification inbox
purpose: That each person finds out what concerns them without having to go through the pages.
scope: avisos
rules:
  - id: BR-e8bca02
    status: active
    title: Notifications arrive instantly and are read once
    rule: >-
      Each person has an inbox with the notifications of mentions and of replies in the conversations they take part in,
      from newest to oldest, with read and unread ones. A new notification appears instantly in all of that person's
      open windows, along with the unread count. They are marked as read one by one or all at once. Each notification
      leads to the block it talks about.
    why: >-
      A mention that is found out about hours later, or that forces going through pages to find it, does not fulfill what
      it was written for.
    context: >-
      The list is bounded and requested in chunks. The unread count only counts notifications of blocks the person can
      still read, and goes up to showing 99+. There is a notification type reserved for changes in followed pages, which
      is not created yet.
    scenarios:
      - title: Live notification
        given: Luis has the application open
        when: Ana mentions him in a comment
        then: Luis's bell goes up by one without him doing anything
  - id: BR-ea7f878
    status: active
    title: An unread notification is never deleted
    rule: >-
      A notification that nobody has read is kept with no time limit. A read one is deleted ninety days after it was
      read.
    why: >-
      Deleting a pending notification means losing what someone had to attend to. Read ones are of no use to anyone after
      a while and would make the inbox grow endlessly.
    context: Deletion of read notifications runs on the server, every so often, without a separate process.
    scenarios:
      - title: Retention
        given: A notification read ninety-one days ago and another that was never read
        when: The cleanup runs
        then: The read one is deleted and the unread one is kept
