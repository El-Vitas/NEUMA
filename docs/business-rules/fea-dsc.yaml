id: FEA-DSC
name: Threaded comments
purpose: Discuss a block of a page, or some words in it, without writing on the page.
scope: comentarios
rules:
  - id: BR-2a8763f
    status: active
    title: Whoever can edit the block comments
    rule: >-
      Whoever can edit the block can open a conversation, reply, resolve it or reopen it. Whoever can only read it sees
      the conversations but does not write in them. Each person edits and deletes only their own comments; a workspace
      administrator can also delete any, but not edit it.
    why: >-
      Commenting was always writing on the block, and opening up conversations cannot give a reader more power than they
      had. That the administrator can delete is moderation, whereas editing what someone else wrote would be speaking
      for them.
    context: >-
      A deleted comment keeps its place in the conversation without text. When all the comments of a conversation are
      deleted, the conversation disappears.
    scenarios:
      - title: A reader does not comment
        given: A client can read a page but not edit it
        when: They try to comment on a block
        then: They are rejected, even though they see the existing conversations
      - title: Moderation
        given: A worker wrote a comment
        when: An administrator deletes it
        then: The comment is left without text in the conversation and the worker can no longer edit or delete it
  - id: BR-498cb88
    status: active
    title: Earlier comments become conversations without losing any
    rule: >-
      Each comment that used to be stored inside a block becomes a one-message conversation, with its text, its date and
      its place in the text. Its author is the workspace member who has exactly that name. If none or several do, the
      author becomes whoever created the block and the original name is left at the start of the message. The migration
      reports each such case and stops if the number of conversations created does not match the number of comments
      there were.
    why: >-
      A comment lost in the change is a question nobody will see again, and attributing it to the wrong person without
      saying so is worse than not attributing it.
    context: >-
      The highlights that were already in the text keep pointing to their conversation, because it keeps the same
      identifier.
    scenarios:
      - title: Ambiguous author
        given: Two members are named Ana Pérez and a comment is signed Ana Pérez
        when: It is migrated
        then: >-
          The comment keeps its text with Ana Pérez at the start, under the name of whoever created the block, and the
          migration reports it
  - id: BR-8768cda
    status: active
    title: A conversation on a hidden block does not exist for whoever cannot read it
    rule: >-
      Whoever cannot read a block does not receive its conversations in any list, nor its notifications, nor what an
      agent reports, and does not find out that they exist either. The permissions of a conversation are those of its
      block, judged every time someone asks and not when the comment was written.
    why: >-
      A conversation often says exactly what the block protects. Letting it be seen through a side path, such as a page
      list or a notification, would nullify the block's permissions.
    context: >-
      If someone loses access to a block, their notifications about it stop being shown and counted as pending.
      Replying to or resolving a conversation that cannot be read is answered the same as if it did not exist.
    scenarios:
      - title: Restricted block
        given: A block that only Ana can read and that has a conversation
        when: Luis asks for the page's conversations
        then: The conversation does not appear and there is no trace that it exists
  - id: BR-a3ffca9
    status: active
    title: Mentioning a person notifies them only if they can read the block
    rule: >-
      A comment, or page text, that mentions a person with @ creates a notification for them if that person can read the
      block. Nobody receives a notification for what they wrote themselves. Whoever replies in a conversation notifies
      those who already took part in it, and a person who is mentioned and is a participant receives a single
      notification, the mention.
    why: >-
      A mention without a notification is a mention nobody sees, and notifying someone who cannot read the block would
      reveal that it exists and what is being discussed.
    context: >-
      Page text that mentions someone notifies only once per block, even if it is saved many times. Editing a comment
      notifies only those it mentions for the first time. A comment mentions at most twenty people.
    scenarios:
      - title: Mention of someone who cannot see the block
        given: A restricted block that Luis cannot read
        when: Ana comments on it mentioning Luis
        then: Luis receives no notification
  - id: BR-a903a10
    status: active
    title: A comment opens a conversation and replies continue it
    rule: >-
      Commenting on a block, or on some words in it, opens a conversation. Whoever comes afterwards replies within the
      same conversation, and anyone who can comment marks it as resolved or reopens it. A resolved conversation stops
      appearing in the list of open ones and the words it quoted stop being highlighted, but nothing that was said is
      lost.
    why: >-
      A flat list of loose comments does not distinguish what is answered from what was left pending, and forces reading
      everything to know what is missing.
    context: >-
      If the quoted words are deleted from the page, the conversation continues and shows what it quoted. A
      conversation about the whole block quotes nothing.
    scenarios:
      - title: Reply and resolve
        given: Ana commented on a paragraph with a question
        when: Luis replies in that conversation and Ana marks it as resolved
        then: The conversation keeps both messages in order and leaves the list of open ones
