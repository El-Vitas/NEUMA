id: FEA-XXX
name: Feature name
purpose: What business rules this file groups and why it exists.
scope: module-name
rules:
  - id: BR-XXX
    status: draft
    title: Short rule title
    rule: Normative statement of the rule (the system must...).
    why: Business reason behind the rule.
    context: >-
      Optional context: scope, edge cases, related decisions or implementation status.
    scenarios:
      - title: Happy scenario
        given: Initial state of the system
        when: User or system action
        then: Verifiable expected result
      - title: Rejection scenario
        given: Initial state that violates the rule
        when: Action that tries to violate it
        then: The system rejects the action and communicates the reason
