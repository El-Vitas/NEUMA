id: FEA-MRC
name: The mark of a page or a space
purpose: >-
  Defines what a page or a space can carry as its visible face, who sets it and what happens when what is stored cannot
  be drawn.
scope: spaces
rules:
  - id: BR-087316a
    status: active
    title: An agent is told which spaces it can read, not how they are drawn
    rule: The response the system gives an agent about spaces does not include the mark.
    why: An agent decides where to look, not what to look at. Sending it the mark is spending on something it cannot use.
  - id: BR-0f51e85
    status: active
    title: The cover moves only when asked to move
    rule: >-
      A page's cover is an image and nothing more until someone asks to reposition it. Only then does it respond to
      dragging, and the framing is saved only when confirmed.
    why: >-
      An image that is reframed and saved with any drag changes the page by accident, and on a touch screen it prevents
      scrolling it with a finger. Repositioning is a decision, not something that happens by passing over it.
    context: >-
      It also implies that the cover takes up no space when it does not exist. The control lives among the page's other
      controls.
    scenarios:
      - title: Dragging without having asked for anything
        given: A page with a cover
        when: The image is dragged
        then: The framing does not change and the page scrolls as usual
      - title: Repositioning and discarding
        given: Someone repositioning the cover
        when: They change the framing and cancel
        then: The saved framing remains the previous one
  - id: BR-2cb669a
    status: active
    title: Whoever can create a space can rename it and mark it
    rule: >-
      Changing the name or the mark of a space is allowed to whoever could have created one, and only on spaces they can
      already read.
    why: >-
      The name and the mark of a space are seen by the whole team. Whoever has no voice to create a space has none to
      change how the others see it either.
    scenarios:
      - title: Someone who only reads
        given: A person with read permission
        when: They try to rename or mark a space
        then: It is rejected and they are told they have no access
  - id: BR-74d10b4
    status: active
    title: A space is marked the same way as a page
    rule: >-
      The mark of a space follows the same contract as that of a page: an emoji, an image or a library symbol with a
      color. There is no second way to describe a mark.
    why: >-
      The tree draws pages and spaces side by side. Two different contracts would let a space carry something that no page
      can draw, and whoever looked at it would see a gap where a face should be.
    context: >-
      The shared schema that validates a page's mark is the same one used by the spaces domain; it is reused instead of
      copied.
    scenarios:
      - title: A symbol with color
        given: A space with no mark
        when: Someone chooses a library symbol and a color
        then: The space ends up with that mark and it is drawn in the tree at the same size as a page's
      - title: A shape that does not exist
        given: Any space
        when: A mark arrives whose kind is neither emoji, image nor symbol
        then: The change is rejected and it is said that the mark is not valid
  - id: BR-a228876
    status: active
    title: A space does not carry an image as its mark
    rule: The window that marks a space does not offer uploading an image, even though the mark contract allows it.
    why: >-
      A space is drawn at the size of a line of text. A photograph there cannot be read: whoever uploads it thinks they
      put something recognizable and sees a smudge.
    context: >-
      The window is the same one a page uses; whoever opens it decides whether to offer the image. An image mark stored
      by another route is still drawn.
  - id: BR-d05039e
    status: active
    title: A mark that cannot be drawn leaves the space without a mark, it does not empty the list
    rule: >-
      When what is stored as a mark does not fit the contract, that space is delivered without a mark and the list of
      spaces is delivered complete.
    why: >-
      A mark is an ornament. For an ornament stored by an earlier version to leave someone unable to see their spaces
      turns a detail into an outage.
    context: It already happened once with marks stored before the symbol existed, and the tree was left empty.
