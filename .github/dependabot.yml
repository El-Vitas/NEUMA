# Every version is pinned (actions by SHA, images by digest, packages by lock file); Dependabot is how they move,
# always as a pull request to develop. Minor and patch updates arrive together; a major one arrives on its own.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/portal
      - /packages/db
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
